<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Wild Wings</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0c4a6e; color: #fff;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(12px, env(safe-area-inset-top)) 18px 0;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55), 0 0 12px rgba(0, 0, 0, 0.25);
  }
  .label { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; color: rgba(255, 255, 255, 0.85); }
  .value { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .right { text-align: right; }
  .mid { text-align: center; padding-top: 2px; }
  #hearts { font-size: 18px; letter-spacing: 3px; color: #ff5a7a; }
  #biome { margin-top: 2px; font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.9); }

  #pills {
    position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 58px); left: 18px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    pointer-events: none;
  }
  .pill {
    display: none; position: relative; overflow: hidden;
    font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
    padding: 4px 10px; border-radius: 999px; color: #fff;
    background: rgba(10, 20, 40, 0.55); border: 1px solid rgba(255, 255, 255, 0.35);
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .pill.on { display: inline-block; }
  .pill .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: currentColor; }

  .btn {
    position: fixed; right: 14px; width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(10, 20, 40, 0.45);
    color: #fff; font-size: 17px; z-index: 5; padding: 0;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #sound { top: calc(max(12px, env(safe-area-inset-top)) + 58px); }
  #gyro { top: calc(max(12px, env(safe-area-inset-top)) + 106px); }
  #gyro.on { border-color: rgba(94, 234, 212, 0.9); background: rgba(20, 184, 166, 0.35); }
  #gyroLabel {
    position: fixed; right: 60px; top: calc(max(12px, env(safe-area-inset-top)) + 117px);
    font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #5eead4;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); pointer-events: none;
  }

  #banner {
    position: fixed; left: 0; right: 0; top: 30%;
    text-align: center; font-size: clamp(28px, 8.5vw, 56px); font-weight: 900; letter-spacing: 0.12em;
    color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.8);
    opacity: 0; pointer-events: none;
  }
  #banner.show { animation: banner 1.6s ease-out; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(0.6); }
    15% { opacity: 1; transform: scale(1.06); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.12); }
  }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(8, 30, 60, 0.35), rgba(8, 30, 60, 0.85));
    transition: opacity 0.35s;
  }
  .overlay.hidden { opacity: 0; }
  h1 { margin: 0; font-size: clamp(44px, 13vw, 90px); line-height: 0.9; font-weight: 900; letter-spacing: -0.02em; }
  h1 .a { color: #fff; text-shadow: 0 0 18px rgba(56, 189, 248, 0.8); }
  h1 .b {
    background: linear-gradient(90deg, #5eead4, #38bdf8, #fbbf24);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
  }
  .sub { margin: 18px 0 0; color: #cfe8ff; font-size: 15px; max-width: 360px; line-height: 1.5; }
  .tip { margin: 10px 0 0; color: #5eead4; font-size: 13px; font-weight: 700; }
  .kicker { letter-spacing: 0.24em; font-weight: 800; font-size: 14px; color: #fbbf24; text-shadow: 0 0 12px rgba(251, 191, 36, 0.6); }
  .big { font-size: clamp(56px, 16vw, 96px); font-weight: 900; margin: 6px 0 0; text-shadow: 0 0 22px rgba(56, 189, 248, 0.7); font-variant-numeric: tabular-nums; }
  .newbest { margin-top: 6px; color: #fde047; font-weight: 800; letter-spacing: 0.16em; font-size: 13px; text-shadow: 0 0 10px rgba(253, 224, 71, 0.6); }
  .cta {
    margin-top: 26px; padding: 13px 28px; border-radius: 999px;
    font-weight: 800; letter-spacing: 0.14em; font-size: 14px; color: #fff;
    background: linear-gradient(90deg, #14b8a6, #0ea5e9);
    box-shadow: 0 0 30px rgba(14, 165, 233, 0.5);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 46px rgba(14, 165, 233, 0.75); } }
  .legend { display: flex; gap: 10px 16px; flex-wrap: wrap; justify-content: center; margin-top: 24px; font-size: 13px; color: #cfe8ff; max-width: 420px; }
  .legend b { font-weight: 800; }
  .gone { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div><div class="label">SCORE</div><div class="value" id="score">0</div></div>
  <div class="mid"><div id="hearts">♥♥♥</div><div id="biome">THE OCEAN</div></div>
  <div class="right"><div class="label">BEST</div><div class="value" id="best">0</div></div>
</div>
<div id="pills"></div>
<button class="btn" id="sound" type="button" aria-label="Toggle sound">🔊</button>
<button class="btn gone" id="gyro" type="button" aria-label="Toggle tilt steering" title="Tilt steering">📱</button>
<div id="gyroLabel" class="gone">TILT</div>
<div id="banner"></div>

<div class="overlay" id="menu">
  <h1><span class="a">WILD</span><br /><span class="b">WINGS</span></h1>
  <p class="sub" id="howto"></p>
  <p class="tip gone" id="gyroTip">Tap 📱 to steer by tilting your phone</p>
  <div class="cta" id="startCta">TAP TO START</div>
  <div class="legend">
    <span><b style="color:#fde047">●</b> Seed +5</span>
    <span><b style="color:#5eead4">🛡️</b> Shield</span>
    <span><b style="color:#f472b6">🧲</b> Magnet</span>
    <span><b style="color:#a3e635">🐣</b> Tiny</span>
    <span><b style="color:#c4b5fd">👻</b> Ghost</span>
    <span><b style="color:#93c5fd">⏱️</b> Slow-mo</span>
    <span><b style="color:#fbbf24">×2</b> Double</span>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="kicker">GROUNDED!</div>
  <div class="big" id="finalScore">0</div>
  <div class="newbest gone" id="newBest">★ NEW BEST ★</div>
  <p class="sub" id="overStats"></p>
  <div class="cta" id="retryCta">TAP TO RETRY</div>
</div>

<script>
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const verb = isTouch ? 'TAP' : 'CLICK';
  const $ = (id) => document.getElementById(id);
  $('startCta').textContent = verb + ' TO START';
  $('retryCta').textContent = verb + ' TO RETRY';
  $('howto').textContent = isTouch
    ? 'Drag anywhere to fly your bird. Soar over the ocean, forest, city and snowy peaks, dodge whatever gets in your way and grab power-ups!'
    : 'Steer your bird with the mouse, arrow keys or WASD. Soar over the ocean, forest, city and snowy peaks, dodge whatever gets in your way and grab power-ups!';
  if (isTouch) { $('gyroTip').classList.remove('gone'); $('gyro').classList.remove('gone'); }

  const canvas = $('c');
  const ctx = canvas.getContext('2d');
  const el = {
    score: $('score'), best: $('best'), hearts: $('hearts'), biome: $('biome'), pills: $('pills'),
    banner: $('banner'), menu: $('menu'), over: $('over'),
    finalScore: $('finalScore'), newBest: $('newBest'), overStats: $('overStats'),
    gyro: $('gyro'), gyroLabel: $('gyroLabel'),
  };

  // ---------- Layout (world units, scaled to fit any screen) ----------
  let W = 0, H = 0, dpr = 1, scale = 1, VW = 0, VH = 0, groundY = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    scale = clamp(Math.min(H / 640, W / 480), 0.5, 1.8);
    VW = W / scale; VH = H / scale;
    groundY = VH * 0.88;
  }
  window.addEventListener('resize', resize);

  // ---------- Sound ----------
  let actx = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('wingsMuted') === '1'; } catch (e) {}
  function initAudio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain();
        master.gain.value = 0.6;
        master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, endFreq, dur, type = 'sine', vol = 0.12, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, fromFreq, toFreq, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(fromFreq, t0);
    filter.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(g).connect(master);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }
  const lastSfx = {};
  const once = (k, ms) => { const n = performance.now(); if (n - (lastSfx[k] || 0) < ms) return false; lastSfx[k] = n; return true; };
  const sfx = {
    start: () => [440, 554, 659, 880].forEach((f, i) => tone(f, f * 1.01, 0.12, 'triangle', 0.07, i * 0.07)),
    seed: () => once('seed', 45) && tone(1200 + Math.random() * 200, 1700, 0.08, 'sine', 0.06),
    power: () => { tone(500, 1200, 0.2, 'triangle', 0.08); tone(750, 1800, 0.25, 'sine', 0.06, 0.08); },
    hit: () => { noise(0.35, 0.35, 3000, 200); tone(400, 90, 0.35, 'square', 0.06); },
    smash: () => { noise(0.3, 0.3, 6000, 400); tone(900, 200, 0.25, 'triangle', 0.06); },
    warn: () => once('warn', 300) && (tone(880, 880, 0.08, 'square', 0.04), tone(880, 880, 0.08, 'square', 0.04, 0.14)),
    biome: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.08, i * 0.1)),
    splash: () => once('splash', 200) && noise(0.4, 0.12, 2500, 300),
    die: () => { noise(0.8, 0.4, 2000, 80); tone(600, 80, 0.8, 'sawtooth', 0.06); },
    gameOver: () => [392, 330, 262].forEach((f, i) => tone(f, f * 0.98, 0.22, 'triangle', 0.08, 0.6 + i * 0.18)),
    end: () => tone(700, 250, 0.3, 'triangle', 0.05),
  };

  // ---------- Power-ups (all temporary) ----------
  const POWERS = {
    shield: { icon: '🛡️', label: 'SHIELD', color: '#5eead4', time: 8 },
    magnet: { icon: '🧲', label: 'MAGNET', color: '#f472b6', time: 10 },
    tiny:   { icon: '🐣', label: 'TINY', color: '#a3e635', time: 8 },
    ghost:  { icon: '👻', label: 'GHOST', color: '#c4b5fd', time: 6 },
    slow:   { icon: '⏱️', label: 'SLOW-MO', color: '#93c5fd', time: 6 },
    double: { icon: '×2', label: 'DOUBLE', color: '#fbbf24', time: 10 },
  };
  const timers = {};
  const pillEls = {};
  for (const k in POWERS) {
    timers[k] = 0;
    const p = document.createElement('div');
    p.className = 'pill';
    p.style.color = POWERS[k].color;
    p.innerHTML = `${POWERS[k].icon} ${POWERS[k].label} <span class="t"></span>s<span class="bar"></span>`;
    el.pills.appendChild(p);
    pillEls[k] = { root: p, t: p.querySelector('.t'), bar: p.querySelector('.bar') };
  }

  // ---------- Biomes ----------
  const BIOME_LEN = 7000; // world units of flight per biome
  const BIOMES = ['ocean', 'forest', 'city', 'peaks'];
  const BIOME_NAMES = { ocean: 'THE OCEAN', forest: 'THE FOREST', city: 'THE CITY', peaks: 'SNOWY PEAKS' };

  // ---------- State ----------
  let state = 'menu', overReadyAt = 0;
  let dist = 0, bonus = 0, seedsGot = 0, powersGot = 0, score = 0, time = 0, shake = 0;
  let biomeIdx = 0, prevBiome = 'ocean', biomeBlend = 1, loops = 0;
  let nextSpawn = 0, powerCd = 6;
  let obstacles = [], seeds = [], bubbles = [], particles = [], floaters = [];
  let best = 0;
  try { best = Number(localStorage.getItem('wingsBest')) || 0; } catch (e) {}
  el.best.textContent = best;

  const bird = { x: 0, y: 0, tx: 0, ty: 0, vy: 0, tilt: 0, flap: 0, size: 1, hearts: 3, inv: 0, alive: true, spin: 0, fallV: 0 };
  const keys = {};

  function curBiome() { return BIOMES[biomeIdx % BIOMES.length]; }
  function difficulty() { return clamp(dist / 40000, 0, 1); }
  function worldSpeed() { return lerp(260, 470, difficulty()) * (timers.slow > 0 ? 0.55 : 1); }
  function gapSize() { return lerp(270, 175, difficulty()); }

  function reset() {
    obstacles = []; seeds = []; bubbles = []; particles = []; floaters = [];
    dist = 0; bonus = 0; seedsGot = 0; powersGot = 0; score = 0;
    biomeIdx = 0; prevBiome = 'ocean'; biomeBlend = 1; loops = 0;
    nextSpawn = VW * 0.55; powerCd = rand(5, 7);
    for (const k in timers) timers[k] = 0;
    Object.assign(bird, { x: VW * 0.28, y: VH * 0.45, tx: VW * 0.28, ty: VH * 0.45, vy: 0, tilt: 0, size: 1, hearts: 3, inv: 0, alive: true, spin: 0, fallV: 0 });
    calibrateGyro();
    updateHud();
  }

  function start() {
    reset();
    state = 'playing';
    el.menu.classList.add('hidden');
    el.over.classList.add('hidden');
    sfx.start();
    banner(BIOME_NAMES.ocean);
  }

  function gameOver() {
    state = 'over';
    bird.alive = false;
    bird.fallV = -200;
    sfx.die(); sfx.gameOver();
    shake = 14;
    const isBest = score > best;
    if (isBest) {
      best = score;
      try { localStorage.setItem('wingsBest', best); } catch (e) {}
      el.best.textContent = best;
    }
    el.finalScore.textContent = score;
    el.newBest.classList.toggle('gone', !isBest);
    el.overStats.textContent = `${meters()} m flown · ${seedsGot} seeds · ${powersGot} power-ups · reached ${BIOME_NAMES[curBiome()].toLowerCase()}`;
    overReadyAt = performance.now() + 800;
    setTimeout(() => { if (state === 'over') el.over.classList.remove('hidden'); }, 900);
  }

  function meters() { return Math.floor(dist / 30); }

  function updateHud() {
    score = meters() + bonus;
    el.score.textContent = score;
    el.hearts.textContent = '♥'.repeat(Math.max(0, bird.hearts)) + '♡'.repeat(Math.max(0, 3 - bird.hearts));
    el.biome.textContent = BIOME_NAMES[curBiome()];
    for (const k in POWERS) {
      const t = timers[k], pe = pillEls[k];
      pe.root.classList.toggle('on', t > 0);
      if (t > 0) { pe.t.textContent = t.toFixed(1); pe.bar.style.width = (t / POWERS[k].time) * 100 + '%'; }
    }
  }

  function banner(text) {
    el.banner.textContent = text;
    el.banner.classList.remove('show');
    void el.banner.offsetWidth;
    el.banner.classList.add('show');
  }

  function burst(x, y, color, n, speed = 220, g = 300) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(speed * 0.3, speed);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.35, 0.8), max: 0.8, c: color, r: rand(1.5, 3.5), g });
    }
  }
  function feathers(x, y, n) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: rand(-160, 160), vy: rand(-220, 40), life: rand(0.8, 1.4), max: 1.4, c: Math.random() < 0.6 ? '#38bdf8' : '#e0f2fe', r: rand(2.5, 4.5), g: 160, feather: true, rot: rand(0, TAU), vr: rand(-6, 6) });
    }
  }

  // ---------- Obstacles ----------
  // Each kind knows how to move, which shapes hurt (rects, circles, triangles), and how to draw itself.
  // o.extra = extra leftward speed on top of the world scroll (for things flying at you).
  function gapCenter(g) { return rand(VH * 0.16 + g / 2, groundY - g / 2 - 24); }

  function addSeedRow(x, y, n, spacing = 38) {
    for (let i = 0; i < n; i++) seeds.push({ x: x + (i - (n - 1) / 2) * spacing, y, got: false, bob: rand(0, TAU) });
  }

  const KINDS = {
    // ---- Ocean ----
    stack: {
      shapes: (o) => [{ t: 'r', x: o.x - o.w / 2, y: o.topY + 10, w: o.w, h: groundY + 60 - o.topY }, { t: 'c', x: o.x, y: o.topY + o.w / 2, r: o.w / 2 }],
      draw(o) {
        const g = ctx.createLinearGradient(o.x - o.w / 2, 0, o.x + o.w / 2, 0);
        g.addColorStop(0, '#57534e'); g.addColorStop(0.5, '#a8a29e'); g.addColorStop(1, '#44403c');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(o.x - o.w / 2 - 8, groundY + 40);
        ctx.lineTo(o.x - o.w / 2, o.topY + o.w / 2);
        ctx.arc(o.x, o.topY + o.w / 2, o.w / 2, Math.PI, 0);
        ctx.lineTo(o.x + o.w / 2 + 8, groundY + 40);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#4d7c0f';
        ctx.beginPath(); ctx.ellipse(o.x, o.topY + 8, o.w * 0.42, 9, 0, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2;
        for (let i = 1; i < 5; i++) { const yy = o.topY + o.w / 2 + i * (groundY - o.topY) / 5; ctx.beginPath(); ctx.moveTo(o.x - o.w / 2 + 6, yy); ctx.lineTo(o.x - 4, yy + 6); ctx.stroke(); }
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.ellipse(o.x, groundY + 4, o.w * 0.75, 6, 0, 0, TAU); ctx.fill();
      },
    },
    cloud: {
      update(o) { o.flash = Math.max(0, (o.flash || 0) - 0.05); if (Math.random() < 0.012) o.flash = 1; },
      shapes: (o) => o.puffs.map((p) => ({ t: 'c', x: o.x + p.x, y: o.y + p.y, r: p.r * 0.9 })),
      draw(o) {
        if (o.flash > 0.5) {
          ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(o.x, o.y + 30);
          let yy = o.y + 30, xx = o.x;
          while (yy < o.y + 120) { xx += rand(-14, 14); yy += rand(12, 22); ctx.lineTo(xx, yy); }
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(15, 23, 42, 0.15)';
        ctx.fillRect(o.x - 70, -20, 140, o.y + 10);
        for (const p of o.puffs) {
          ctx.fillStyle = o.flash > 0.5 ? '#94a3b8' : '#475569';
          ctx.beginPath(); ctx.arc(o.x + p.x, o.y + p.y, p.r, 0, TAU); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        for (const p of o.puffs) { ctx.beginPath(); ctx.arc(o.x + p.x - p.r * 0.25, o.y + p.y - p.r * 0.3, p.r * 0.5, 0, TAU); ctx.fill(); }
      },

    fish: {

        const g = ctx.createLinearGradient(0, -12, 0, 12);
        g.addColorStop(0, '#2563eb'); g.addColorStop(1, '#bfdbfe');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0, 0, 22, 11, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(6, -22); ctx.lineTo(10, -9); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(20, -1); ctx.lineTo(42, -3); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(12, -3, 3, 0, TAU); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(13, -3, 1.5, 0, TAU); ctx.fill();

      },
    },
    gull: {
      update(o, dt) { o.t += dt; o.y = o.by + Math.sin(o.t * 3 + o.ph) * 18; },

        ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.ellipse(o.x, o.y + 2, 9, 5, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(o.x - 9, o.y + 1); ctx.lineTo(o.x - 15, o.y + 3); ctx.lineTo(o.x - 9, o.y + 4); ctx.fill();

    hawk: {

        ctx.beginPath(); ctx.moveTo(o.x - 2, o.y + 2); ctx.lineTo(o.x + 14, o.y + 18 + f * 0.5); ctx.lineTo(o.x + 20, o.y + 2); ctx.fill();

    bees: {

    beam: {

    plane: {

      draw(o) {

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath(); ctx.ellipse(o.x, o.y, 52, 10, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.moveTo(o.x + 36, o.y - 4); ctx.lineTo(o.x + 52, o.y - 26); ctx.lineTo(o.x + 58, o.y - 26); ctx.lineTo(o.x + 52, o.y); ctx.fill();
        ctx.fillRect(o.x - 40, o.y - 1, 80, 3);
        ctx.fillStyle = '#38bdf8';
        for (let i = 0; i < 6; i++) ctx.fillRect(o.x - 34 + i * 11, o.y - 6, 5, 4);
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath(); ctx.moveTo(o.x - 4, o.y + 2); ctx.lineTo(o.x + 18, o.y + 30); ctx.lineTo(o.x + 26, o.y + 30); ctx.lineTo(o.x + 16, o.y + 2); ctx.fill();
      },
    },
    // ---- Snowy peaks ----
    peak: {
      shapes: (o) => [{ t: 'tri', ax: o.x, ay: o.topY, bx: o.x - o.w / 2, by: groundY + 40, cx: o.x + o.w / 2, cy: groundY + 40 }],
      draw(o) {
        const g = ctx.createLinearGradient(o.x - o.w / 2, 0, o.x + o.w / 2, 0);
        g.addColorStop(0, '#64748b'); g.addColorStop(0.5, '#94a3b8'); g.addColorStop(1, '#475569');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(o.x, o.topY); ctx.lineTo(o.x + o.w / 2, groundY + 40); ctx.lineTo(o.x - o.w / 2, groundY + 40); ctx.closePath(); ctx.fill();
        const cap = 0.28, cy = o.topY + (groundY - o.topY) * cap, cw = (o.w / 2) * cap;
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath(); ctx.moveTo(o.x, o.topY); ctx.lineTo(o.x + cw, cy);
        ctx.lineTo(o.x + cw * 0.4, cy - 10); ctx.lineTo(o.x, cy + 4); ctx.lineTo(o.x - cw * 0.5, cy - 8); ctx.lineTo(o.x - cw, cy); ctx.closePath(); ctx.fill();
      },
    },
    icicles: {
      shapes: (o) => o.spikes.map((s) => ({ t: 'tri', ax: o.x + s.dx - s.w / 2, ay: -10, bx: o.x + s.dx + s.w / 2, by: -10, cx: o.x + s.dx, cy: s.len })),
      draw(o) {
        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(o.x - 70, -20, 140, 30);

          ctx.beginPath(); ctx.moveTo(o.x + s.dx - s.w / 2, -10); ctx.lineTo(o.x + s.dx + s.w / 2, -10); ctx.lineTo(o.x + s.dx, s.len); ctx.closePath(); ctx.fill();

          ctx.beginPath(); ctx.moveTo(o.x + s.dx - s.w / 4, -10); ctx.lineTo(o.x + s.dx - 2, -10); ctx.lineTo(o.x + s.dx - 1, s.len * 0.7); ctx.closePath(); ctx.fill();
        }

    },
    snowball: {
      update(o, dt) {
        if (o.delay > 0) { o.delay -= dt; return; }
        o.vy += 520 * dt; o.y += o.vy * dt; o.rot += dt * 4;
        if (o.y > groundY - o.r && !o.landed) { o.landed = true; o.y = groundY - o.r; o.vy = -o.vy * 0.35; burst(o.x, groundY, '#f8fafc', 10, 160); }

      },
      shapes: (o) => (o.delay > 0 ? [] : [{ t: 'c', x: o.x, y: o.y, r: o.r * 0.9 }]),

        if (o.delay > 0) {

  function splash(x) {
    for (let i = 0; i < 12; i++) particles.push({ x: x + rand(-12, 12), y: groundY, vx: rand(-90, 90), vy: rand(-320, -120), life: rand(0.4, 0.8), max: 0.8, c: '#e0f2fe', r: rand(2, 4), g: 900 });
  }

  function add(kind, props) {
    const o = Object.assign({ kind, x: VW + 80, w: 80, t: 0, ph: rand(0, TAU), extra: 0, seed: rand(0, 100) }, props);
    obstacles.push(o);
    if (KINDS[kind].warn) sfx.warn();
    return o;
  }

  // One "pattern" per spawn, picked from the current biome.
  function spawnPattern() {
    const biome = curBiome();
    const g = gapSize();
    const gc = gapCenter(g);
    const x = VW + 90;
    const r = Math.random();
    const d = difficulty();

    if (biome === 'ocean') {
      if (r < 0.5) {
        add('stack', { x, w: rand(60, 80), topY: gc + g / 2 });
        if (gc - g / 2 > 70) {
          const cy = gc - g / 2 - 40;
          add('cloud', { x, w: 140, y: cy, puffs: [{ x: -40, y: 0, r: 34 }, { x: 0, y: -10, r: 42 }, { x: 40, y: 2, r: 32 }, { x: 0, y: 14, r: 30 }] });
        }
        addSeedRow(x, gc, 4);
      } else if (r < 0.78) {
        const n = d > 0.3 && Math.random() < 0.5 ? 2 : 1;
        for (let i = 0; i < n; i++) {
          const apex = rand(VH * 0.25, groundY - 120);
          const o = add('fish', { x: x + i * 150 + rand(40, 160), y: groundY + 30, vy: -Math.sqrt(2 * 900 * (groundY + 30 - apex)), delay: rand(0.3, 0.8) + i * 0.3, w: 60 });
          o.ang = () => Math.atan2(o.vy, -worldSpeed() * 0.9);
        }
        addSeedRow(x + 260, rand(VH * 0.25, groundY - 80), 3);
      } else {
        const by = rand(VH * 0.2, groundY - 120);
        for (let i = 0; i < 3; i++) add('gull', { x: x + i * 46, by: by + (i === 1 ? -36 : 0) + rand(-6, 6), y: by, extra: 110, w: 40 });
        addSeedRow(x + 200, by > VH * 0.5 ? by - 150 : by + 150, 4);
      }
    } else if (biome === 'forest') {
      if (r < 0.55) {
        add('tree', { x, w: 150, topY: gc + g / 2 });
        if (gc - g / 2 > 60) add('vine', { x: x + rand(-20, 20), endY: gc - g / 2 - 20, w: 50 });
        addSeedRow(x, gc, 4);
      } else if (r < 0.78) {
        add('hawk', { x: VW + 420, y: clamp(bird.y + rand(-80, 80), VH * 0.15, groundY - 40), extra: 230 + d * 120, w: 70 });
        addSeedRow(x, rand(VH * 0.2, groundY - 60), 3);
      } else {
        const by = rand(VH * 0.3, groundY - 160);
        add('bees', { x, by, y: by, amp: rand(80, 140), w: 80, extra: 40 });
        addSeedRow(x + 200, by, 3);
      }
    } else if (biome === 'city') {
      if (r < 0.48) {
        const w = rand(90, 130);
        add('tower', { x, w, topY: gc + g / 2, col: pick(['#475569', '#334155', '#3f3f46', '#4c1d95']) });
        if (gc - g / 2 > 60) add('beam', { x, w: 120, endY: gc - g / 2 });
        addSeedRow(x, gc, 4);
      } else if (r < 0.64) {
        add('wreck', { x, len: rand(VH * 0.35, groundY * 0.75), w0: rand(1.6, 2.3), w: 200 });
        addSeedRow(x + 180, rand(VH * 0.2, groundY - 60), 3);
      } else if (r < 0.84) {
        const n = 1 + (d > 0.4 ? 1 : 0);
        for (let i = 0; i < n; i++) add('drone', { x: x + i * 160, by: rand(VH * 0.22, groundY - 100), w: 60 }).y = 0;
        addSeedRow(x + 80, rand(VH * 0.2, groundY - 60), 3);
      } else {
        add('plane', { x: VW + 500, y: clamp(bird.y + rand(-60, 60), VH * 0.15, groundY - 60), extra: 380 + d * 150, w: 120 });
      }
    } else {
      if (r < 0.55) {
        add('peak', { x, w: rand(200, 260), topY: gc + g / 2 });
        if (gc - g / 2 > 50) {
          const len = gc - g / 2;
          add('icicles', { x, w: 140, spikes: [{ dx: -42, w: 34, len: len * 0.7 }, { dx: 0, w: 42, len }, { dx: 40, w: 30, len: len * 0.8 }] });
        }
        addSeedRow(x, gc, 4);
      } else if (r < 0.8) {
        const n = 2 + (d > 0.5 ? 1 : 0);
        for (let i = 0; i < n; i++) add('snowball', { x: x + i * 120 + rand(0, 60), y: -40, vy: 0, r: rand(18, 28), rot: 0, delay: i * 0.35, w: 60 });
        addSeedRow(x + 140, rand(VH * 0.3, groundY - 60), 3);
      } else {
        add('hawk', { x: VW + 420, y: clamp(bird.y + rand(-80, 80), VH * 0.15, groundY - 40), extra: 240 + d * 120, w: 70, snow: true });
      }
    }
  }

  function spawnBubble() {
    const kinds = Object.keys(POWERS);
    bubbles.push({ x: VW + 60, y: rand(VH * 0.2, groundY - 70), kind: pick(kinds), t: 0 });
  }

  // ---------- Collision ----------
  function circleHits(cx, cy, r, s) {
    if (s.t === 'c') return Math.hypot(cx - s.x, cy - s.y) < r + s.r;
    if (s.t === 'r') {
      const px = clamp(cx, s.x, s.x + s.w), py = clamp(cy, s.y, s.y + s.h);
      return Math.hypot(cx - px, cy - py) < r;
    }
    // triangle
    const { ax, ay, bx, by, cx: qx, cy: qy } = s;
    const sign = (x1, y1, x2, y2, x3, y3) => (x1 - x3) * (y2 - y3) - (x2 - x3) * (y1 - y3);
    const d1 = sign(cx, cy, ax, ay, bx, by), d2 = sign(cx, cy, bx, by, qx, qy), d3 = sign(cx, cy, qx, qy, ax, ay);
    const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
    if (!(neg && pos)) return true;
    const segD = (x1, y1, x2, y2) => {
      const dx = x2 - x1, dy = y2 - y1;
      const t = clamp(((cx - x1) * dx + (cy - y1) * dy) / (dx * dx + dy * dy || 1), 0, 1);
      return Math.hypot(cx - (x1 + dx * t), cy - (y1 + dy * t));
    };
    return Math.min(segD(ax, ay, bx, by), segD(bx, by, qx, qy), segD(qx, qy, ax, ay)) < r;
  }

  function birdRadius() { return 11 * bird.size; }

  function hitBy(o) {
    if (timers.shield > 0) {
      o.dead = true;
      bonus += 10 * (timers.double > 0 ? 2 : 1);
      burst(o.x, bird.y, '#5eead4', 24, 320);
      floaters.push({ x: bird.x, y: bird.y - 30, text: 'SMASH!', life: 0.8, c: '#5eead4' });
      sfx.smash();
      shake = 6;
      return;
    }
    bird.hearts--;
    bird.inv = 1.6;
    shake = 12;
    feathers(bird.x, bird.y, 14);
    sfx.hit();
    if (bird.hearts <= 0) gameOver();
  }

  // ---------- Input ----------
  let drag = null;
  let mouseActive = false;
  function toWorld(e) { return { x: e.clientX / scale, y: e.clientY / scale }; }
  function tryStart() {
    initAudio();
    if (state === 'menu') start();
    else if (state === 'over' && performance.now() > overReadyAt) start();
  }
  window.addEventListener('pointerdown', (e) => {
    const p = toWorld(e);
    if (e.pointerType === 'mouse') { mouseActive = true; bird.tx = p.x; bird.ty = p.y; }
    else drag = { sx: p.x, sy: p.y, tx: bird.tx, ty: bird.ty, id: e.pointerId };
    tryStart();
  });
  window.addEventListener('pointermove', (e) => {
    const p = toWorld(e);
    if (e.pointerType === 'mouse') { mouseActive = true; bird.tx = p.x; bird.ty = p.y; return; }
    if (!drag || drag.id !== e.pointerId) return;
    // Relative drag: the bird moves with your finger but stays out from under it.
    bird.tx = drag.tx + (p.x - drag.sx) * 1.25;
    if (!gyroOn) bird.ty = drag.ty + (p.y - drag.sy) * 1.25;
  });
  const endDrag = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
    if ((e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') && !e.repeat) tryStart();
    if (e.code.startsWith('Arrow') || ['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) mouseActive = false;
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; drag = null; });

  // ---------- Gyro (tilt steering) ----------
  // Tilt the top of the phone toward you to climb, away from you to dive.
  // Whatever angle you're holding the phone at when the run starts counts as "level".
  let gyroOn = false, gyroRaw = null, gyroNeutral = null, gyroSeen = false;
  const GYRO_RANGE = 30; // degrees of tilt from level to reach the top/bottom of the sky

  function readTilt(e) {
    const ang = (screen.orientation && typeof screen.orientation.angle === 'number')
      ? screen.orientation.angle
      : (typeof window.orientation === 'number' ? window.orientation : 0);
    if (ang === 90) return -e.gamma;
    if (ang === -90 || ang === 270) return e.gamma;
    if (ang === 180) return -e.beta;
    return e.beta;
  }
  window.addEventListener('deviceorientation', (e) => {
    if (e.beta == null || e.gamma == null) return;
    gyroSeen = true;
    gyroRaw = readTilt(e);
    if (gyroOn && gyroNeutral == null) gyroNeutral = gyroRaw;
  });
  function calibrateGyro() { gyroNeutral = gyroRaw; }

  function refreshGyroBtn() {
    el.gyro.classList.toggle('on', gyroOn);
    el.gyroLabel.classList.toggle('gone', !gyroOn);
  }
  function setGyro(on) {
    gyroOn = on;
    try { localStorage.setItem('wingsGyro', on ? '1' : '0'); } catch (e) {}
    refreshGyroBtn();
    if (on) {
      gyroNeutral = null;
      banner('TILT TO STEER');
      setTimeout(() => {
        if (gyroOn && !gyroSeen) { gyroOn = false; refreshGyroBtn(); banner('NO GYRO FOUND'); }
      }, 1500);
    }
  }
  el.gyro.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.gyro.addEventListener('click', (e) => {
    e.stopPropagation();
    el.gyro.blur();
    initAudio();
    if (gyroOn) { setGyro(false); return; }
    // iPhone/iPad need permission, and it must be asked right inside the tap.
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      DOE.requestPermission()
        .then((res) => { if (res === 'granted') setGyro(true); else banner('GYRO BLOCKED'); })
        .catch(() => banner('GYRO BLOCKED'));
    } else if (DOE) {
      setGyro(true);
    } else {
      banner('NO GYRO FOUND');
    }
  });
  // Android doesn't ask for permission, so we can bring back last time's choice.
  try {
    const DOE = window.DeviceOrientationEvent;
    if (isTouch && localStorage.getItem('wingsGyro') === '1' && DOE && typeof DOE.requestPermission !== 'function') {
      gyroOn = true; refreshGyroBtn();
    }
  } catch (e) {}

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    shake = Math.max(0, shake - 30 * dt);
    biomeBlend = Math.min(1, biomeBlend + dt / 2.5);

    const playing = state === 'playing';
    const spd = playing ? worldSpeed() : (state === 'menu' ? 140 : worldSpeed() * 0.3);

    // ----- Bird -----
    if (bird.alive) {
      const moveK = 720 * dt;
      if (keys.ArrowUp || keys.KeyW) bird.ty -= moveK;
      if (keys.ArrowDown || keys.KeyS) bird.ty += moveK;
      if (keys.ArrowLeft || keys.KeyA) bird.tx -= moveK;
      if (keys.ArrowRight || keys.KeyD) bird.tx += moveK;
      if (gyroOn && gyroRaw != null && gyroNeutral != null) {
        const tilt = clamp((gyroRaw - gyroNeutral) / GYRO_RANGE, -1, 1);
        bird.ty = lerp(VH * 0.12, groundY - 20, 0.5 - tilt * 0.5);
      }
      if (state === 'menu') { bird.ty = VH * 0.45 + Math.sin(time * 1.5) * 40; bird.tx = VW * 0.28; }
      bird.tx = clamp(bird.tx, VW * 0.1, VW * 0.62);
      bird.ty = clamp(bird.ty, 24, groundY - 16);
      const prevY = bird.y;
      bird.x = lerp(bird.x, bird.tx, Math.min(1, dt * 9));
      bird.y = lerp(bird.y, bird.ty, Math.min(1, dt * 9));
      bird.vy = (bird.y - prevY) / Math.max(dt, 1e-4);
      bird.tilt = lerp(bird.tilt, clamp(bird.vy / 900, -0.6, 0.6), Math.min(1, dt * 10));
      bird.flap += dt * (bird.vy < -60 ? 22 : 14);
      bird.size = lerp(bird.size, timers.tiny > 0 ? 0.55 : 1, Math.min(1, dt * 8));
      bird.inv = Math.max(0, bird.inv - dt);
    } else {
      bird.fallV += 1200 * dt;
      bird.y = Math.min(groundY - 10, bird.y + bird.fallV * dt);
      bird.spin += dt * 8;
      bird.tilt = bird.spin;
    }

    if (playing) {
      dist += spd * dt;

      // Biome changes
      const b = Math.floor(dist / BIOME_LEN);
      if (b !== biomeIdx) {
        prevBiome = curBiome();
        biomeIdx = b;
        biomeBlend = 0;
        loops = Math.floor(b / BIOMES.length);
        banner(BIOME_NAMES[curBiome()]);
        sfx.biome();
      }

      // Spawning
      nextSpawn -= spd * dt;
      if (nextSpawn <= 0) {
        spawnPattern();
        nextSpawn = lerp(430, 270, difficulty()) + rand(0, 140);
      }
      powerCd -= dt;
      if (powerCd <= 0) { spawnBubble(); powerCd = rand(8, 12); }

      for (const k in timers) {
        if (timers[k] > 0) {
          timers[k] = Math.max(0, timers[k] - dt);
          if (timers[k] === 0) sfx.end();
        }
      }
    }

    // ----- World objects -----
    for (const o of obstacles) {
      o.x -= (spd + (playing || state === 'over' ? o.extra : 0)) * dt;
      const K = KINDS[o.kind];
      if (K.update) K.update.call(K, o, dt);
    }
    if (playing && bird.alive) {
      const r = birdRadius();
      for (const o of obstacles) {
        if (o.dead) continue;
        if (Math.abs(o.x - bird.x) > 400) continue;
        const K = KINDS[o.kind];
        const shapes = K.shapes.call(K, o);
        if (shapes.some((s) => circleHits(bird.x, bird.y, r, s))) {
          if (timers.ghost > 0 && timers.shield <= 0) continue; // ghosts pass through
          if (bird.inv > 0 && timers.shield <= 0) continue;
          hitBy(o);
          if (state !== 'playing') break;
        }
      }
    }
    obstacles = obstacles.filter((o) => !o.dead && o.x > -420 && !(o.y > VH + 300));

    for (const s of seeds) {
      s.x -= spd * dt;
      s.bob += dt * 4;
      if (!playing || s.got) continue;
      const dx = bird.x - s.x, dy = bird.y - s.y, d = Math.hypot(dx, dy);
      if (timers.magnet > 0 && d < 240) { s.x += (dx / d) * 600 * dt; s.y += (dy / d) * 600 * dt; }
      if (d < birdRadius() + 14) {
        s.got = true;
        seedsGot++;
        const pts = 5 * (timers.double > 0 ? 2 : 1);
        bonus += pts;
        floaters.push({ x: s.x, y: s.y - 12, text: '+' + pts, life: 0.6, c: '#fde047' });
        burst(s.x, s.y, '#fde047', 6, 140, 0);
        sfx.seed();
      }
    }
    seeds = seeds.filter((s) => !s.got && s.x > -40);

    for (const p of bubbles) {
      p.x -= spd * dt; p.t += dt;
      if (playing && !p.got && Math.hypot(bird.x - p.x, bird.y - (p.y + Math.sin(p.t * 3) * 10)) < birdRadius() + 24) {
        p.got = true;
        powersGot++;
        const P = POWERS[p.kind];
        timers[p.kind] = P.time;
        banner(P.label + '!');
        burst(p.x, p.y, P.color, 24, 260, 0);
        sfx.power();
      }
    }
    bubbles = bubbles.filter((p) => !p.got && p.x > -60);

    for (const q of particles) {
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.life -= dt;
      if (q.feather) { q.vx *= 1 - 1.5 * dt; q.rot += q.vr * dt; }
    }
    particles = particles.filter((q) => q.life > 0);
    for (const f of floaters) { f.life -= dt; f.y -= 40 * dt; }
    floaters = floaters.filter((f) => f.life > 0);

    if (playing) updateHud();
  }

  // ---------- Backgrounds ----------
  function columns(par, spacing, fn) {
    const off = dist * par + time * 0; // parallax offset
    const first = Math.floor(off / spacing) - 1;
    const n = Math.ceil(VW / spacing) + 3;
    for (let i = first; i < first + n; i++) fn(i * spacing - off, i);
  }
  function skyGrad(stops) {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  }
  function wavyBand(par, base, amp, freq, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, VH);
    const off = dist * par;
    for (let x = 0; x <= VW + 10; x += 10) {
      const wx = (x + off) * freq;
      ctx.lineTo(x, base + (Math.sin(wx) * 0.6 + Math.sin(wx * 2.7 + 1.3) * 0.3 + Math.sin(wx * 6.1) * 0.1) * amp);
    }
    ctx.lineTo(VW, VH);
    ctx.closePath();
    ctx.fill();
  }
  function cloudsLayer(par, y0, alpha, color = '#ffffff') {
    ctx.fillStyle = color;
    ctx.globalAlpha *= alpha;
    columns(par, 260, (x, i) => {
      if (hash(i) < 0.35) return;
      const y = y0 + hash(i + 3) * VH * 0.18, s = 0.7 + hash(i + 7) * 0.6;
      ctx.beginPath();
      // One path for the whole cloud so overlapping puffs don't show darker seams.
      ctx.arc(x, y, 26 * s, 0, TAU);
      ctx.moveTo(x + 60 * s, y - 10 * s); ctx.arc(x + 28 * s, y - 10 * s, 32 * s, 0, TAU);
      ctx.moveTo(x + 84 * s, y); ctx.arc(x + 60 * s, y, 24 * s, 0, TAU);
      ctx.rect(x, y, 60 * s, 22 * s);
      ctx.fill('nonzero');
    });
    ctx.globalAlpha /= alpha;
  }

  const BG = {
    ocean() {
      skyGrad(['#0ea5e9', '#7dd3fc', '#e0f2fe']);
      const sx = VW * 0.78, sy = VH * 0.2;
      const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 110);
      sg.addColorStop(0, 'rgba(255,251,235,1)'); sg.addColorStop(0.3, 'rgba(254,240,138,0.8)'); sg.addColorStop(1, 'rgba(254,240,138,0)');
      ctx.fillStyle = sg; ctx.fillRect(sx - 110, sy - 110, 220, 220);
      cloudsLayer(0.06, VH * 0.08, 0.85);
      wavyBand(0.12, groundY - 30, 22, 0.006, '#0e7490');
      columns(0.12, 520, (x, i) => {
        if (hash(i + 20) < 0.5) return;
        ctx.fillStyle = '#15803d';
        ctx.beginPath(); ctx.ellipse(x, groundY - 8, 70, 26, 0, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#78350f'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x + 10, groundY - 30); ctx.quadraticCurveTo(x + 16, groundY - 70, x + 4, groundY - 90); ctx.stroke();
        ctx.fillStyle = '#16a34a';
        for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(x + 4 + Math.cos(k * 1.6) * 16, groundY - 92 + Math.sin(k * 1.6) * 6, 18, 6, k * 1.6, 0, TAU); ctx.fill(); }
      });
      const g = ctx.createLinearGradient(0, groundY, 0, VH);
      g.addColorStop(0, '#0284c7'); g.addColorStop(1, '#0c4a6e');
      ctx.fillStyle = g;
      ctx.fillRect(0, groundY, VW, VH - groundY);
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
      for (let row = 0; row < 3; row++) {
        const yy = groundY + 6 + row * 16, off = dist * (0.9 + row * 0.2);
        ctx.beginPath();
        for (let x = 0; x <= VW + 10; x += 10) ctx.lineTo(x, yy + Math.sin((x + off) * 0.04 + time * 2 + row) * 3);
        ctx.stroke();
      }
    },
    forest() {
      skyGrad(['#86efac', '#d9f99d', '#fef9c3']);
      cloudsLayer(0.05, VH * 0.06, 0.6);
      const pines = (par, spacing, hMin, hMax, color, baseY) => {
        ctx.fillStyle = color;
        columns(par, spacing, (x, i) => {
          const h = hMin + hash(i * 1.7 + par * 10) * (hMax - hMin), w = h * 0.38;
          ctx.beginPath();
          ctx.moveTo(x, baseY - h);
          ctx.lineTo(x + w, baseY); ctx.lineTo(x - w, baseY);
          ctx.closePath(); ctx.fill();
          ctx.fillRect(x - 4, baseY - 2, 8, 12);
        });
      };
      pines(0.1, 46, VH * 0.22, VH * 0.4, '#4d7c0f', groundY - 10);
      ctx.fillStyle = 'rgba(217, 249, 157, 0.25)'; ctx.fillRect(0, 0, VW, VH);
      pines(0.25, 64, VH * 0.18, VH * 0.32, '#166534', groundY);
      pines(0.5, 90, VH * 0.12, VH * 0.22, '#14532d', groundY + 6);
      ctx.fillStyle = '#365314';
      ctx.fillRect(0, groundY, VW, VH - groundY);
      ctx.fillStyle = '#4d7c0f';
      columns(1, 14, (x, i) => { const h = 6 + hash(i) * 10; ctx.beginPath(); ctx.moveTo(x, groundY + 2); ctx.lineTo(x + 3, groundY - h); ctx.lineTo(x + 6, groundY + 2); ctx.fill(); });
      ctx.fillStyle = 'rgba(254, 249, 195, 0.5)';
      for (let i = 0; i < 14; i++) {
        const fx = (hash(i) * VW + Math.sin(time * 0.7 + i) * 30), fy = VH * 0.3 + hash(i + 5) * VH * 0.5 + Math.sin(time + i * 2) * 20;
        ctx.globalAlpha = 0.4 + 0.4 * Math.sin(time * 3 + i);
        ctx.beginPath(); ctx.arc(fx, fy, 2, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    },
    city() {
      skyGrad(['#1e1b4b', '#6d28d9', '#f472b6', '#fdba74']);
      const sx = VW * 0.7, sy = groundY - VH * 0.12;
      const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 140);
      sg.addColorStop(0, 'rgba(254, 215, 170, 0.95)'); sg.addColorStop(0.35, 'rgba(251, 146, 60, 0.5)'); sg.addColorStop(1, 'rgba(251, 146, 60, 0)');
      ctx.fillStyle = sg; ctx.fillRect(sx - 140, sy - 140, 280, 280);
      cloudsLayer(0.05, VH * 0.1, 0.25, '#fbcfe8');
      const buildings = (par, spacing, hMin, hMax, color, lit) => {
        columns(par, spacing, (x, i) => {
          const h = hMin + hash(i * 3.1 + par) * (hMax - hMin), w = spacing * (0.7 + hash(i + 2) * 0.3);
          ctx.fillStyle = color;
          ctx.fillRect(x, groundY - h, w, h + 2);
          if (hash(i + 9) > 0.7) ctx.fillRect(x + w / 2 - 2, groundY - h - 18, 4, 18);
          if (lit) {
            for (let yy = groundY - h + 10; yy < groundY - 8; yy += 16) for (let xx = x + 6; xx < x + w - 8; xx += 12) {
              if (hash(xx * 0.13 + yy * 0.7 + i) > 0.62) { ctx.fillStyle = 'rgba(253, 230, 138, 0.85)'; ctx.fillRect(xx, yy, 5, 7); }
            }
          }
        });
      };
      buildings(0.08, 60, VH * 0.2, VH * 0.45, 'rgba(76, 29, 149, 0.7)', false);
      buildings(0.2, 80, VH * 0.14, VH * 0.36, '#2e1065', true);
      buildings(0.4, 110, VH * 0.08, VH * 0.22, '#1e1b4b', true);
      ctx.fillStyle = '#18181b';
      ctx.fillRect(0, groundY, VW, VH - groundY);
      ctx.fillStyle = '#facc15';
      columns(1, 60, (x) => ctx.fillRect(x, groundY + 18, 28, 3));
    },
    peaks() {
      skyGrad(['#38bdf8', '#bae6fd', '#f0f9ff']);
      cloudsLayer(0.05, VH * 0.06, 0.9);
      const ridge = (par, base, amp, period, color, snow) => {
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.moveTo(0, VH);
        const off = dist * par;
        const pts = [];
        for (let x = -period; x <= VW + period; x += period / 2) {
          const k = Math.floor((x + off) / (period / 2));
          const xx = k * (period / 2) - off;
          const up = k % 2 === 0;
          const yy = up ? base - amp * (0.6 + hash(k) * 0.4) : base - amp * 0.15 * hash(k + 1);
          pts.push([xx, yy]);
        }
        for (const [x, y] of pts) ctx.lineTo(x, y);
        ctx.lineTo(VW + period, VH); ctx.closePath(); ctx.fill();
        if (snow) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          for (let i = 1; i < pts.length - 1; i++) {
            const [x, y] = pts[i], [px, py] = pts[i - 1], [nx, ny] = pts[i + 1];
            if (y < py && y < ny) {
              ctx.beginPath(); ctx.moveTo(x, y);
              ctx.lineTo(lerp(x, nx, 0.3), lerp(y, ny, 0.3)); ctx.lineTo(x, lerp(y, ny, 0.22)); ctx.lineTo(lerp(x, px, 0.3), lerp(y, py, 0.3));
              ctx.closePath(); ctx.fill();
            }
          }
        }
      };
      ridge(0.06, groundY - 40, VH * 0.45, 360, '#94a3b8', true);
      ridge(0.15, groundY - 10, VH * 0.3, 240, '#64748b', true);
      ridge(0.3, groundY + 4, VH * 0.14, 160, '#e2e8f0', false);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, groundY, VW, VH - groundY);
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 50; i++) {
        const sx = ((hash(i) * VW * 1.3 - dist * 0.4 - time * 20 * hash(i + 1)) % (VW + 20) + VW + 20) % (VW + 20);
        const sy = ((hash(i + 7) * VH + time * (40 + hash(i + 3) * 50)) % VH);
        ctx.globalAlpha = 0.5 + hash(i + 2) * 0.5;
        ctx.beginPath(); ctx.arc(sx, sy, 1.2 + hash(i + 4) * 2, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    },
  };

  // ---------- Draw ----------
  function drawBird() {
    const b = bird;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.tilt);
    ctx.scale(b.size, b.size);
    let alpha = 1;
    if (timers.ghost > 0) alpha = 0.45 + 0.15 * Math.sin(time * 10);
    if (b.inv > 0 && Math.floor(b.inv * 12) % 2 === 0) alpha *= 0.3;
    ctx.globalAlpha = alpha;
    // tail
    ctx.fillStyle = '#0369a1';
    ctx.beginPath(); ctx.moveTo(-12, -2); ctx.lineTo(-28, -10); ctx.lineTo(-26, 0); ctx.lineTo(-28, 8); ctx.closePath(); ctx.fill();
    // far wing
    const wa = Math.sin(b.flap) * 0.9;
    ctx.save(); ctx.translate(-2, -4); ctx.rotate(-0.2 - wa * 0.8);
    ctx.fillStyle = '#075985';
    ctx.beginPath(); ctx.ellipse(-9, 0, 13, 5, 0, 0, TAU); ctx.fill();
    ctx.restore();
    // body
    const g = ctx.createRadialGradient(-4, -6, 2, 0, 0, 19);
    g.addColorStop(0, '#7dd3fc'); g.addColorStop(1, '#0284c7');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fde68a';
    ctx.beginPath(); ctx.ellipse(4, 5, 10, 6.5, 0.15, 0, TAU); ctx.fill();
    // crest
    ctx.fillStyle = '#0369a1';
    ctx.beginPath(); ctx.moveTo(2, -12); ctx.quadraticCurveTo(-2, -22, -8, -18); ctx.quadraticCurveTo(-4, -16, -4, -11); ctx.fill();
    // near wing
    ctx.save(); ctx.translate(-2, -2); ctx.rotate(-0.3 + wa);
    ctx.fillStyle = '#0284c7';
    ctx.beginPath(); ctx.ellipse(-10, 0, 14, 6.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.ellipse(-8, -1.5, 8, 3, 0, 0, TAU); ctx.fill();
    ctx.restore();
    // eye + beak
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -4, 4.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(9.2, -4, 2.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(10, -5, 0.9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fb923c';
    ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(24, 1); ctx.lineTo(14, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f472b6'; ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath(); ctx.arc(6, 3, 3, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    if (timers.shield > 0) {
      const r = birdRadius() + 16 + Math.sin(time * 6) * 2;
      const blink = timers.shield < 2 && Math.floor(time * 8) % 2 === 0;
      if (!blink) {
        ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(94, 234, 212, 0.15)';
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill(); ctx.stroke();
      }
    }
    if (timers.magnet > 0) {
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.35)'; ctx.lineWidth = 2;
      ctx.setLineDash([4, 8]); ctx.lineDashOffset = time * 30;
      ctx.beginPath(); ctx.arc(b.x, b.y, 60 + Math.sin(time * 4) * 6, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    const cur = curBiome();
    if (biomeBlend < 1) {
      BG[prevBiome]();
      ctx.globalAlpha = biomeBlend;
      BG[cur]();
      ctx.globalAlpha = 1;
    } else BG[cur]();

    if (timers.slow > 0) { ctx.fillStyle = 'rgba(147, 197, 253, 0.12)'; ctx.fillRect(0, 0, VW, VH); }

    const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, sx * dpr * scale, sy * dpr * scale);

    // Seeds
    for (const s of seeds) {
      const y = s.y + Math.sin(s.bob) * 4;
      ctx.fillStyle = 'rgba(253, 224, 71, 0.3)';
      ctx.beginPath(); ctx.arc(s.x, y, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.ellipse(s.x, y, 6, 8, 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fef9c3';
      ctx.beginPath(); ctx.ellipse(s.x - 2, y - 2, 2, 3, 0.4, 0, TAU); ctx.fill();
    }

    // Obstacles
    for (const o of obstacles) {
      const K = KINDS[o.kind];
      K.draw.call(K, o);
      // Warning marker for things coming in fast from the right
      if (K.warn && o.x - 40 > VW) {
        const a = 0.6 + 0.4 * Math.sin(time * 14);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.moveTo(VW - 10, o.y); ctx.lineTo(VW - 36, o.y - 16); ctx.lineTo(VW - 36, o.y + 16); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '900 16px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('!', VW - 26, o.y + 1);
        ctx.globalAlpha = 1;
      }
    }

    // Power-up bubbles
    for (const p of bubbles) {
      const P = POWERS[p.kind];
      const y = p.y + Math.sin(p.t * 3) * 10;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeStyle = P.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, y, 22 + Math.sin(p.t * 6) * 1.5, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(p.x - 8, y - 9, 5, 0, TAU); ctx.fill();
      ctx.font = p.kind === 'double' ? '900 16px system-ui, sans-serif' : '20px system-ui, sans-serif';
      ctx.fillStyle = P.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(P.icon, p.x, y + 1);
    }

    drawBird();

    for (const q of particles) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.c;
      if (q.feather) {
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.beginPath(); ctx.ellipse(0, 0, q.r * 2, q.r * 0.7, 0, 0, TAU); ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    ctx.font = '900 15px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floaters) {
      ctx.globalAlpha = Math.min(1, f.life / 0.3);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillText(f.text, f.x + 1, f.y + 1);
      ctx.fillStyle = f.c;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Sound button ----------
  const soundBtn = $('sound');
  function refreshSoundBtn() { soundBtn.textContent = muted ? '🔇' : '🔊'; }
  soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('wingsMuted', muted ? '1' : '0'); } catch (err) {}
    refreshSoundBtn();
    soundBtn.blur();
    if (!muted) { initAudio(); sfx.seed(); }
  });
  refreshSoundBtn();
  window.focus();

  // ---------- Start ----------
  resize();
  reset();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
