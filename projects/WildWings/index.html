    }
  }

  // ---------- Obstacles ----------
  // Each obstacle: a root group that scrolls toward the camera, plus colliders
  // (boxes 'b' and spheres 's') in the root's local space.
  function addObs(kind, x, y, z, build, extra = 0) {
    const root = new THREE.Group();
    root.position.set(x, y, z);
    scene.add(root);
    const o = { kind, root, cols: [], extra, t: 0, ph: rand(0, TAU) };
    build(o, root);
    inkOutline(root);
    obstacles.push(o);
    return o;
  }
  const box = (x, y, z, hx, hy, hz) => ({ t: 'b', x, y, z, hx, hy, hz });
  const ball = (x, y, z, r) => ({ t: 's', x, y, z, r });

  function freeXs(n, minGap) {
    // n distinct x positions across the corridor, at least minGap apart
    const xs = [];
    for (let tries = 0; xs.length < n && tries < 40; tries++) {
      const x = rand(-XMAX + 1, XMAX - 1);
      if (xs.every((q) => Math.abs(q - x) >= minGap)) xs.push(x);
    }
    return xs;
  }

  function addWarning(o, y) {
    const s = new THREE.Sprite(WARN_MAT);
    s.scale.set(1.6, 1.6, 1);
    s.position.set(0, y, 0);
    s.renderOrder = 10;
    o.root.add(s);
    o.warnSprite = s;
    sfx.warn();
  }

  // ----- Ocean -----
  function seaStack(x, z) {
    const h = rand(4.5, 11.5), r = rand(1.1, 1.8);
    return addObs('stack', x, 0, z, (o, g) => {
      g.add(mk(GEO.cyl6, MAT.rock, 0, h / 2, 0, r, h, r));
      const cap = mk(GEO.ico, MAT.rockDark, 0, h, 0, r * 1.05, r * 0.6, r * 1.05);
      cap.rotation.y = rand(0, TAU);
      g.add(cap);
      g.add(mk(GEO.ico, MAT.moss, 0, h + r * 0.35, 0, r * 0.7, r * 0.3, r * 0.7));
      g.add(mk(GEO.cyl, MAT.foam, 0, 0.3, 0, r * 1.5, 0.12, r * 1.5));
      o.cols.push(box(0, (h + r * 0.4) / 2, 0, r * 0.95, (h + r * 0.4) / 2, r * 0.95));
    });
  }
  function stormCloud(x, z) {
    const y = rand(7.6, 9.6);
    return addObs('cloud', x, y, z, (o, g) => {
      o.puffs = [];
      for (let i = 0; i < 5; i++) {
        const px = (i - 2) * rand(0.9, 1.3), py = rand(-0.5, 0.6), pr = rand(1.1, 1.7);
        const m = mk(GEO.blob, MAT.storm, px, py, rand(-0.6, 0.6), pr, pr * 0.8, pr);
        m.rotation.set(rand(0, 3), rand(0, 3), 0);
        g.add(m);
        o.puffs.push(m);
        o.cols.push(ball(px, py, 0, pr * 0.85));
      }
      o.update = (o, dt) => {
        o.flash = Math.max(0, (o.flash || 0) - dt * 4);
        if (Math.random() < dt * 0.6) o.flash = 1;
        if (!o.fadeStep) for (const m of o.puffs) m.material = o.flash > 0.5 ? MAT.stormLit : MAT.storm; // (not while fading)
      };
    });
  }
  function swordfish(x, z) {
    const apex = rand(3.5, 8.5), zPeak = rand(-8, 2), half = rand(16, 22);
    return addObs('fish', x, -2, z, (o, g) => {
      const fish = new THREE.Group();
      fish.add(mk(GEO.sphere, MAT.fish, 0, 0, 0, 0.38, 0.42, 0.95));
      fish.add(mk(GEO.sphere, MAT.fishBelly, 0, -0.15, 0.05, 0.28, 0.25, 0.75));
      const nose = mk(GEO.cyl, MAT.sword, 0, 0.02, 1.35, 0.04, 1.0, 0.04);
      nose.rotation.x = Math.PI / 2;
      fish.add(nose);
      const tailFin = mk(GEO.cone, MAT.fish, 0, 0, -1.05, 0.45, 0.5, 0.1);
      tailFin.rotation.x = Math.PI / 2;
      fish.add(tailFin);
      const fin = mk(GEO.cone, MAT.fish, 0, 0.5, -0.1, 0.08, 0.5, 0.35);
      fish.add(fin);
      for (const s of [-1, 1]) fish.add(mk(GEO.sphere, MAT.black, s * 0.3, 0.12, 0.6, 0.07));
      g.add(fish);
      o.fish = fish;
      o.cols.push(ball(0, 0, 0, 0.6), ball(0, 0, 1.2, 0.3));
      o.update = (o) => {
        const z = o.root.position.z;
        const u = (z - zPeak) / half;
        const y = apex * (1 - u * u);
        const wasUnder = o.root.position.y < 0.2;
        o.root.position.y = Math.max(-2, y);
        const nowUnder = o.root.position.y < 0.2;
        if (wasUnder !== nowUnder && z > -90) { sfx.splash(); burst(o.root.position.x, 0.3, z, 0xe0f2fe, 10, 6); }
        // nose follows the arc: going up while u<0, down after
        fish.rotation.x = Math.atan2(2 * apex * u / half, 1);
        o.cols[1].y = Math.sin(-fish.rotation.x) * 1.2;
      };
    });
  }
  function gullFlock(z) {
    const cx = rand(-4, 4), cy = rand(3, 8);
    const offs = [[0, 0, 0], [-1.6, 0.5, 1.4], [1.6, 0.5, 1.4]];
    for (const [ox, oy, oz] of offs) {
      addObs('gull', cx + ox, cy + oy, z + oz, (o, g) => {
        g.add(mk(GEO.sphere, MAT.gull, 0, 0, 0, 0.32, 0.28, 0.6));
        const bk = mk(GEO.cone, MAT.orange, 0, 0.02, 0.62, 0.07, 0.22, 0.07);
        bk.rotation.x = Math.PI / 2;
        g.add(bk);
        o.wings = [];
        for (const s of [-1, 1]) {
          const p = new THREE.Group();
          p.position.set(s * 0.22, 0.08, 0);
          p.add(mk(GEO.box, MAT.gullWing, s * 0.55, 0, 0, 1.1, 0.05, 0.4));
          g.add(p);
          o.wings.push({ p, s });
        }
        o.cols.push(ball(0, 0, 0, 0.55));
        o.bx = cx + ox;
        o.update = (o, dt) => {
          o.t += dt;
          const f = Math.sin(o.t * 12 + o.ph) * 0.6;
          for (const w of o.wings) w.p.rotation.z = w.s * f;
          o.root.position.x = o.bx + Math.sin(o.t * 1.4) * 1.5;
        };
      });
    }
  }

  // ----- Forest -----
  function tree(x, z) {
    const cy = rand(3.5, 8.2), tr = rand(0.35, 0.5);
    return addObs('tree', x, 0, z, (o, g) => {
      g.add(mk(GEO.cyl6, MAT.trunk, 0, cy / 2, 0, tr, cy + 0.5, tr));
      const blobs = [[0, cy + 0.6, 0, rand(1.6, 2.1)], [-1.3, cy - 0.1, 0.3, rand(1.1, 1.5)], [1.3, cy, -0.3, rand(1.1, 1.5)]];
      blobs.forEach(([bx, by, bz, br], i) => {
        const m = mk(GEO.blob, [MAT.leaf1, MAT.leaf2, MAT.leaf3][i], bx, by, bz, br, br * 0.9, br);
        m.rotation.set(rand(0, 3), rand(0, 3), 0);
        g.add(m);
        o.cols.push(ball(bx, by, bz, br * 0.85));
      });
      for (let i = 0; i < 3; i++) g.add(mk(GEO.sphere, MAT.apple, rand(-1.4, 1.4), cy + rand(-0.6, 0.8), 1.3, 0.14));
      o.cols.push(box(0, cy / 2, 0, tr + 0.05, cy / 2, tr + 0.05));
    });
  }
  function fallenLog(z) {
    const L = rand(6, 11), y = rand(1.8, 8), x = rand(-XMAX + L / 2 - 2, XMAX - L / 2 + 2);
    return addObs('log', x, y, z, (o, g) => {
      const m = mk(GEO.cyl, MAT.log, 0, 0, 0, 0.55, L, 0.55);
      m.rotation.z = Math.PI / 2;
      g.add(m);
      for (const s of [-1, 1]) { const e = mk(GEO.cyl, MAT.logEnd, s * L / 2, 0, 0, 0.5, 0.06, 0.5); e.rotation.z = Math.PI / 2; g.add(e); }
      // ropes it hangs from
      for (const s of [-1, 1]) g.add(mk(GEO.box, MAT.vine, s * (L / 2 - 0.6), (14 - y) / 2, 0, 0.06, 14 - y, 0.06));
      g.add(mk(GEO.ico, MAT.moss, rand(-L / 3, L / 3), 0.45, 0, 0.5, 0.25, 0.5));
      o.cols.push(box(0, 0, 0, L / 2, 0.55, 0.55));
    });
  }
  function vines(z) {
    const n = 3 + Math.floor(Math.random() * 2);
    const xs = freeXs(n, 2.4);
    for (const x of xs) {
      const endY = rand(3.5, 7.5);
      addObs('vine', x, 0, z + rand(-1, 1), (o, g) => {
        const len = 13 - endY;
        g.add(mk(GEO.box, MAT.vine, 0, endY + len / 2, 0, 0.12, len, 0.12));
        for (let yy = endY + 0.8; yy < 12; yy += 1.1) g.add(mk(GEO.ico, MAT.leaf2, (Math.random() < 0.5 ? -1 : 1) * 0.25, yy, 0, 0.28, 0.12, 0.2));
        g.add(mk(GEO.blob, MAT.leaf1, 0, endY, 0, 0.6));
        g.add(mk(GEO.sphere, MAT.flower, 0.25, endY - 0.3, 0.35, 0.18));
        o.cols.push(box(0, endY + len / 2, 0, 0.22, len / 2, 0.22), ball(0, endY, 0, 0.6));
      });
    }
  }
  function raptor(z, snowy) {
    const x = clamp(bird.x + rand(-2, 2), -XMAX + 1, XMAX - 1), y = clamp(bird.y + rand(-1.5, 1.5), YMIN + 0.5, YMAX - 0.5);
    const o = addObs('hawk', x, y, z, (o, g) => {
      const body = snowy ? MAT.eagle : MAT.hawk, wing = snowy ? MAT.eagleWing : MAT.hawkWing;
      g.add(mk(GEO.sphere, body, 0, 0, 0, 0.42, 0.38, 0.9));
      g.add(mk(GEO.sphere, snowy ? MAT.white : MAT.hawkHead, 0, 0.2, 0.75, 0.3));
      const bk = mk(GEO.cone, MAT.beakY, 0, 0.12, 1.12, 0.08, 0.28, 0.08);
      bk.rotation.x = Math.PI / 2;
      g.add(bk);
      for (const s of [-1, 1]) g.add(mk(GEO.sphere, MAT.black, s * 0.16, 0.3, 0.98, 0.05));
      o.wings = [];
      for (const s of [-1, 1]) {
        const p = new THREE.Group();
        p.position.set(s * 0.3, 0.1, 0);
        p.add(mk(GEO.box, wing, s * 0.85, 0, 0, 1.7, 0.06, 0.6));
        g.add(p);
        o.wings.push({ p, s });
      }
      o.cols.push(ball(0, 0, 0, 0.75), ball(0, 0.2, 0.8, 0.35));
      o.update = (o, dt) => {
        o.t += dt;
        const f = Math.sin(o.t * 14) * 0.7;
        for (const w of o.wings) w.p.rotation.z = w.s * f;
        const z = o.root.position.z;
        // Swoops toward you while it's still out in front
        if (z > -75 && z < -10) {
          o.root.position.x += clamp(bird.x - o.root.position.x, -1, 1) * 2.6 * dt;
          o.root.position.y += clamp(bird.y - o.root.position.y, -1, 1) * 2.2 * dt;
        }
        if (o.warnSprite) o.warnSprite.visible = z < -28;
        if (z > -20 && !o.whooshed) { o.whooshed = true; sfx.whoosh(); }
      };
    }, 22 + difficulty() * 10);
    addWarning(o, 1.8);
  }
  function beeSwarm(z) {
    const cx = rand(-3.5, 3.5), cy = rand(3, 7);
    addObs('bees', cx, cy, z, (o, g) => {
      o.bees = [];
      for (let i = 0; i < 12; i++) {
        const b = new THREE.Group();
        b.add(mk(GEO.sphere, MAT.bee, 0, 0, 0, 0.14, 0.12, 0.2));
        b.add(mk(GEO.box, MAT.black, 0, 0, 0, 0.29, 0.2, 0.05));
        g.add(b);
        o.bees.push({ m: b, a: rand(0, TAU), r: rand(0.3, 1.0), s: rand(3, 6), yo: rand(-0.6, 0.6) });
      }
      o.cols.push(ball(0, 0, 0, 1.15));
      o.update = (o, dt) => {
        o.t += dt;
        o.root.position.x = cx + Math.sin(o.t * 1.3 + o.ph) * 3;
        o.root.position.y = cy + Math.sin(o.t * 2.1) * 1.6;
        for (const b of o.bees) {
          b.a += b.s * dt;
          b.m.position.set(Math.cos(b.a) * b.r, b.yo + Math.sin(b.a * 1.7) * 0.4, Math.sin(b.a) * b.r);
        }
      };
    });
  }

  // ----- City -----
  function building(x, z) {
    const w = rand(2.6, 4), d = rand(2.6, 4), h = rand(5, 12.5);
    return addObs('tower', x, 0, z, (o, g) => {
      g.add(mk(GEO.box, pick(BUILDING_MATS), 0, h / 2, 0, w, h, d));
      g.add(mk(GEO.box, MAT.cable, 0, h + 0.12, 0, w + 0.2, 0.24, d + 0.2));
      g.add(mk(GEO.box, MAT.cable, 0, h + 0.8, 0, 0.08, 1.4, 0.08));
      g.add(mk(GEO.sphere, MAT.redLight, 0, h + 1.55, 0, 0.13));
      o.cols.push(box(0, h / 2, 0, w / 2, h / 2 + 0.2, d / 2));
    });
  }
  function girder(z) {
    const L = rand(8, 14), y = rand(2.4, 8), x = rand(-XMAX + L / 2 - 2.5, XMAX - L / 2 + 2.5);
    return addObs('beam', x, y, z, (o, g) => {
      g.add(mk(GEO.box, MAT.girder, 0, 0, 0, L, 0.62, 0.7));
      g.add(mk(GEO.box, MAT.girderDark, 0, 0.36, 0, L, 0.1, 0.8));
      g.add(mk(GEO.box, MAT.girderDark, 0, -0.36, 0, L, 0.1, 0.8));
      for (const s of [-1, 1]) g.add(mk(GEO.box, MAT.cable, s * (L / 2 - 0.5), (15 - y) / 2, 0, 0.05, 15 - y, 0.05));
      o.cols.push(box(0, 0, 0, L / 2, 0.42, 0.42));
    });
  }
  function wreckingBall(z) {
    const cx = rand(-2.5, 2.5), Lc = rand(9, 12.5), w0 = rand(1.4, 2.0);
    addObs('wreck', cx, 15, z, (o, g) => {
      const cable = mk(GEO.box, MAT.cable, 0, 0, 0, 0.07, 1, 0.07);
      const ballM = mk(GEO.sphere, MAT.ball, 0, 0, 0, 1.15);
      g.add(cable); g.add(ballM);
      g.add(mk(GEO.box, MAT.girder, 0, 0.2, 0, 6, 0.5, 0.6));
      o.cols.push(ball(0, -Lc, 0, 1.15));
      o.update = (o, dt) => {
        o.t += dt;
        const a = Math.sin(o.t * w0 + o.ph) * 0.85;
        const bx = Math.sin(a) * Lc, by = -Math.cos(a) * Lc;
        ballM.position.set(bx, by, 0);
        cable.position.set(bx / 2, by / 2, 0);
        cable.scale.y = Lc;
        cable.rotation.z = a;
        o.cols[0].x = bx; o.cols[0].y = by;
      };
    });
  }
  function drone(x, z) {
    const by = rand(2.5, 8);
    addObs('drone', x, by, z, (o, g) => {
      g.add(mk(GEO.box, MAT.drone, 0, 0, 0, 0.8, 0.25, 0.8));
      g.add(mk(GEO.sphere, MAT.redLight, 0, -0.05, 0.42, 0.08));
      o.rotors = [];
      for (const [rx, rz] of [[-0.55, -0.55], [0.55, -0.55], [-0.55, 0.55], [0.55, 0.55]]) {
        g.add(mk(GEO.box, MAT.droneDark, rx * 0.6, 0.05, rz * 0.6, 0.6, 0.06, 0.08));
        const r = mk(GEO.box, MAT.droneDark, rx, 0.2, rz, 0.55, 0.02, 0.08);
        g.add(r);
        o.rotors.push(r);
      }
      o.cols.push(ball(0, 0, 0, 0.7));
      o.update = (o, dt) => {
        o.t += dt;
        o.root.position.y = by + Math.sin(o.t * 2.3 + o.ph) * 1.6;
        o.root.position.x = x + Math.sin(o.t * 1.1 + o.ph) * 1.2;
        for (const r of o.rotors) r.rotation.y += dt * 40;
      };
    });
  }
  function airplane(z) {
    const x = clamp(bird.x + rand(-1.5, 1.5), -XMAX + 2, XMAX - 2), y = clamp(bird.y + rand(-1, 1), YMIN + 1, YMAX - 1);
    const o = addObs('plane', x, y, z, (o, g) => {
      const fus = mk(GEO.cyl, MAT.plane, 0, 0, 0, 0.5, 4.4, 0.5);
      fus.rotation.x = Math.PI / 2;
      g.add(fus);
      const nose = mk(GEO.sphere, MAT.plane, 0, 0, 2.2, 0.5, 0.5, 0.7);
      g.add(nose);
      g.add(mk(GEO.box, MAT.planeWing, 0, -0.1, 0.2, 5.6, 0.12, 1.1));
      g.add(mk(GEO.box, MAT.planeTail, 0, 0.75, -1.9, 0.1, 1.2, 0.8));
      g.add(mk(GEO.box, MAT.planeWing, 0, 0.1, -1.9, 2, 0.08, 0.6));
      for (const s of [-1, 1]) {
        const engine = mk(GEO.cyl, MAT.cable, s * 1.4, -0.4, 0.4, 0.22, 0.7, 0.22);
        engine.rotation.x = Math.PI / 2;
        g.add(engine);
      }
      g.add(mk(GEO.box, MAT.black, 0, 0.25, 1.9, 0.6, 0.2, 0.4));
      o.cols.push(box(0, 0, 0, 0.55, 0.55, 2.5), box(0, -0.1, 0.2, 2.8, 0.18, 0.6));
      o.update = (o) => {
        const z = o.root.position.z;
        if (o.warnSprite) o.warnSprite.visible = z < -28;
        if (z > -25 && !o.whooshed) { o.whooshed = true; sfx.whoosh(); }
      };
    }, 46 + difficulty() * 14);
    addWarning(o, 1.8);
  }

  // ----- Snowy peaks -----
  function spire(x, z) {
    const h = rand(5, 12), r = rand(1.6, 2.5);
    return addObs('spire', x, 0, z, (o, g) => {
      const c = mk(GEO.cone, pick([MAT.spire, MAT.spireDark]), 0, h / 2, 0, r, h, r);
      c.rotation.y = rand(0, TAU);
      g.add(c);
      g.add(mk(GEO.cone, MAT.snow, 0, h * 0.86, 0, r * 0.32, h * 0.29, r * 0.32));
      for (let k = 0; k < 4; k++) {
        const f = (k + 0.5) / 4.6;
        o.cols.push(ball(0, h * f, 0, r * (1 - f) * 0.92));
      }
    });
  }
  function icicles(z) {
    const cx = rand(-4, 4);
    addObs('icicles', cx, 0, z, (o, g) => {
      g.add(mk(GEO.box, MAT.ice, 0, 11.4, 0, 9, 0.5, 1.4));
      for (let i = 0; i < 6; i++) {
        const x = (i - 2.5) * rand(1.2, 1.6), L = rand(2.5, 6.2), r = rand(0.3, 0.5);
        const c = mk(GEO.cone, MAT.ice, x, 11.2 - L / 2, 0, r, L, r);
        c.rotation.x = Math.PI;
        g.add(c);
        o.cols.push(ball(x, 11.2 - L * 0.25, 0, r * 0.9), ball(x, 11.2 - L * 0.7, 0, r * 0.45));
      }
    });
  }
  function snowball(x, z) {
    const r = rand(0.8, 1.3), zLand = rand(-12, -2);
    addObs('snowball', x, 14, z, (o, g) => {
      const m = mk(GEO.blob, MAT.snowball, 0, 0, 0, r);
      g.add(m);
      o.cols.push(ball(0, 0, 0, r * 0.92));
      o.update = (o, dt) => {
        const z = o.root.position.z;
        const s = clamp((z - (zLand - 50)) / 50, 0, 1);
        const y = lerp(14, r, s * s);
        if (s >= 1 && !o.landed) { o.landed = true; burst(o.root.position.x, 0.3, z, 0xffffff, 10, 5); }
        o.root.position.y = y;
        m.rotation.x -= dt * 3;
      };
    });
  }

  // Pick a pattern for the current biome. Everything spawns far away, in the fog.
  function spawnRow() {
    const b = curBiome(), d = difficulty(), z = SPAWN_Z, r = Math.random();
    const two = d > 0.25 && Math.random() < 0.55;
    if (b === 'ocean') {
      if (r < 0.45) { freeXs(two ? 2 : 1, 5).forEach((x) => seaStack(x, z)); if (Math.random() < 0.5) stormCloud(rand(-4, 4), z - 4); }
      else if (r < 0.65) { stormCloud(rand(-4, 4), z); if (Math.random() < 0.5) stormCloud(rand(-4, 4), z - 8); }
      else if (r < 0.85) { swordfish(rand(-5, 5), z); if (two) swordfish(rand(-5, 5), z - 10); }
      else gullFlock(z);
    } else if (b === 'forest') {
      if (r < 0.4) freeXs(two ? 2 : 1, 5).forEach((x) => tree(x, z));
      else if (r < 0.58) fallenLog(z);
      else if (r < 0.74) vines(z);
      else if (r < 0.88) raptor(z, false);
      else beeSwarm(z);
    } else if (b === 'city') {
      if (r < 0.38) freeXs(two ? 2 : 1, 5.5).forEach((x) => building(x, z));
      else if (r < 0.56) girder(z);
      else if (r < 0.7) wreckingBall(z);
      else if (r < 0.86) freeXs(two ? 2 : 1, 4).forEach((x) => drone(x, z));
      else airplane(z);
    } else {
      if (r < 0.42) freeXs(two ? 2 : 1, 5.5).forEach((x) => spire(x, z));
      else if (r < 0.6) icicles(z);
      else if (r < 0.85) freeXs(two ? 3 : 2, 3.5).forEach((x, i) => snowball(x, z - i * 6));
      else raptor(z, true);
    }
  }

  function spawnSeeds() {
    const x = rand(-XMAX + 1, XMAX - 1), y = rand(YMIN + 0.6, YMAX - 1), n = 5;
    const dx = rand(-0.25, 0.25), dy = rand(-0.15, 0.15);
    for (let i = 0; i < n; i++) {
      const root = mk(GEO.sphere, MAT.seed, x + dx * i * 2.2, clamp(y + dy * i * 2.2, YMIN, YMAX), SPAWN_Z - i * 2.2, 0.26);
      scene.add(root);
      inkOutline(root);
      seeds.push({ root, spin: rand(0, TAU) });
    }
  }

  function spawnBubble() {
    const kind = pick(Object.keys(POWERS));
    const root = new THREE.Group();
    root.position.set(rand(-XMAX + 1.5, XMAX - 1.5), rand(YMIN + 1, YMAX - 1.5), SPAWN_Z);
    // A paper token with its symbol, and a name tag underneath
    const token = new THREE.Sprite(powerSprite[kind]);
    token.scale.set(1.9, 1.9, 1);
    token.renderOrder = 5;
    root.add(token);
    const tag = new THREE.Sprite(powerLabel[kind]);
    tag.scale.set(1.9, 0.53, 1);
    tag.position.y = -1.35;
    tag.renderOrder = 5;
    root.add(tag);
    scene.add(root);
    bubbles.push({ root, kind, t: 0, baseY: root.position.y, token });
  }

  // ---------- Scenery (no collisions; just there to make the world feel alive) ----------
  // Big scenery gets ink outlines (the cut-paper look); tiny ground details stay plain to keep it light.
  function addDeco(root, ink = true) { if (ink) inkOutline(root); scene.add(root); decos.push({ root }); }
  const addDecoFlat = (root) => addDeco(root, false);
  function sideScenery(z) {
    const b = curBiome();
    for (const side of [-1, 1]) {
      const x = side * rand(13, 48);
      if (b === 'ocean') {
        if (Math.random() < 0.3) {
          const g = new THREE.Group();
          g.position.set(x, 0, z);
          g.add(mk(GEO.ico, MAT.sand, 0, -0.2, 0, rand(2.5, 4), 1, rand(2.5, 4)));
          const trunk = mk(GEO.cyl, MAT.trunk, 0, 2.2, 0, 0.18, 4.4, 0.18);
          trunk.rotation.z = side * 0.2;
          g.add(trunk);
          for (let k = 0; k < 5; k++) {
            const leaf = mk(GEO.box, MAT.palm, Math.cos(k * 1.26) * 0.9 - side * 0.4, 4.3, Math.sin(k * 1.26) * 0.9, 2, 0.08, 0.45);
            leaf.rotation.y = -k * 1.26; leaf.rotation.z = 0.35;
            g.add(leaf);
          }
          addDeco(g);
        } else if (Math.random() < 0.3) {
          addDeco(mk(GEO.ico, MAT.rockDark, x, 0.3, z, rand(0.8, 2)));
        }
      } else if (b === 'forest') {
        for (let k = 0; k < (Math.random() < 0.4 ? 2 : 1); k++) {
          const g = new THREE.Group();
          const h = rand(5, 11);
          g.position.set(side * (h * 0.32 + rand(9.5, 42)), 0, z + rand(-2, 2));
          g.add(mk(GEO.cyl, MAT.trunk, 0, 0.6, 0, 0.3, 1.2, 0.3));
          g.add(mk(GEO.cone, Math.random() < 0.5 ? MAT.pine : MAT.pineDark, 0, 1 + h / 2, 0, h * 0.32, h, h * 0.32));
          addDeco(g);
        }
      } else if (b === 'city') {
        if (Math.random() < 0.8) {
          const w = rand(4, 8), h = rand(8, 30), d = rand(4, 8);
          addDeco(mk(GEO.box, pick(BUILDING_SIDE_MATS), side * (w / 2 + rand(10, 36)), h / 2, z, w, h, d));
        }
        if (Math.random() < 0.35) {
          const g = new THREE.Group();
          g.position.set(side * 9.5, 0, z);
          g.add(mk(GEO.box, MAT.streetlamp, 0, 2, 0, 0.12, 4, 0.12));
          g.add(mk(GEO.box, MAT.streetlamp, -side * 0.5, 4, 0, 1, 0.1, 0.12));
          g.add(mk(GEO.sphere, MAT.lampGlow, -side * 0.95, 3.85, 0, 0.18));
          addDeco(g);
        }
      } else {
        if (Math.random() < 0.55) {
          const g = new THREE.Group();
          const h = rand(12, 34), r = h * rand(0.45, 0.65);
          // Keep the whole mountain outside the flight corridor (it has no collision).
          g.position.set(side * (r + rand(10, 36)), 0, z);
          const m = mk(GEO.cone, Math.random() < 0.5 ? MAT.mountain : MAT.mountainDark, 0, h / 2, 0, r, h, r);
          m.rotation.y = rand(0, TAU);
          g.add(m);
          g.add(mk(GEO.cone, MAT.snow, 0, h * 0.84, 0, r * 0.34, h * 0.33, r * 0.34));
          addDeco(g);
        } else if (Math.random() < 0.4) {
          addDeco(mk(GEO.ico, MAT.snowMound, x, 0, z, rand(1, 2.2), rand(0.5, 1), rand(1, 2.2)));
        }
      }
    }
    // Little details on the ground under you so you can feel the speed
    if (b === 'ocean') { for (let k = 0; k < 2; k++) addDecoFlat(mk(GEO.box, MAT.whitecap, rand(-12, 12), 0.32, z + rand(-2, 2), rand(0.6, 1.4), 0.04, 0.15)); }
    else if (b === 'forest') { for (let k = 0; k < 3; k++) addDecoFlat(mk(GEO.cone, MAT.grass, rand(-10, 10), 0.25, z + rand(-2, 2), 0.25, 0.5, 0.25)); if (Math.random() < 0.3) addDecoFlat(mk(GEO.sphere, MAT.flower, rand(-8, 8), 0.2, z, 0.18)); }
    else if (b === 'city') { for (const lx of [-3.5, 3.5]) addDecoFlat(mk(GEO.box, MAT.dash, lx, 0.03, z, 0.18, 0.02, 1.4)); }
    else { if (Math.random() < 0.6) addDecoFlat(mk(GEO.ico, MAT.snowMound, rand(-10, 10), 0, z, rand(0.5, 1.1), 0.35, rand(0.5, 1.1))); }
  }
  function skyCloud(z) {
    const g = new THREE.Group();
    g.position.set(rand(-60, 60), rand(17, 26), z);
    for (let k = 0; k < 4; k++) { const r = rand(2, 3.4); g.add(mk(GEO.blob, MAT.cloud, (k - 1.5) * rand(2, 3), rand(-0.6, 0.6), rand(-1, 1), r, r * 0.72, r)); }
    addDeco(g);
  }

  // ---------- Collision ----------
  function hits(o, bx, by, bz, r) {
    const p = o.root.position;
    for (const c of o.cols) {
      const cx = p.x + c.x, cy = p.y + c.y, cz = p.z + c.z;
      if (c.t === 's') {
        const dx = bx - cx, dy = by - cy, dz = bz - cz, rr = r + c.r;
        if (dx * dx + dy * dy + dz * dz < rr * rr) return true;
      } else {
        const qx = clamp(bx, cx - c.hx, cx + c.hx), qy = clamp(by, cy - c.hy, cy + c.hy), qz = clamp(bz, cz - c.hz, cz + c.hz);
        const dx = bx - qx, dy = by - qy, dz = bz - qz;
        if (dx * dx + dy * dy + dz * dz < r * r) return true;
      }
    }
    return false;
  }

  function hitBy(o) {
    if (timers.shield > 0) {
      o.dead = true;
      bonus += 10 * (timers.double > 0 ? 2 : 1);
      burst(bird.x, bird.y, -1, 0x5eead4, 22, 10);
      sfx.smash();
      shake = 0.25;
      return;
    }
    bird.hearts--;
    bird.inv = 1.6;
    shake = 0.5;
    burst(bird.x, bird.y, 0, 0x38bdf8, 16, 7);
    el.flash.style.transition = 'none';
    el.flash.style.opacity = '0.35';
    requestAnimationFrame(() => { el.flash.style.transition = 'opacity 0.45s'; el.flash.style.opacity = '0'; });
    sfx.hit();
    if (bird.hearts <= 0) gameOver();
  }

  // ---------- Input ----------
  function tryStart() {
    initAudio();
    if (state === 'menu') start();
    else if (state === 'over' && performance.now() > overReadyAt) start();
  }
  // Screen coordinates -> game-view coordinates (they differ when the game is turned 90°).
  function toView(e) {
    return rotated ? { x: e.clientY, y: window.innerWidth - e.clientX } : { x: e.clientX, y: e.clientY };
  }
  // ---------- Touch joystick ----------
  // Touch anywhere: the joystick jumps under your thumb. Push the knob to fly that way;
  // the further you push, the faster the bird moves. Let go and it drifts back to its corner.
  const stickEl = $('stick'), knobEl = $('knob');
  const STICK_R = 50;           // how far the knob can travel (px)
  const STICK_SPEED = { x: 15, y: 11 };
  const stick = { id: null, cx: 0, cy: 0, jx: 0, jy: 0 };
  function stickHome() {
    // Resting spot: bottom-left corner of the game view
    stickEl.style.left = '92px';
    stickEl.style.top = (viewH - 104) + 'px';
    knobEl.style.transform = '';
    stickEl.classList.remove('active');
  }
  function stickVisible() {
    stickEl.classList.toggle('gone', !(isTouch && state === 'playing' && !gyroOn));
  }

  // The mouse never steers: on a computer you fly with the keyboard, and a click only starts the game.
  window.addEventListener('pointerdown', (e) => {
    const wasPlaying = state === 'playing';
    tryStart();
    if (e.pointerType === 'mouse' || gyroOn || stick.id !== null) return;
    if (!wasPlaying && state !== 'playing') return;
    const p = toView(e);
    Object.assign(stick, { id: e.pointerId, cx: p.x, cy: p.y, jx: 0, jy: 0 });
    stickEl.style.left = p.x + 'px';
    stickEl.style.top = p.y + 'px';
    knobEl.style.transform = '';
    stickEl.classList.add('active');
    stickVisible();
  });
  window.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' || e.pointerId !== stick.id) return;
    const p = toView(e);
    let dx = p.x - stick.cx, dy = p.y - stick.cy;
    const d = Math.hypot(dx, dy);
    if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
    knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
    stick.jx = dx / STICK_R;
    stick.jy = dy / STICK_R;
  });
  const endStick = (e) => {
    if (e.pointerId !== stick.id) return;
    Object.assign(stick, { id: null, jx: 0, jy: 0 });
    stickHome();
  };
  window.addEventListener('pointerup', endStick);
  window.addEventListener('pointercancel', endStick);
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
    if ((e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') && !e.repeat) tryStart();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; Object.assign(stick, { id: null, jx: 0, jy: 0 }); stickHome(); });

  // ---------- Gyro (tilt steering) ----------
  // Tilt the top of the phone toward you to climb, away to dive; tilt left/right to steer.
  // However you're holding the phone when the run starts counts as "level".
  let gyroOn = false, gyroRaw = null, gyroNeutral = null, gyroSeen = false;
  const GYRO_RANGE = 22; // degrees of tilt to reach the edge of the corridor
  function readTilt(e) {
    let ang = (screen.orientation && typeof screen.orientation.angle === 'number')
      ? screen.orientation.angle
      : (typeof window.orientation === 'number' ? window.orientation : 0);
    // In landscape mode the screen still says "portrait", but you're holding the phone
    // turned left (its right edge on top), exactly like a normal landscape-left phone.
    if (rotated) ang = 90;
    // The raw beta/gamma angles wrap around (gamma jumps from -90 to +90 when the phone
    // is tilted far or held upright), which made the bird flip to the opposite edge.
    // Instead, work out which way "up" points in the phone's own frame and measure the
    // tilt from that: it changes smoothly in every direction and never wraps.
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    const ux = -Math.sin(g) * Math.cos(b), uy = Math.sin(b), uz = Math.cos(g) * Math.cos(b);
    // turn that into the screen's own left/right and up/down for the current orientation
    let sx, sy;
    if (ang === 90) { sx = -uy; sy = ux; }
    else if (ang === -90 || ang === 270) { sx = uy; sy = -ux; }
    else if (ang === 180) { sx = -ux; sy = -uy; }
    else { sx = ux; sy = uy; }
    const DEG = 180 / Math.PI;
    return {
      up: Math.atan2(sy, uz) * DEG,                        // tilt the top toward / away from you
      right: Math.atan2(-sx, Math.hypot(sy, uz)) * DEG,    // tilt (or turn like a wheel) left / right
    };
  }
  // difference between two angles, always the short way round (-180..180)
  const angDiff = (a, b) => ((a - b + 540) % 360) - 180;
  window.addEventListener('deviceorientation', (e) => {
    if (e.beta == null || e.gamma == null) return;
    gyroSeen = true;
    const t = readTilt(e);
    // a little smoothing takes out sensor jitter without adding noticeable lag
    gyroRaw = gyroRaw ? { up: gyroRaw.up + angDiff(t.up, gyroRaw.up) * 0.45, right: gyroRaw.right + angDiff(t.right, gyroRaw.right) * 0.45 } : t;
    if (gyroOn && gyroNeutral == null) gyroNeutral = { ...gyroRaw };
  });
  function calibrateGyro() { gyroNeutral = gyroRaw ? { ...gyroRaw } : null; }
  function refreshGyroBtn() {
    el.gyro.classList.toggle('on', gyroOn);
    el.gyroLabel.classList.toggle('gone', !gyroOn);
    stickVisible(); // gyro steers instead of the joystick
  }
  function setGyro(on) {
    gyroOn = on;
    try { localStorage.setItem('wingsGyro', on ? '1' : '0'); } catch (e) {}
    refreshGyroBtn();
    if (on) {
      gyroNeutral = null;
      banner('TILT TO STEER');
      setTimeout(() => {
        if (gyroOn && !gyroSeen) { gyroOn = false; refreshGyroBtn(); banner('NO GYRO FOUND'); }
      }, 1500);
    }
  }
  el.gyro.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.gyro.addEventListener('click', (e) => {
    e.stopPropagation();
    el.gyro.blur();
    initAudio();
    if (gyroOn) { setGyro(false); return; }
    // iPhone/iPad need permission, and it has to be asked right inside the tap.
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      DOE.requestPermission()
        .then((res) => { if (res === 'granted') setGyro(true); else banner('GYRO BLOCKED'); })
        .catch(() => banner('GYRO BLOCKED'));
    } else if (DOE) setGyro(true);
    else banner('NO GYRO FOUND');
  });
  try {
    const DOE = window.DeviceOrientationEvent;
    if (isTouch && localStorage.getItem('wingsGyro') === '1' && DOE && typeof DOE.requestPermission !== 'function') { gyroOn = true; refreshGyroBtn(); }
  } catch (e) {}

  // ---------- Biome colors ----------
  const col = {
    sky: new THREE.Color(PALETTE.ocean.sky), ground: new THREE.Color(PALETTE.ocean.ground),
    hemiSky: new THREE.Color(PALETTE.ocean.hemiSky), hemiGround: new THREE.Color(PALETTE.ocean.hemiGround), sun: new THREE.Color(PALETTE.ocean.sun),
  };
  const tgt = { sky: new THREE.Color(), ground: new THREE.Color(), hemiSky: new THREE.Color(), hemiGround: new THREE.Color(), sun: new THREE.Color() };
  function blendColors(dt) {
    const p = PALETTE[curBiome()];
    const k = Math.min(1, dt * 0.9);
    for (const key of ['sky', 'ground', 'hemiSky', 'hemiGround', 'sun']) col[key].lerp(tgt[key].set(p[key]), k);
    scene.background.copy(col.sky);
    scene.fog.color.copy(col.sky);
    groundMat.color.copy(col.ground);
    hemi.color.copy(col.hemiSky);
    hemi.groundColor.copy(col.hemiGround);
    sunLight.color.copy(col.sun);
    sunLight.intensity = lerp(sunLight.intensity, p.sunI * 0.68, k);
    sun.material.color.copy(col.sun);
    waveAmp = lerp(waveAmp, curBiome() === 'ocean' ? 0.28 : 0, k);
  }

  let groundFlat = false;
  function animateGround() {
    if (waveAmp < 0.005) {
      if (!groundFlat) { for (let i = 0; i < groundPos.count; i++) groundPos.setZ(i, 0); groundPos.needsUpdate = true; groundFlat = true; }
      return;
    }
    groundFlat = false;
    for (let i = 0; i < groundPos.count; i++) {
      const lx = groundPos.getX(i), ly = groundPos.getY(i);
      const wz = -ly + ground.position.z;
      groundPos.setZ(i, waveAmp * (Math.sin(lx * 0.45 + time * 1.4) * 0.6 + Math.sin((wz - scroll) * 0.32) * 0.8));
    }
    groundPos.needsUpdate = true;
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    shake = Math.max(0, shake - dt * 1.5);
    const playing = state === 'playing';
    const spd = playing ? worldSpeed() : (state === 'menu' ? 14 : 10);
    scroll += spd * dt;

    // ----- Bird -----
    if (bird.alive) {
      const k = 12 * dt;
      if (keys.ArrowUp || keys.KeyW) bird.ty += k;
      if (keys.ArrowDown || keys.KeyS) bird.ty -= k;
      if (keys.ArrowLeft || keys.KeyA) bird.tx -= k;
      if (keys.ArrowRight || keys.KeyD) bird.tx += k;
      if (stick.id !== null && !gyroOn) {
        // Small dead zone in the middle, then a gentle curve for fine control
        const m = Math.hypot(stick.jx, stick.jy);
        if (m > 0.12) {
          const s = Math.pow((m - 0.12) / 0.88, 1.3) / m;
          bird.tx += stick.jx * s * STICK_SPEED.x * dt;
          bird.ty -= stick.jy * s * STICK_SPEED.y * dt;
        }
      }
      if (gyroOn && gyroRaw && gyroNeutral) {
        const up = clamp(angDiff(gyroRaw.up, gyroNeutral.up) / GYRO_RANGE, -1, 1);
        const right = clamp(angDiff(gyroRaw.right, gyroNeutral.right) / GYRO_RANGE, -1, 1);
        bird.ty = lerp(YMIN, YMAX, 0.5 + up * 0.5);
        bird.tx = right * XMAX;
      }
      if (state === 'menu') {
        // On wide screens the bird shows off beside the menu card; otherwise it drifts behind it
        const side = viewW > 1000 ? 5 : 0;
        bird.tx = side + Math.sin(time * 0.6) * (side ? 0.8 : 2.5);
        bird.ty = 4.5 + Math.sin(time * 1.1) * 1.2;
      }
      bird.tx = clamp(bird.tx, -XMAX, XMAX);
      bird.ty = clamp(bird.ty, YMIN, YMAX);
      const px = bird.x, py = bird.y;
      bird.x = lerp(bird.x, bird.tx, Math.min(1, dt * 7));
      bird.y = lerp(bird.y, bird.ty, Math.min(1, dt * 7));
      bird.vx = (bird.x - px) / Math.max(dt, 1e-4);
      bird.vy = (bird.y - py) / Math.max(dt, 1e-4);
      // Every so often the bird stops flapping and glides with its wings held out.
      // Climbing hard needs flapping, so a steep climb cuts a glide short.
      const climbing = bird.vy > 2.2;
      if (bird.glide > 0) {
        bird.glide -= dt;
        if (climbing) bird.glide = 0;
        if (bird.glide <= 0) bird.glideCd = rand(2.5, 5.5);
      } else {
        bird.glideCd -= dt * (bird.vy < -0.5 ? 1.8 : 1); // dives make it want to glide sooner
        if (bird.glideCd <= 0 && !climbing) bird.glide = rand(1.0, 2.6);
      }
      bird.glideMix = lerp(bird.glideMix, bird.glide > 0 ? 1 : 0, Math.min(1, dt * 5));
      // Flap speed eases down as it settles into a glide (and picks up hard when climbing)
      bird.flap += dt * (climbing ? 22 : 13) * (1 - bird.glideMix * 0.9);
      bird.size = lerp(bird.size, timers.tiny > 0 ? 0.55 : 1, Math.min(1, dt * 8));
      bird.inv = Math.max(0, bird.inv - dt);
    } else {
      bird.fallV += 22 * dt;
      bird.y = Math.max(0.5, bird.y - bird.fallV * dt);
      bird.spin += dt * 9;
    }

    if (playing) {
      dist += spd * dt;
      const b = Math.floor(dist / BIOME_LEN);
      if (b !== biomeIdx) { biomeIdx = b; banner(BIOME_NAMES[curBiome()]); sfx.biome(); }

      nextSpawn -= spd * dt;
      if (nextSpawn <= 0) { spawnRow(); nextSpawn = lerp(30, 17, difficulty()) + rand(0, 8); }
      seedNext -= spd * dt;
      if (seedNext <= 0) { spawnSeeds(); seedNext = rand(28, 44); }
      powerCd -= dt;
      if (powerCd <= 0) { spawnBubble(); powerCd = rand(8, 12); }
      for (const k in timers) {
        if (timers[k] > 0) { timers[k] = Math.max(0, timers[k] - dt); if (timers[k] === 0) sfx.end(); }
      }
    }

    // Scenery keeps flowing even on the menu
    decoNext -= spd * dt;
    while (decoNext <= 0) { sideScenery(SPAWN_Z + decoNext); decoNext += 4; }
    cloudNext -= spd * dt;
    if (cloudNext <= 0) { skyCloud(SPAWN_Z - 30); cloudNext = rand(18, 34); }

    // ----- Move everything toward the camera -----
    for (const o of obstacles) {
      o.root.position.z += (spd + (state !== 'menu' ? o.extra : 0)) * dt;
      if (o.update) o.update(o, dt);
      // Once something has passed the bird it sits between the bird and the camera,
      // where it would block your view. Fade it to see-through so you can still see
      // the bird through it (collisions are unchanged), and only hide it right at the camera.
      const z = o.root.position.z;
      setFade(o, z < 0.3 ? 0 : Math.min(FADE_STEPS.length - 1, Math.ceil((z - 0.3) / 0.45)));
      o.root.visible = z < 9.5;
    }
    for (const d of decos) d.root.position.z += spd * dt;
    updateTrails(dt, spd);
    for (const s of seeds) { s.root.position.z += spd * dt; s.spin += dt * 3; s.root.rotation.set(s.spin, s.spin * 1.3, 0); }
    for (const p of bubbles) { p.root.position.z += spd * dt; p.t += dt; p.root.position.y = p.baseY + Math.sin(p.t * 3) * 0.3; const pulse = 1.9 + Math.sin(p.t * 5) * 0.08; p.token.scale.set(pulse, pulse, 1); }

    // ----- Collisions -----
    if (playing && bird.alive) {
      const r = birdRadius();
      for (const o of obstacles) {
        if (o.dead || Math.abs(o.root.position.z) > 7) continue;
        if (!hits(o, bird.x, bird.y, 0, r)) continue;
        if (timers.shield <= 0 && (timers.ghost > 0 || bird.inv > 0)) continue;
        hitBy(o);
        if (state !== 'playing') break;
      }
      for (const s of seeds) {
        if (s.got) continue;
        const p = s.root.position;
        const dx = bird.x - p.x, dy = bird.y - p.y, dz = -p.z, d = Math.hypot(dx, dy, dz);
        if (timers.magnet > 0 && d < 9 && p.z > -12) { const m = Math.min(1, dt * 7); p.x += dx * m; p.y += dy * m; p.z += dz * m * 0.5; }
        if (d < r + 0.55) {
          s.got = true;
          seedsGot++;
          bonus += 5 * (timers.double > 0 ? 2 : 1);
          sfx.seed();
          burst(p.x, p.y, p.z, 0xfde047, 5, 4);
        }
      }
      for (const p of bubbles) {
        const q = p.root.position;
        if (!p.got && Math.hypot(bird.x - q.x, bird.y - q.y, q.z) < r + 1.0) {
          p.got = true;
          powersGot++;
          const P = POWERS[p.kind];
          timers[p.kind] = P.time;
          banner(P.label + '!');
          burst(q.x, q.y, q.z, new THREE.Color(P.color).getHex(), 18, 8);
          sfx.power();
        }
      }
    }

    // ----- Cleanup -----
    const keep = (list, cond) => { let j = 0; for (const o of list) { if (cond(o)) list[j++] = o; else scene.remove(o.root); } list.length = j; };
    keep(obstacles, (o) => !o.dead && o.root.position.z < KILL_Z);
    keep(decos, (o) => o.root.position.z < KILL_Z + 10);
    keep(seeds, (o) => !o.got && o.root.position.z < KILL_Z);
    keep(bubbles, (o) => !o.got && o.root.position.z < KILL_Z);
    for (const q of particles) {
      q.root.position.x += q.vx * dt; q.root.position.y += q.vy * dt; q.root.position.z += (q.vz + spd * 0.6) * dt;
      q.vy -= q.g * dt; q.life -= dt;
      q.root.rotation.x += dt * 6; q.root.rotation.y += dt * 4;
      q.root.scale.multiplyScalar(1 - dt * 1.2);
    }
    keep(particles, (q) => q.life > 0);

    blendColors(dt);
    animateGround();
    if (playing) updateHud();
  }

  // ---------- Render ----------
  const camTarget = new THREE.Vector3();
  const camLook = new THREE.Vector3(0, 3, -12);
  function render(dt) {
    const b = bird;
    birdRoot.position.set(b.x, b.y, 0);
    birdRoot.scale.setScalar(b.size * 1.15);
    // Bank into turns, pitch with climbs
    if (b.alive) {
      birdModel.rotation.z = lerp(birdModel.rotation.z, clamp(-b.vx * 0.07, -0.8, 0.8), Math.min(1, dt * 8));
      // (nose dips a touch while gliding)
      birdModel.rotation.x = lerp(birdModel.rotation.x, clamp(b.vy * 0.05, -0.5, 0.5) - 0.06 * b.glideMix, Math.min(1, dt * 8));
      // Blend between flapping and a gliding pose (wings held slightly up, with a gentle wobble)
      const flapAngle = Math.sin(b.flap) * 0.65;
      const glideAngle = 0.14 + Math.sin(time * 2.2) * 0.04;
      // + a resting upward "V" so the paper wings face the camera instead of showing their thin edge
      const f = lerp(flapAngle, glideAngle, b.glideMix) + 0.16;
      for (const w of wings) {
        w.pivot.rotation.z = w.s * f;
        // Paper wings sweep back a little while gliding, and twist slightly on each beat
        w.pivot.rotation.y = w.s * (-0.12 * b.glideMix);
        w.pivot.rotation.x = Math.sin(b.flap + 0.6) * 0.12 * (1 - b.glideMix);
      }
    } else {
      birdModel.rotation.z = b.spin;
      birdModel.rotation.x = 0.6;
    }
    birdRoot.visible = !(b.inv > 0 && Math.floor(b.inv * 12) % 2 === 0);
    const ghost = timers.ghost > 0;
    for (const m of Object.values(birdMats)) { m.transparent = ghost; m.opacity = ghost ? 0.4 + 0.1 * Math.sin(time * 10) : 1; }
    shieldBubble.visible = timers.shield > 0 && !(timers.shield < 2 && Math.floor(time * 8) % 2 === 0);
    shieldBubble.scale.setScalar(1.25 + Math.sin(time * 6) * 0.05);
    shieldBubble.rotation.y += dt;
    magnetRing.visible = timers.magnet > 0;
    magnetRing.scale.setScalar(1.6 + Math.sin(time * 5) * 0.12);
    magnetRing.material.opacity = 0.35 + 0.2 * Math.sin(time * 5);

    shadow.position.set(b.x, 0.35, 0);
    shadow.scale.setScalar(0.75 * b.size * (1 - b.y / 16));
    shadow.material.opacity = 0.32 * (1 - b.y / 13);

    // Chase camera: behind and a bit above the bird, leaning into its moves
    if (camLocked) {
      // Steady camera: parked in one spot with the whole flight area in view.
      // No following, no tilting into turns, no shake — only the bird moves.
      camTarget.set(0, 7.4, 14.5);
      camera.position.lerp(camTarget, Math.min(1, dt * 4));
      camLook.set(0, 4.6, -16);
      camera.lookAt(camLook);
    } else {
      camTarget.set(b.x * 0.62, b.y * 0.72 + 4.4, 11);
      camera.position.lerp(camTarget, Math.min(1, dt * 5));
      camLook.set(b.x * 0.78, b.y * 0.86 + 0.5, -16);
      if (shake > 0) camera.position.add(new THREE.Vector3(rand(-1, 1) * shake, rand(-1, 1) * shake, 0));
      camera.lookAt(camLook);
      camera.rotation.z += clamp(-b.vx * 0.006, -0.08, 0.08);
    }

    renderer.render(scene, camera);
  }

  // ---------- Sound button ----------
  // ---------- Steady camera toggle ----------
  const camBtn = $('camlock'), camLabel = $('camLabel');
  function refreshCamBtn() {
    camBtn.classList.toggle('on', camLocked);
    camLabel.classList.toggle('gone', !camLocked);
    camBtn.setAttribute('aria-pressed', camLocked ? 'true' : 'false');
  }
  camBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  camBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    camBtn.blur();
    camLocked = !camLocked;
    try { localStorage.setItem('wingsCamLock', camLocked ? '1' : '0'); } catch (err) {}
    refreshCamBtn();
    banner(camLocked ? 'STEADY CAMERA' : 'CHASE CAMERA');
  });
  refreshCamBtn();

  const soundBtn = $('sound');
  function refreshSoundBtn() { soundBtn.textContent = muted ? '🔇' : '🔊'; }
  soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('wingsMuted', muted ? '1' : '0'); } catch (err) {}
    refreshSoundBtn();
    soundBtn.blur();
    if (!muted) { initAudio(); sfx.seed(); }
  });
  refreshSoundBtn();

  // ---------- Landscape button ----------
  function recalibrateAfterTurn() {
    // How you hold the phone just changed, so re-zero the tilt on the next reading.
    gyroRaw = null;
    gyroNeutral = null;
  }
  rotateBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  rotateBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    rotateBtn.blur();
    landscape = !landscape;
    try { localStorage.setItem('wingsLandscape', landscape ? '1' : '0'); } catch (err) {}
    resize();
    recalibrateAfterTurn();
    if (landscape && rotated) banner('TURN YOUR PHONE ⟲');
  });
  window.addEventListener('orientationchange', () => setTimeout(() => { resize(); recalibrateAfterTurn(); }, 150));
  window.focus();

  // ---------- Bird picker ----------
  const cardsEl = $('birdCards');
  const cardEls = BIRDS.map((b, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bcard';
    btn.title = b.name;
    btn.setAttribute('aria-label', b.name);
    btn.innerHTML = `<img src="${birdIconURL[i]}" alt="">`;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (swipe.justDragged) return; // the end of a swipe isn't a tap
      selectBird(i);
    });
    cardsEl.appendChild(btn);
    return btn;
  });
  // Touching the picker must not start the game
  $('picker').addEventListener('pointerdown', (e) => e.stopPropagation());

  // Swipe through the birds. The page blocks native touch scrolling (so the game
  // never scrolls by accident), so the strip follows the finger by hand here.
  // Let go and it settles on the bird nearest the middle; a quick flick moves one bird.
  const swipe = { id: null, x0: 0, left0: 0, lastX: 0, lastT: 0, vx: 0, moved: false, justDragged: false };
  function nearestCard() {
    const mid = cardsEl.scrollLeft + cardsEl.clientWidth / 2;
    let bestI = 0, bestD = Infinity;
    cardEls.forEach((c, i) => {
      const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
      if (d < bestD) { bestD = d; bestI = i; }
    });
    return bestI;
  }
  cardsEl.addEventListener('pointerdown', (e) => {
    swipe.id = e.pointerId;
    // in landscape mode the game view is turned, so the strip runs along the screen's height
    swipe.x0 = swipe.lastX = rotated ? e.clientY : e.clientX;
    swipe.lastT = performance.now();
    swipe.left0 = cardsEl.scrollLeft;
    swipe.vx = 0;
    swipe.moved = false;
    swipe.justDragged = false;
    cardsEl.style.scrollSnapType = 'none';
  });
  cardsEl.addEventListener('pointermove', (e) => {
    if (e.pointerId !== swipe.id) return;
    const x = rotated ? e.clientY : e.clientX;
    const dx = x - swipe.x0;
    if (!swipe.moved && Math.abs(dx) > 8) {
      swipe.moved = true;
      try { cardsEl.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (!swipe.moved) return;
    cardsEl.scrollLeft = swipe.left0 - dx;
    const now = performance.now();
    const dt = Math.max(1, now - swipe.lastT);
    swipe.vx = lerp(swipe.vx, (x - swipe.lastX) / dt, 0.4); // px per ms
    swipe.lastX = x; swipe.lastT = now;
  });
  const endSwipe = (e) => {
    if (e.pointerId !== swipe.id) return;
    swipe.id = null;
    cardsEl.style.scrollSnapType = '';
    if (!swipe.moved) return;           // it was a tap: the card's click handles it
    swipe.justDragged = true;
    setTimeout(() => { swipe.justDragged = false; }, 60);
    const dragged = (rotated ? e.clientY : e.clientX) - swipe.x0;
    // A quick, short flick steps exactly one bird; a longer drag lands on the bird nearest the middle
    const i = Math.abs(swipe.vx) > 0.5 && Math.abs(dragged) < 70
      ? birdIndex + (swipe.vx < 0 ? 1 : -1)
      : nearestCard();
    selectBird(clamp(i, 0, BIRDS.length - 1));
  };
  cardsEl.addEventListener('pointerup', endSwipe);
  cardsEl.addEventListener('pointercancel', endSwipe);
  // Mouse wheel / trackpad: scroll sideways through the birds
  let wheelTimer = 0;
  cardsEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    cardsEl.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => selectBird(nearestCard()), 140);
  }, { passive: false });
  function selectBird(i, quiet = false) {
    birdIndex = (i + BIRDS.length) % BIRDS.length;
    const b = BIRDS[birdIndex];
    buildBird(b);
    try { localStorage.setItem('wingsBird', b.id); } catch (e) {}
    cardEls.forEach((c, j) => c.classList.toggle('sel', j === birdIndex));
    $('birdName').textContent = b.name;
    $('birdBlurb').textContent = b.blurb;
    $('changeBirdImg').src = birdIconURL[birdIndex];
    const card = cardEls[birdIndex];
    cardsEl.scrollTo({ left: card.offsetLeft - cardsEl.clientWidth / 2 + card.offsetWidth / 2, behavior: quiet ? 'auto' : 'smooth' });
    if (!quiet) { initAudio(); tone(660, 990, 0.12, 'triangle', 0.07); tone(990, 1320, 0.1, 'triangle', 0.05, 0.07); }
  }
  // Left / right arrows pick a bird while you're on the menu
  window.addEventListener('keydown', (e) => {
    if (state !== 'menu') return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') selectBird(birdIndex - 1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') selectBird(birdIndex + 1);
  });
  // "Change bird" on the game-over sheet goes back to the menu
  const changeBtn = $('changeBird');
  changeBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  changeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    changeBtn.blur();
    state = 'menu';
    reset();
    el.over.classList.add('hidden');
    el.menu.classList.remove('hidden');
    stickVisible();
    selectBird(birdIndex, true);
  });
  requestAnimationFrame(() => selectBird(birdIndex, true));

  // ---------- Trails on / off ----------
  function refreshTrailToggles() {
    document.querySelectorAll('.trailToggle').forEach((b) => {
      b.classList.toggle('on', trailsOn);
      b.setAttribute('aria-pressed', trailsOn ? 'true' : 'false');
      b.querySelector('.tl').textContent = trailsOn ? 'TRAILS ON' : 'TRAILS OFF';
    });
  }
  function setTrails(on) {
    trailsOn = on;
    try { localStorage.setItem('wingsTrails', on ? '1' : '0'); } catch (e) {}
    refreshTrailToggles();
    initAudio(); tone(on ? 700 : 500, on ? 1050 : 350, 0.1, 'triangle', 0.06);
  }
  document.querySelectorAll('.trailToggle').forEach((b) => {
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('click', (e) => { e.stopPropagation(); b.blur(); setTrails(!trailsOn); });
  });
  window.addEventListener('keydown', (e) => { if (e.code === 'KeyT' && !e.repeat) setTrails(!trailsOn); });
  refreshTrailToggles();

  // Hooks for automated testing (harmless in normal play)
  window.__ww = {
    get state() { return state; }, get score() { return score; }, get dist() { return dist; }, get biome() { return curBiome(); },
    get counts() { return { obstacles: obstacles.length, decos: decos.length, seeds: seeds.length, bubbles: bubbles.length, particles: particles.length }; },
    get kinds() { return [...new Set(obstacles.map((o) => o.kind))]; },
    bird, timers,
    jump(d) { dist = d; biomeIdx = Math.floor(d / BIOME_LEN); },
    give(k) { timers[k] = POWERS[k].time; },
    get gyro() { return { on: gyroOn, raw: gyroRaw, neutral: gyroNeutral, rotated }; },
    get bubbles() { return bubbles; }, get obstacles() { return obstacles; }, get trailCount() { return trailBits.length; }, get trailsOn() { return trailsOn; },
    birds: BIRDS, pickBird: (i) => selectBird(i, true),
    spawn: { airplane, raptor, gullFlock, swordfish, wreckingBall, snowball, spawnBubble },
  };

  // ---------- Pause ----------
  // A pause button (shown only while a round is going), a "Paused" card, P / Esc to
  // toggle, and an automatic pause when you switch away from the game. While paused,
  // taps and keys don't reach the game, so the tap that resumes doesn't also play.
  const Pause = (() => {
    const cfg = {
      theme: 'paper',                      // 'neon' or 'paper'
      top: 'calc(max(14px, env(safe-area-inset-top)) + 84px)', right: '118px',      // where the button sits (next to sound)
      isPlaying: () => (state === 'playing'),
      restart: () => { start(); },
      onChange: (p) => { for (const k in keys) keys[k] = false; Object.assign(stick, { id: null, jx: 0, jy: 0 }); stickHome(); },
    };
    const coarse = window.matchMedia('(pointer: coarse)').matches;
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>';
    const ICON_PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
    const css = document.createElement('style');
    const neon = cfg.theme === 'neon';
    css.textContent = `
      #pauseBtn { position: fixed; top: ${cfg.top}; right: ${cfg.right}; z-index: 8; display: none; place-items: center; cursor: pointer; padding: 0;
        ${neon
          ? 'width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(10,8,30,.5); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);'
          : 'width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid #23243a; background: #fffaf0; color: #23243a; box-shadow: 3px 3px 0 rgba(35,36,58,.28);'} }
      #pauseBtn.show { display: grid; }
      #pauseBtn:active { transform: ${neon ? 'scale(.92)' : 'translate(2px,2px)'}; }
      #pausedCard { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; text-align: center;
        background: ${neon ? 'radial-gradient(ellipse at center, rgba(5,3,15,.35), rgba(5,3,15,.8))' : 'rgba(35,36,58,.32)'}; }
      #pausedCard.on { display: flex; }
      #pausedCard .pc-in { ${neon
        ? 'color: #fff;'
        : 'background: #fffaf0; color: #23243a; border: 3px solid #23243a; border-radius: 20px; box-shadow: 8px 8px 0 rgba(35,36,58,.28); padding: 22px 34px 24px; transform: rotate(-1.5deg);'} }
      #pausedCard .pc-t { font-family: ${neon ? 'inherit' : "ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif"}; font-weight: 900;
        font-size: clamp(38px, 11vw, 64px); letter-spacing: .12em; line-height: 1;
        ${neon ? 'text-shadow: 0 0 22px rgba(79,209,255,.7), 0 0 44px rgba(167,139,250,.5);' : ''} }
      #pausedCard .pc-s { margin-top: 14px; font-weight: 800; letter-spacing: .14em; font-size: 13px; opacity: .85; }
      #pausedCard .pc-btns { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
      #pausedCard .pc-b { cursor: pointer; font: inherit; font-weight: 900; letter-spacing: .12em; font-size: 14px; padding: 11px 20px;
        ${neon
          ? 'border-radius: 999px; border: 1px solid rgba(255,255,255,.25); color: #fff; background: rgba(255,255,255,.08);'
          : 'border-radius: 14px; border: 2.5px solid #23243a; color: #23243a; background: #f6eedc; box-shadow: 3px 3px 0 rgba(35,36,58,.28);'} }
      #pausedCard .pc-b[data-act="resume"] { ${neon ? 'background: linear-gradient(90deg, #4fd1ff, #a78bfa); border-color: transparent; box-shadow: 0 0 22px rgba(79,209,255,.45);' : 'background: #ff7a59; color: #fff;'} }
      #pausedCard .pc-b:active { transform: scale(.95); }
      #pausedCard .pc-k { margin-top: 6px; font-size: 11px; letter-spacing: .1em; opacity: .55; font-weight: 700; }
    `;
    document.head.appendChild(css);
    const host = document.getElementById('app') || document.body;
    const btn = document.createElement('button');
    btn.id = 'pauseBtn'; btn.type = 'button'; btn.title = 'Pause (P)'; btn.setAttribute('aria-label', 'Pause');
    btn.innerHTML = ICON_PAUSE;
    const card = document.createElement('div');
    card.id = 'pausedCard';
    card.innerHTML = `<div class="pc-in"><div class="pc-t">PAUSED</div>`
      + `<div class="pc-btns"><button type="button" class="pc-b" data-act="resume">▶ RESUME</button><button type="button" class="pc-b pc-r" data-act="retry">↻ RETRY</button></div>`
      + `<div class="pc-k">${coarse ? 'or tap anywhere to resume' : 'P / Esc to resume · R to retry'}</div></div>`;
    host.appendChild(btn);
    host.appendChild(card);
    card.querySelectorAll('.pc-b').forEach((b) => {
      b.addEventListener('pointerdown', (e) => e.stopPropagation());
      b.addEventListener('click', (e) => {
        e.stopPropagation(); b.blur();
        set(false);
        if (b.dataset.act === 'retry') cfg.restart();
      });
    });

    let paused = false;
    function set(p) {
      if (p && !cfg.isPlaying()) return;
      if (p === paused) return;
      paused = p;
      card.classList.toggle('on', p);
      btn.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
      btn.setAttribute('aria-label', p ? 'Resume' : 'Pause');
      btn.title = p ? 'Resume (P)' : 'Pause (P)';
      cfg.onChange(p);
    }
    btn.addEventListener('pointerdown', (e) => e.stopPropagation());
    btn.addEventListener('click', (e) => { e.stopPropagation(); btn.blur(); set(!paused); });
    // While paused, swallow taps (other buttons like sound still work) and use them to resume
    window.addEventListener('pointerdown', (e) => {
      if (!paused) return;
      const b = e.target.closest && e.target.closest('button');
      if (b) return;
      e.stopImmediatePropagation();
      set(false);
    }, true);
    window.addEventListener('pointermove', (e) => { if (paused) e.stopImmediatePropagation(); }, true);
    window.addEventListener('keydown', (e) => {
      const k = e.code;
      const toggleKey = k === 'KeyP' || k === 'Escape';
      if (paused) {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (!e.repeat && (toggleKey || k === 'Space' || k === 'Enter' || k === 'NumpadEnter')) set(false);
        else if (!e.repeat && k === 'KeyR') { set(false); cfg.restart(); }
        return;
      }
      if (toggleKey && !e.repeat && cfg.isPlaying()) { e.preventDefault(); e.stopImmediatePropagation(); set(true); }
    }, true);
    // Pause automatically when you leave the tab / app
    document.addEventListener('visibilitychange', () => { if (document.hidden) set(true); });
    window.addEventListener('blur', () => set(true));
    return {
      get paused() { return paused; },
      set,
      // call once per frame: shows the button only during a round
      sync() {
        const show = cfg.isPlaying() || paused;
        if (btn.classList.contains('show') !== show) btn.classList.toggle('show', show);
        if (paused && !cfg.isPlaying()) set(false);
      },
    };
  })();

  // ---------- Start ----------
  resize();
  reset();
  camera.position.set(0, 5.5, 8.5);
  // Pre-fill the scenery so the world isn't empty at the start
  for (let z = SPAWN_Z; z < KILL_Z; z += 4) sideScenery(z);
  for (let z = SPAWN_Z; z < 0; z += 26) skyCloud(z);
  let last = performance.now();
  function loop(now) {
    const raw = (now - last) / 1000;
    const dt = Math.min(raw, 0.05);
    last = now;
    Pause.sync();
    if (Pause.paused) { requestAnimationFrame(loop); return; } // frozen on the last frame
    if (raw < 0.5) adaptQuality(raw); // ignore long pauses (tab switched away)
    update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
