  <rect x="160" y="0" width="8" height="58" fill="#3f6212"/>
  <circle cx="164" cy="60" r="12" fill="#4d7c0f"/>
  <rect x="212" y="172" width="108" height="28" fill="#18181b"/>
  <rect x="222" y="104" width="34" height="70" fill="#334155"/>
  <rect x="270" y="80" width="40" height="94" fill="#2e1065"/>
  <g fill="#fde68a">
    <rect x="228" y="112" width="6" height="8"/><rect x="242" y="112" width="6" height="8"/><rect x="228" y="130" width="6" height="8"/><rect x="242" y="148" width="6" height="8"/>
    <rect x="276" y="90" width="6" height="8"/><rect x="292" y="104" width="6" height="8"/><rect x="276" y="122" width="6" height="8"/><rect x="292" y="140" width="6" height="8"/>
  </g>
  <rect x="234" y="0" width="3" height="40" fill="#334155"/>
  <circle cx="236" cy="48" r="11" fill="#1e293b"/>
  <!-- seeds -->
  <g fill="#facc15"><ellipse cx="190" cy="92" rx="4" ry="5.5"/><ellipse cx="206" cy="88" rx="4" ry="5.5"/><ellipse cx="222" cy="86" rx="4" ry="5.5"/></g>
  <!-- power-up bubble -->
  <circle cx="262" cy="56" r="13" fill="#fff" fill-opacity="0.25" stroke="#5eead4" stroke-width="2.5"/>
  <text x="262" y="61" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">🛡️</text>
