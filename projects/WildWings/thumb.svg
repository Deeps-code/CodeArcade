<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4e8"/><stop offset="0.25" stop-color="#1e9bd7"/><stop offset="1" stop-color="#0a78b4"/></linearGradient>
    <radialGradient id="body" cx="0.45" cy="0.3" r="0.8"><stop offset="0" stop-color="#5fd0ff"/><stop offset="1" stop-color="#0284c7"/></radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <circle cx="232" cy="52" r="15" fill="#fff7d6"/>
  <!-- low-poly clouds -->
  <g fill="#fff"><path d="M52 40l10-10 14 3 6 10-8 8-16 1z"/><path d="M70 34l12-8 12 6-2 10-14 3z" fill="#e2e8f0"/></g>
  <g fill="#fff"><path d="M250 28l9-7 12 2 4 8-7 6-13 0z"/></g>
  <rect y="100" width="320" height="100" fill="url(#sea)"/>
  <!-- whitecaps in perspective -->
  <g fill="#e0f2fe" opacity="0.9">
    <rect x="148" y="108" width="6" height="1"/><rect x="176" y="112" width="8" height="1.2"/><rect x="120" y="118" width="10" height="1.5"/>
    <rect x="196" y="126" width="14" height="2"/><rect x="88" y="138" width="18" height="2"/><rect x="226" y="150" width="22" height="2.5"/>
    <rect x="44" y="170" width="28" height="3"/><rect x="250" y="186" width="34" height="3"/>
  </g>
  <!-- palm islands on the sides -->
  <g><ellipse cx="38" cy="122" rx="22" ry="5" fill="#fde68a"/><path d="M40 121 Q43 108 38 96" stroke="#7c4a1e" stroke-width="2.5" fill="none"/><path d="M38 96 l-14 4 M38 96 l14 3 M38 96 l-8 -8 M38 96 l9 -7" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/></g>
  <g><ellipse cx="292" cy="116" rx="16" ry="4" fill="#fde68a"/><path d="M290 115 Q288 105 293 96" stroke="#7c4a1e" stroke-width="2" fill="none"/><path d="M293 96 l-11 3 M293 96 l11 3 M293 96 l-6 -6 M293 96 l7 -5" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/></g>
  <!-- sea stacks at different depths -->
  <path d="M176 104 L178 78 L186 74 L192 79 L193 104Z" fill="#8b8580"/><path d="M178 78 L186 72 L192 79Z" fill="#4d7c0f"/>
  <path d="M100 112 L103 64 L114 58 L124 66 L126 112Z" fill="#8b8580"/><path d="M103 64 L114 56 L124 66 L114 66Z" fill="#57534e"/><path d="M106 62 L114 55 L121 61Z" fill="#4d7c0f"/>
  <ellipse cx="113" cy="112" rx="18" ry="3" fill="#f8fafc" opacity="0.85"/>
  <!-- storm cloud -->
  <g fill="#52606f"><path d="M206 66l8-9 12 1 6 8-5 8-16 1z"/><path d="M222 60l9-6 10 4-1 9-12 2z" fill="#64748b"/></g>
  <!-- seeds trail -->
  <g fill="#facc15"><circle cx="158" cy="96" r="2"/><circle cx="160" cy="102" r="2.5"/><circle cx="162" cy="109" r="3"/></g>
  <!-- shadow -->
  <ellipse cx="160" cy="184" rx="18" ry="5" fill="#000" opacity="0.18"/>
  <!-- bird seen from behind -->
  <g transform="translate(160 146)">
    <path d="M-6 6 L-56 -6 L-60 0 L-8 14Z" fill="#0284c7"/><path d="M-44 -3 L-62 -6 L-62 2 L-48 3Z" fill="#075985"/>
    <path d="M6 6 L56 -10 L60 -4 L8 14Z" fill="#0284c7"/><path d="M44 -6 L62 -10 L62 -2 L48 0Z" fill="#075985"/>
    <path d="M-9 20 L0 34 L9 20Z" fill="#075985"/>
    <ellipse cx="0" cy="10" rx="17" ry="19" fill="url(#body)"/>
    <ellipse cx="0" cy="-8" rx="11" ry="10" fill="#38bdf8"/>
    <path d="M0 -26 L-3 -16 L3 -16Z" fill="#0284c7"/>
    <rect x="-6" y="8" width="12" height="2" rx="1" fill="#075985" opacity="0.6"/>
  </g>
</svg>
