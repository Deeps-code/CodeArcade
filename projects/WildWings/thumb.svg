  <path d="M0 178 q8 -3 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" stroke="#fff" stroke-opacity="0.5" fill="none" stroke-width="1.5"/>
  <path d="M44 172 L52 100 Q64 88 76 100 L84 172Z" fill="#a8a29e"/>
  <rect x="106" y="172" width="110" height="28" fill="#365314"/>
