<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07030f"/><stop offset="0.6" stop-color="#1a0b33"/><stop offset="1" stop-color="#2b0f3d"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b1c18"/><stop offset="1" stop-color="#1d0d0c"/></linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffb15c"/><stop offset="0.6" stop-color="#f0711a"/><stop offset="1" stop-color="#a4400a"/></radialGradient>
    <radialGradient id="fire"><stop offset="0" stop-color="#ffa028" stop-opacity="0.7"/><stop offset="1" stop-color="#ff3c14" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#fff0d2" stop-opacity="0.35"/><stop offset="1" stop-color="#fff0d2" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="60" cy="10" r="50" fill="url(#lamp)"/><circle cx="160" cy="10" r="50" fill="url(#lamp)"/><circle cx="260" cy="10" r="50" fill="url(#lamp)"/>
  <!-- crowd -->
  <g fill="#3c1e64" opacity="0.9">
    <circle cx="14" cy="110" r="6"/><rect x="7" y="115" width="14" height="25"/><circle cx="34" cy="106" r="6"/><rect x="27" y="111" width="14" height="29"/>
    <circle cx="54" cy="112" r="6"/><rect x="47" y="117" width="14" height="23"/><circle cx="74" cy="104" r="6"/><rect x="67" y="109" width="14" height="31"/>
    <circle cx="94" cy="110" r="6"/><rect x="87" y="115" width="14" height="25"/><circle cx="114" cy="107" r="6"/><rect x="107" y="112" width="14" height="28"/>
    <circle cx="134" cy="111" r="6"/><rect x="127" y="116" width="14" height="24"/><circle cx="154" cy="105" r="6"/><rect x="147" y="110" width="14" height="30"/>
    <circle cx="174" cy="109" r="6"/><rect x="167" y="114" width="14" height="26"/><circle cx="194" cy="112" r="6"/><rect x="187" y="117" width="14" height="23"/>
  </g>
  <rect y="138" width="320" height="34" fill="#1e0c34"/>
  <rect y="137" width="320" height="2.5" fill="#ff4fa3" filter="url(#glow)"/>
  <rect y="172" width="320" height="28" fill="url(#floor)"/>
  <rect y="171" width="320" height="2" fill="#4fd1ff" filter="url(#glow)"/>
  <!-- hoop -->
  <rect x="268" y="80" width="5" height="92" fill="#2a2140"/>
  <rect x="262" y="22" width="14" height="62" fill="#b4dcff" fill-opacity="0.12" stroke="#4fd1ff" stroke-width="2.5" filter="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.3" fill="none">
    <path d="M216 72 L224 104 M224 72 L229 104 M232 72 L234 104 M240 72 L239 104 M248 72 L244 104 M256 72 L249 104"/>
    <path d="M218 82 L254 82 M221 93 L251 93"/>
  </g>
  <ellipse cx="236" cy="72" rx="21" ry="4.5" fill="none" stroke="#ff7a1a" stroke-width="3.5" filter="url(#glow)"/>
  <!-- arc of the shot -->
  <g fill="#ffffff">
    <circle cx="108" cy="104" r="3" opacity="0.8"/><circle cx="126" cy="80" r="2.7" opacity="0.7"/><circle cx="146" cy="62" r="2.4" opacity="0.6"/>
    <circle cx="168" cy="50" r="2.1" opacity="0.5"/><circle cx="190" cy="46" r="1.8" opacity="0.4"/><circle cx="212" cy="52" r="1.5" opacity="0.3"/>
  </g>
  <!-- flaming ball -->
  <g opacity="0.85"><circle cx="70" cy="140" r="9" fill="#e63946"/><circle cx="78" cy="131" r="11" fill="#ff7a1a"/><circle cx="85" cy="124" r="10" fill="#ffd23f"/></g>
  <circle cx="92" cy="122" r="34" fill="url(#fire)"/>
  <circle cx="92" cy="122" r="17" fill="url(#ball)"/>
  <g fill="none" stroke="#3a1404" stroke-width="1.6">
    <path d="M75 122 H109 M92 105 V139"/>
    <path d="M80 109 Q86 122 80 135 M104 109 Q98 122 104 135"/>
