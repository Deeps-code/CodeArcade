<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Dodge the Dots</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05030f; color: #eef;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 18px 0;
    pointer-events: none;
  }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #8f8fc0; }
  .value { font-size: 28px; font-weight: 800; text-shadow: 0 0 12px rgba(79, 209, 255, 0.6); font-variant-numeric: tabular-nums; }
  .right { text-align: right; }
  /* Power-up status pills (shield / blades) */
  #pills {
    position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 54px); left: 18px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    pointer-events: none;
  }
  .pill {
    display: none;
    font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
    padding: 4px 10px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .pill.on { display: inline-block; }
  #shield { color: #5dffb0; border: 1px solid rgba(93, 255, 176, 0.5); background: rgba(93, 255, 176, 0.08); }
  #blades { color: #ff6b6b; border: 1px solid rgba(255, 107, 107, 0.55); background: rgba(255, 107, 107, 0.1); position: relative; overflow: hidden; }
  #bladesBar { position: absolute; left: 0; bottom: 0; height: 2px; background: #ff6b6b; }
  #blaster { color: #7fa6ff; border: 1px solid rgba(91, 140, 255, 0.6); background: rgba(91, 140, 255, 0.12); position: relative; overflow: hidden; }
  #blasterBar { position: absolute; left: 0; bottom: 0; height: 2px; background: #5b8cff; }
  #tesla { color: #c6ff3d; border: 1px solid rgba(198, 255, 61, 0.55); background: rgba(198, 255, 61, 0.1); position: relative; overflow: hidden; }
  #teslaBar { position: absolute; left: 0; bottom: 0; height: 2px; background: #c6ff3d; }
  #nova { color: #ffae00; border: 1px solid rgba(255, 174, 0, 0.6); background: rgba(255, 174, 0, 0.12); }
  #sound {
    position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 58px); right: 14px;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(10, 8, 30, 0.5);
    color: #fff; font-size: 17px; z-index: 5;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }

  #banner {
    position: fixed; left: 0; right: 0; top: 36%;
    text-align: center; font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 0.12em;
    color: #fff; text-shadow: 0 0 20px #ff4fa3, 0 0 42px #a78bfa;
    opacity: 0; pointer-events: none;
  }
  #banner.show { animation: banner 1.5s ease-out; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(0.6); }
    15% { opacity: 1; transform: scale(1.06); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.12); }
  }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(5, 3, 15, 0.3), rgba(5, 3, 15, 0.78));
    transition: opacity 0.35s;
  }
  .overlay.hidden { opacity: 0; }
  h1 { margin: 0; font-size: clamp(44px, 13vw, 90px); line-height: 0.9; font-weight: 900; letter-spacing: -0.02em; }
  h1 .a { color: #fff; text-shadow: 0 0 18px rgba(79, 209, 255, 0.75); }
  h1 .b {
    background: linear-gradient(90deg, #ff4fa3, #a78bfa, #4fd1ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(255, 79, 163, 0.5));
  }
  .sub { margin: 18px 0 0; color: #a9a9d6; font-size: 15px; max-width: 340px; line-height: 1.5; }
  .kicker { letter-spacing: 0.24em; font-weight: 800; font-size: 14px; color: #ff4fa3; text-shadow: 0 0 12px rgba(255, 79, 163, 0.6); }
  .big { font-size: clamp(56px, 16vw, 96px); font-weight: 900; margin: 6px 0 0; text-shadow: 0 0 22px rgba(79, 209, 255, 0.65); font-variant-numeric: tabular-nums; }
  .newbest { margin-top: 6px; color: #ffd23f; font-weight: 800; letter-spacing: 0.16em; font-size: 13px; text-shadow: 0 0 10px rgba(255, 210, 63, 0.6); }
  .cta {
    margin-top: 28px; padding: 13px 28px; border-radius: 999px;
    font-weight: 800; letter-spacing: 0.14em; font-size: 14px; color: #fff;
    background: linear-gradient(90deg, #ff4fa3, #a78bfa);
    box-shadow: 0 0 30px rgba(255, 79, 163, 0.45);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 46px rgba(255, 79, 163, 0.7); } }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 28px; font-size: 13px; color: #a9a9d6; }
  .legend b { font-weight: 800; }
  .gone { display: none; }
  .overlay.hidden { visibility: hidden; transition: opacity 0.35s, visibility 0s linear 0.35s; }
  .overlay.hidden * { pointer-events: none !important; }
  /* Skin picker */
  .skinSel { pointer-events: auto; margin-top: 22px; display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 20px; background: rgba(10, 8, 30, 0.6); border: 1px solid rgba(255, 255, 255, 0.16); }
  .skArrow { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.08);
    color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 0 0 3px; font-family: inherit; }
  .skArrow:active { transform: scale(0.92); }
  .skMid { display: flex; align-items: center; gap: 10px; min-width: 150px; }
  #skCv { width: 52px; height: 52px; }
  .skText { text-align: left; }
  .skLab { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; color: #8f8fc0; }
  .skName { font-size: 16px; font-weight: 900; color: #fff; }
  .skNum { font-size: 11px; color: #8f8fc0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div><div class="label">SCORE</div><div class="value" id="score">0</div></div>
  <div class="right"><div class="label">BEST</div><div class="value" id="best">0</div></div>
</div>
<div id="pills">
  <div class="pill" id="shield">◯ SHIELD ON</div>
  <div class="pill" id="nova">✺ NOVA SHIELD</div>
  <div class="pill" id="blades">✦ BLADES <span id="bladesTime">8.0</span>s<span id="bladesBar"></span></div>
  <div class="pill" id="blaster">➤ BLASTER <span id="blasterTime">8.0</span>s<span id="blasterBar"></span></div>
  <div class="pill" id="tesla">⚡ TESLA <span id="teslaTime">8.0</span>s<span id="teslaBar"></span></div>
</div>
<button id="sound" type="button" aria-label="Toggle sound">🔊</button>
<div id="banner"></div>

<div class="overlay" id="menu">
  <h1><span class="a">DODGE</span><br /><span class="b">THE DOTS</span></h1>
  <p class="sub" id="howto"></p>
  <div class="cta" id="startCta">TAP TO START</div>
  <div class="skinSel">
    <button class="skArrow" id="skPrev" type="button" aria-label="Previous skin">‹</button>
    <div class="skMid"><canvas id="skCv"></canvas><div class="skText"><div class="skLab">YOUR DOT</div><div class="skName" id="skName"></div><div class="skNum" id="skNum"></div></div></div>
    <button class="skArrow" id="skNext" type="button" aria-label="Next skin">›</button>
  </div>
  <div class="legend">
    <span><b style="color:#ffd23f">★</b> +25</span>
    <span><b style="color:#5dffb0">◯</b> Shield</span>
    <span><b style="color:#ffae00">✺</b> Nova</span>
    <span><b style="color:#ff6b6b">✦</b> Blades</span>
    <span><b style="color:#5b8cff">➤</b> Blaster</span>
    <span><b style="color:#c6ff3d">⚡</b> Tesla</span>
    <span><b style="color:#4fd1ff">Close call</b> +5</span>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="kicker">GAME OVER</div>
  <div class="big" id="finalScore">0</div>
  <div class="newbest gone" id="newBest">★ NEW BEST ★</div>
  <p class="sub" id="overStats"></p>
  <div class="cta" id="retryCta">TAP TO RETRY</div>
</div>

<script>
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Setup ----------
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const FINGER_OFFSET = isTouch ? 70 : 0; // keep the orb above your fingertip
  const verb = isTouch ? 'TAP' : 'CLICK';
  document.getElementById('startCta').textContent = verb + ' TO START';
  document.getElementById('retryCta').textContent = verb + ' TO RETRY';
  document.getElementById('howto').textContent = isTouch
    ? 'Drag your finger to steer your orb (it floats just above your finger). Dodge the dots, grab stars, survive!'
    : 'Steer your orb with the mouse, arrow keys or WASD. Dodge the dots, grab stars, survive!';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const el = {
    score: document.getElementById('score'),
    best: document.getElementById('best'),
    shield: document.getElementById('shield'),
    banner: document.getElementById('banner'),
    menu: document.getElementById('menu'),
    over: document.getElementById('over'),
    finalScore: document.getElementById('finalScore'),
    newBest: document.getElementById('newBest'),
    overStats: document.getElementById('overStats'),
    blades: document.getElementById('blades'),
    bladesTime: document.getElementById('bladesTime'),
    bladesBar: document.getElementById('bladesBar'),
    blaster: document.getElementById('blaster'),
    blasterTime: document.getElementById('blasterTime'),
    blasterBar: document.getElementById('blasterBar'),
    tesla: document.getElementById('tesla'),
    teslaTime: document.getElementById('teslaTime'),
    teslaBar: document.getElementById('teslaBar'),
    nova: document.getElementById('nova'),
  };

  let W = 0, H = 0, dpr = 1;
  let nebula = null;
  let stars = [];

  const PLAYER_R = 11;
  const KINDS = {
    orb:   { color: '#ff4fa3', r: [8, 16],  speed: [160, 240] },
    zip:   { color: '#ff9f43', r: [5, 8],   speed: [380, 520] },
    wave:  { color: '#ff5e5e', r: [9, 13],  speed: [150, 200] },
    giant: { color: '#a78bfa', r: [24, 34], speed: [90, 130] },
  };

  // ---------- Sound (tiny synth, no files needed) ----------
  let actx = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('dodgeMuted') === '1'; } catch (e) {}

  function initAudio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain();
        master.gain.value = 0.6;
        master.connect(actx.destination);
        // One second of white noise, reused for explosions.
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }

  function tone(freq, endFreq, dur, type = 'sine', vol = 0.12, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  function noise(dur, vol, fromFreq, toFreq, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(fromFreq, t0);
    filter.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(g).connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }

  let lastCloseSfx = 0;
  const sfx = {
    start: () => [330, 440, 660].forEach((f, i) => tone(f, f * 1.01, 0.12, 'square', 0.05, i * 0.07)),
    star: () => { tone(988, 988, 0.08, 'square', 0.05); tone(1319, 1319, 0.16, 'square', 0.05, 0.07); },
    shieldUp: () => tone(300, 900, 0.35, 'triangle', 0.1),
    shieldBreak: () => { noise(0.3, 0.25, 4000, 300); tone(700, 120, 0.3, 'sawtooth', 0.06); },
    close: () => {
      const now = performance.now();
      if (now - lastCloseSfx < 120) return; // avoid a buzz when many pass at once
      lastCloseSfx = now;
      tone(1500, 2200, 0.07, 'sine', 0.05);
    },
    levelUp: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.08, i * 0.09)),
    explode: () => { noise(0.9, 0.55, 2500, 60); tone(160, 35, 0.8, 'sine', 0.35); },
    gameOver: () => [392, 330, 262].forEach((f, i) => tone(f, f * 0.98, 0.22, 'triangle', 0.08, 0.5 + i * 0.18)),
    bladeUp: () => { noise(0.3, 0.15, 7000, 1500); tone(500, 1600, 0.3, 'sawtooth', 0.05); },
    bladeHit: () => {
      const now = performance.now();
      if (now - lastHitSfx < 40) return;
      lastHitSfx = now;
      tone(rand(1300, 1600), 900, 0.05, 'square', 0.035);
    },
    shatter: (size) => {
      noise(0.2 + size * 0.04, 0.22 + size * 0.03, 9000, 700);
      tone(1900, 500, 0.18 + size * 0.03, 'triangle', 0.05);
    },
    bladeEnd: () => tone(900, 180, 0.45, 'sawtooth', 0.045),
    blasterUp: () => { tone(400, 1300, 0.22, 'square', 0.05); tone(800, 1600, 0.15, 'square', 0.04, 0.12); },
    pew: () => {
      const now = performance.now();
      if (now - lastPewSfx < 70) return;
      lastPewSfx = now;
      tone(rand(1700, 2000), 500, 0.07, 'square', 0.018);
    },
    teslaUp: () => { noise(0.4, 0.15, 9000, 2000); tone(150, 900, 0.4, 'sawtooth', 0.05); },
    zap: () => { noise(0.09, 0.14, 9000, 2500); tone(110, 80, 0.12, 'sawtooth', 0.05); },
    novaUp: () => { tone(200, 700, 0.45, 'triangle', 0.1); tone(300, 1000, 0.45, 'sine', 0.06, 0.05); },
    nova: () => { noise(1.1, 0.6, 3500, 50); tone(95, 28, 1, 'sine', 0.45); tone(600, 80, 0.5, 'sawtooth', 0.06); },
    powerEnd: () => tone(700, 160, 0.4, 'triangle', 0.05),
  };
  let lastHitSfx = 0, lastPewSfx = 0;

  let best = 0;
  try { best = Number(localStorage.getItem('dodgeBest')) || 0; } catch (e) {}
  el.best.textContent = best;

  // ---------- Game state ----------
  let state = 'menu'; // menu | play | dying | over
  const player = { x: 0, y: 0, tx: 0, ty: 0, trail: [], inv: 0 };
  let hazards = [], pickups = [], particles = [], texts = [];
  let time = 0, bonus = 0, level = 1, shield = false;
  let spawnT = 0, starT = 0, shieldT = 0, ambientT = 0;
  let shake = 0, deathT = 0, overReadyAt = 0;
  let starsCollected = 0, closeCalls = 0, kills = 0;

  // Spinning blades power-up
  const BLADE_TIME = 8;      // seconds the blades last
  const BLADE_COUNT = 3;
  const BLADE_ORBIT = 42;    // distance from the orb
  const BLADE_HIT_R = 11;    // blade hit size
  const BLADE_SPIN = 9;      // radians per second
  let blades = 0;            // seconds left (0 = no blades)
  let bladeAngle = 0;
  let bladeT = 0;            // time until the next weapon pickup appears

  // Blaster: auto-fires bolts at the nearest dot
  const BLASTER_TIME = 8;
  const FIRE_EVERY = 0.14;   // seconds between shots
  const BOLT_SPEED = 900;
  const BLASTER_RANGE = 480;
  let blaster = 0, fireT = 0;
  let bolts = [];

  // Tesla coil: lightning that chains between nearby dots
  const TESLA_TIME = 8;
  const ZAP_EVERY = 0.45;
  const ZAP_RANGE = 190;     // reach from the orb to the first dot
  const CHAIN_RANGE = 150;   // reach from one dot to the next
  const CHAIN_MAX = 4;
  let tesla = 0, zapT = 0;
  let zaps = [];

  // Nova shield: absorbs one hit and explodes, damaging every dot nearby
  const NOVA_R = 170;
  let nova = false, novaT = 0;
  let rings = [];            // expanding shockwave effects
  let lastShownScore = -1;
  const keys = {};

  // ---------- Player skins ----------
  // Looks only: the hitbox is the same for every skin.
  const SKINS = [
    { name: 'Comet', color: '#4fd1ff', shape: 'orb', trail: 'dots' },
    { name: 'Ember', color: '#ff7a1a', shape: 'orb', trail: 'fire' },
    { name: 'Mint Gem', color: '#5dffb0', shape: 'diamond', trail: 'dots' },
    { name: 'Heartbeat', color: '#ff4fa3', shape: 'heart', trail: 'hearts' },
    { name: 'Lucky Star', color: '#ffd23f', shape: 'star', trail: 'sparkle' },
    { name: 'Void', color: '#a78bfa', shape: 'ring', trail: 'ghost' },
    { name: 'Prism', color: 'rainbow', shape: 'orb', trail: 'rainbow' },
    { name: 'Frost', color: '#bae6fd', shape: 'flake', trail: 'sparkle' },
    { name: 'Solar', color: '#ffae00', shape: 'sun', trail: 'fire' },
    { name: 'Pixel', color: '#c6ff3d', shape: 'square', trail: 'squares' },
  ];
  let skinIndex = 0;
  try { const v = Number(localStorage.getItem('dodgeSkin')); if (v >= 0 && v < SKINS.length) skinIndex = v; } catch (e) {}
  const skin = () => SKINS[skinIndex];
  // hue -> hex (glow sprites need a hex color)
  function hueHex(h) {
    const f = (n) => { const k = (n + h / 30) % 12, a = 0.95 * Math.min(0.62, 1 - 0.62); const c = 0.62 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
    return '#' + f(0) + f(8) + f(4);
  }
  // the skin's color right now (Prism cycles through the rainbow)
  function skinColor(sk = skin(), t = performance.now() / 1000, offset = 0) {
    return sk.color === 'rainbow' ? hueHex(Math.round(((t * 90 + offset) % 360) / 15) * 15) : sk.color;
  }
  // Draw the dot's core shape at (x, y), radius r
  function drawDotCore(g, sk, x, y, r, t) {
    const c = skinColor(sk, t);
    g.save();
    g.translate(x, y);
    g.fillStyle = '#ffffff'; g.strokeStyle = c; g.lineWidth = Math.max(1.5, r * 0.22);
    g.shadowColor = c; g.shadowBlur = r * 1.2;
    const sh = sk.shape;
    if (sh === 'orb') {
      g.beginPath(); g.arc(0, 0, r * 0.62, 0, TAU); g.fill();
    } else if (sh === 'diamond') {
      g.rotate(Math.sin(t * 2) * 0.25);
      g.beginPath(); g.moveTo(0, -r); g.lineTo(r * 0.72, 0); g.lineTo(0, r); g.lineTo(-r * 0.72, 0); g.closePath(); g.fill(); g.stroke();
    } else if (sh === 'heart') {
      const k = r * 0.95 * (1 + Math.max(0, Math.sin(t * 7)) ** 8 * 0.18);
      g.beginPath(); g.moveTo(0, k * 0.75);
      g.bezierCurveTo(-k * 1.1, 0, -k * 0.6, -k * 0.85, 0, -k * 0.3);
      g.bezierCurveTo(k * 0.6, -k * 0.85, k * 1.1, 0, 0, k * 0.75); g.fill(); g.stroke();
    } else if (sh === 'star') {
      g.rotate(t * 1.5);
      g.beginPath();
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r * 1.05; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      g.closePath(); g.fill(); g.stroke();
    } else if (sh === 'ring') {
      g.fillStyle = '#05030f';
      g.beginPath(); g.arc(0, 0, r * 0.8, 0, TAU); g.fill(); g.lineWidth = r * 0.34; g.stroke();
      g.shadowBlur = 0; g.fillStyle = c; g.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
      g.beginPath(); g.arc(0, 0, r * 0.22, 0, TAU); g.fill();
    } else if (sh === 'flake') {
      g.rotate(t * 0.6); g.lineWidth = Math.max(1.5, r * 0.18); g.strokeStyle = '#ffffff'; g.lineCap = 'round';
      g.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU, ex = Math.cos(a) * r, ey = Math.sin(a) * r;
        g.moveTo(0, 0); g.lineTo(ex, ey);
        const bx = Math.cos(a) * r * 0.6, by = Math.sin(a) * r * 0.6;
        g.moveTo(bx, by); g.lineTo(bx + Math.cos(a + 0.7) * r * 0.3, by + Math.sin(a + 0.7) * r * 0.3);
        g.moveTo(bx, by); g.lineTo(bx + Math.cos(a - 0.7) * r * 0.3, by + Math.sin(a - 0.7) * r * 0.3);
      }
      g.stroke();
    } else if (sh === 'sun') {
      g.rotate(t * 1.2); g.fillStyle = c;
      for (let i = 0; i < 8; i++) { g.rotate(TAU / 8); g.beginPath(); g.moveTo(-r * 0.2, -r * 0.7); g.lineTo(0, -r * 1.25); g.lineTo(r * 0.2, -r * 0.7); g.fill(); }
      g.fillStyle = '#fff7d6'; g.beginPath(); g.arc(0, 0, r * 0.62, 0, TAU); g.fill();
    } else if (sh === 'square') {
      g.rotate(Math.round(t * 2) * (Math.PI / 4) * 0);   // pixels don't spin
      g.fillRect(-r * 0.6, -r * 0.6, r * 1.2, r * 1.2); g.strokeRect(-r * 0.6, -r * 0.6, r * 1.2, r * 1.2);
    }
    g.restore();
  }
  // The trail behind the dot
  function drawDotTrail(g, sk, trail, r, t) {
    const n = trail.length;
    for (let i = 0; i < n; i++) {
      const p = trail[i], k = i / n;
      const c = sk.trail === 'rainbow' ? skinColor(sk, t, -i * 18) : skinColor(sk, t);
      g.globalAlpha = k * (sk.trail === 'ghost' ? 0.22 : 0.4);
      g.fillStyle = c;
      if (sk.trail === 'squares' || sk.trail === 'hearts' && i % 3) {
        const sz = r * k * 1.1; g.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
      } else if (sk.trail === 'hearts') {
        const k2 = r * k * 0.8; g.beginPath(); g.moveTo(p.x, p.y + k2 * 0.75); g.bezierCurveTo(p.x - k2 * 1.1, p.y, p.x - k2 * 0.6, p.y - k2 * 0.85, p.x, p.y - k2 * 0.3); g.bezierCurveTo(p.x + k2 * 0.6, p.y - k2 * 0.85, p.x + k2 * 1.1, p.y, p.x, p.y + k2 * 0.75); g.fill();
      } else if (sk.trail === 'fire') {
        const rise = (1 - k) * r * 1.2;
        g.fillStyle = k > 0.6 ? '#ffd23f' : k > 0.3 ? c : '#e63946';
        g.beginPath(); g.arc(p.x + Math.sin(t * 9 + i) * (1 - k) * 4, p.y - rise, r * k * 0.9, 0, TAU); g.fill();
      } else if (sk.trail === 'sparkle') {
        if (i % 2) continue;
        const sz = r * k * 0.9, tw = Math.sin(t * 10 + i) * 0.5 + 0.5;
        g.fillStyle = tw > 0.5 ? '#ffffff' : c;
        g.beginPath(); g.moveTo(p.x, p.y - sz); g.lineTo(p.x + sz * 0.3, p.y); g.lineTo(p.x, p.y + sz); g.lineTo(p.x - sz * 0.3, p.y); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(p.x - sz, p.y); g.lineTo(p.x, p.y + sz * 0.3); g.lineTo(p.x + sz, p.y); g.lineTo(p.x, p.y - sz * 0.3); g.closePath(); g.fill();
      } else if (sk.trail === 'ghost') {
        g.beginPath(); g.arc(p.x, p.y, r * (0.6 + k * 0.6), 0, TAU); g.fill();
      } else {
        g.beginPath(); g.arc(p.x, p.y, r * k, 0, TAU); g.fill();
      }
    }
    g.globalAlpha = 1;
  }

  // ---------- Glow sprites (pre-rendered for speed) ----------
  const sprites = new Map();
  function glowSprite(color, r) {
    const key = color + '|' + Math.round(r);
    if (sprites.has(key)) return sprites.get(key);
    const size = Math.ceil(Math.round(r) * 4);
    const c = document.createElement('canvas');
    c.width = c.height = Math.ceil(size * dpr);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    const m = size / 2;
    const grad = g.createRadialGradient(m, m, 0, m, m, m);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.2, color);
    grad.addColorStop(0.45, color);
    grad.addColorStop(0.5, color + '99');
    grad.addColorStop(1, color + '00');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    const sprite = { c, size };
    sprites.set(key, sprite);
    return sprite;
  }
  function drawSprite(sp, x, y, scale = 1) {
    const s = sp.size * scale;
    ctx.drawImage(sp.c, x - s / 2, y - s / 2, s, s);
  }

  // ---------- Background ----------
  function buildNebula() {
    const c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    g.fillStyle = '#05030f';
    g.fillRect(0, 0, W, H);
    const blobs = [
      [0.15, 0.2, 0.6, '140,60,255', 0.28],
      [0.85, 0.75, 0.65, '30,120,255', 0.25],
      [0.55, 0.45, 0.45, '255,60,160', 0.14],
      [0.2, 0.9, 0.4, '60,220,220', 0.12],
    ];
    for (const [bx, by, br, col, a] of blobs) {
      const r = Math.max(W, H) * br;
      const grad = g.createRadialGradient(W * bx, H * by, 0, W * bx, H * by, r);
      grad.addColorStop(0, `rgba(${col},${a})`);
      grad.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = grad;
      g.fillRect(0, 0, W, H);
    }
    const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.6)');
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);
    nebula = c;
  }

  function makeStars() {
    stars = [];
    const n = Math.round((W * H) / 5000);
    for (let i = 0; i < n; i++) {
      const layer = i % 3;
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        z: [0.3, 0.6, 1][layer], s: [0.8, 1.2, 1.8][layer], tw: Math.random() * TAU,
      });
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    sprites.clear();
    buildNebula();
    makeStars();
    player.tx = clamp(player.tx || W / 2, PLAYER_R, W - PLAYER_R);
    player.ty = clamp(player.ty || H * 0.75, PLAYER_R, H - PLAYER_R);
    player.x = clamp(player.x || player.tx, PLAYER_R, W - PLAYER_R);
    player.y = clamp(player.y || player.ty, PLAYER_R, H - PLAYER_R);
  }
  window.addEventListener('resize', resize);

  // ---------- Spawning ----------
  function spawnHazard(forceKind) {
    const weights = [
      ['orb', 5],
      ['zip', level >= 2 ? 2 : 0],
      ['wave', level >= 2 ? 2 : 0],
      ['giant', level >= 3 ? 1.2 : 0],
    ];
    let kind = forceKind;
    if (!kind) {
      const total = weights.reduce((a, w) => a + w[1], 0);
      let roll = Math.random() * total;
      for (const [k, w] of weights) { roll -= w; if (roll <= 0) { kind = k; break; } }
      kind = kind || 'orb';
    }
    const k = KINDS[kind];
    const r = rand(k.r[0], k.r[1]);
    const speedUp = 1 + (level - 1) * 0.12;
    const x = rand(r, W - r);
    // Health: tougher dot types take more blade hits, and everything toughens every 3 levels.
    const baseHp = { orb: r > 12 ? 2 : 1, zip: 1, wave: 3, giant: 6 }[kind];
    const hp = baseHp + (kind === 'zip' ? 0 : Math.floor((level - 1) / 3));
    hazards.push({
      kind, color: k.color, r,
      hp, maxHp: hp, flash: 0, hitCd: 0,
      x, baseX: x, y: -r * 2,
      vy: rand(k.speed[0], k.speed[1]) * speedUp,
      amp: kind === 'wave' ? rand(40, 110) : 0,
      freq: rand(2, 3.5), phase: rand(0, TAU), pulse: rand(0, TAU),
      close: false, passed: false, dead: false,
    });
  }

  function spawnPickup(type) {
    pickups.push({ type, x: rand(30, W - 30), y: -20, vy: type === 'star' ? 150 : 120, rot: 0 });
  }

  function burst(x, y, color, n, speed = 260) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(speed * 0.3, speed);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: rand(0.8, 1.6), size: rand(1.5, 4), color });
    }
  }

  function floatText(x, y, text, color) {
    texts.push({ x, y, text, color, life: 1 });
  }

  function showBanner(text) {
    el.banner.textContent = text;
    el.banner.classList.remove('show');
    void el.banner.offsetWidth; // restart the CSS animation
    el.banner.classList.add('show');
  }

  // ---------- Game flow ----------
  function start() {
    state = 'play';
    time = 0; bonus = 0; level = 1; shield = false;
    hazards = []; pickups = []; texts = [];
    spawnT = 0.6; starT = 3; shieldT = rand(10, 16);
    starsCollected = 0; closeCalls = 0; kills = 0;
    blades = 0; bladeT = rand(7, 11);
    blaster = 0; tesla = 0; nova = false; novaT = rand(14, 20);
    bolts = []; zaps = []; rings = [];
    for (const k of ['blades', 'blaster', 'tesla', 'nova']) el[k].classList.remove('on');
    player.x = player.tx; player.y = player.ty;
    player.trail = []; player.inv = 0;
    el.menu.classList.add('hidden');
    el.over.classList.add('hidden');
    el.shield.classList.remove('on');
    sfx.start();
  }

  function currentScore() { return Math.floor(time * 10) + bonus; }

  function die(h) {
    state = 'dying';
    deathT = 0;
    shake = 16;
    burst(player.x, player.y, skinColor(), 46, 380);
    burst(player.x, player.y, '#ffffff', 16, 200);
    burst(h.x, h.y, h.color, 20, 260);
    sfx.explode();
    sfx.gameOver();
    const score = currentScore();
    const isBest = score > best;
    if (isBest) {
      best = score;
      try { localStorage.setItem('dodgeBest', best); } catch (e) {}
      el.best.textContent = best;
    }
    el.finalScore.textContent = score;
    el.newBest.classList.toggle('gone', !isBest);
    el.overStats.textContent =
      `Survived ${time.toFixed(1)}s  ·  ${starsCollected} ★  ·  ${kills} shattered  ·  ${closeCalls} close call${closeCalls === 1 ? '' : 's'}`;
    el.shield.classList.remove('on');
    for (const k of ['blades', 'blaster', 'tesla', 'nova']) el[k].classList.remove('on');
    blades = 0; blaster = 0; tesla = 0; nova = false;
  }

  // ---------- Update ----------
  function moveHazards(dt) {
    for (const h of hazards) {
      h.y += h.vy * dt;
      h.pulse += dt * 4;
      h.flash = Math.max(0, h.flash - dt);
      h.hitCd = Math.max(0, h.hitCd - dt);
      if (h.kind === 'wave') h.x = h.baseX + Math.sin(time * h.freq + h.phase) * h.amp;
    }
    hazards = hazards.filter((h) => !h.dead && h.y - h.r < H + 60);
    for (const p of pickups) { p.y += p.vy * dt; p.rot += dt * 2; }
    pickups = pickups.filter((p) => !p.dead && p.y < H + 40);
  }

  function updatePlayer(dt) {
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      const len = Math.hypot(kx, ky);
      player.tx = clamp(player.tx + (kx / len) * 560 * dt, PLAYER_R, W - PLAYER_R);
      player.ty = clamp(player.ty + (ky / len) * 560 * dt, PLAYER_R, H - PLAYER_R);
    }
    const follow = 1 - Math.exp(-dt * 16); // smooth follow instead of teleporting
    player.x += (player.tx - player.x) * follow;
    player.y += (player.ty - player.y) * follow;
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 16) player.trail.shift();
    player.inv = Math.max(0, player.inv - dt);
  }

  // Where blade i currently is.
  function bladePos(i) {
    const a = bladeAngle + (i * TAU) / BLADE_COUNT;
    return { x: player.x + Math.cos(a) * BLADE_ORBIT, y: player.y + Math.sin(a) * BLADE_ORBIT, a };
  }

  function updateBlades(dt) {
    if (blades <= 0) return;
    blades -= dt;
    bladeAngle += BLADE_SPIN * dt;
    if (blades <= 0) {
      blades = 0;
      el.blades.classList.remove('on');
      sfx.bladeEnd();
      return;
    }
    el.bladesTime.textContent = blades.toFixed(1);
    el.bladesBar.style.width = (blades / BLADE_TIME) * 100 + '%';

    // Blades chip away at any dot they touch.
    for (const h of hazards) {
      if (h.dead || h.hitCd > 0) continue;
      for (let i = 0; i < BLADE_COUNT; i++) {
        const b = bladePos(i);
        const d = Math.hypot(h.x - b.x, h.y - b.y);
        if (d < h.r + BLADE_HIT_R) {
          h.hp -= 1;
          h.flash = 0.12;
          h.hitCd = 0.1; // short pause so one swipe = one hit
          // Knock it back away from the orb, so tough dots get "stuck" in the blades.
          const dx = h.x - player.x, dy = h.y - player.y;
          const len = Math.hypot(dx, dy) || 1;
          const push = 14;
          if (h.kind === 'wave') h.baseX += (dx / len) * push; else h.x += (dx / len) * push;
          h.y += (dy / len) * push;
          burst(b.x, b.y, '#ffffff', 5, 160);
          if (h.hp <= 0) shatter(h);
          else sfx.bladeHit();
          break;
        }
      }
    }
  }

  // Take `dmg` HP off a dot; shatters it at 0. Returns true if it broke.
  function damageHazard(h, dmg) {
    if (h.dead) return false;
    h.hp -= dmg;
    h.flash = 0.12;
    if (h.hp <= 0) { shatter(h); return true; }
    return false;
  }

  function updatePowerPill(name, left, max) {
    el[name + 'Time'].textContent = left.toFixed(1);
    el[name + 'Bar'].style.width = (left / max) * 100 + '%';
  }

  // ---- Blaster ----
  function updateBlaster(dt) {
    if (blaster > 0) {
      blaster -= dt;
      if (blaster <= 0) {
        blaster = 0;
        el.blaster.classList.remove('on');
        sfx.powerEnd();
      } else {
        updatePowerPill('blaster', blaster, BLASTER_TIME);
        fireT -= dt;
        if (fireT <= 0) {
          // Aim at the nearest dot in range.
          let target = null, bestD = BLASTER_RANGE;
          for (const h of hazards) {
            if (h.dead || h.y < -h.r) continue;
            const d = Math.hypot(h.x - player.x, h.y - player.y);
            if (d < bestD) { bestD = d; target = h; }
          }
          if (target) {
            const a = Math.atan2(target.y - player.y, target.x - player.x);
            bolts.push({
              x: player.x + Math.cos(a) * (PLAYER_R + 4), y: player.y + Math.sin(a) * (PLAYER_R + 4),
              vx: Math.cos(a) * BOLT_SPEED, vy: Math.sin(a) * BOLT_SPEED, a,
            });
            sfx.pew();
            fireT = FIRE_EVERY;
          }
        }
      }
    }
    // Move bolts and check hits (bolts already fired keep flying after the timer ends).
    for (const b of bolts) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      for (const h of hazards) {
        if (h.dead) continue;
        if (Math.hypot(h.x - b.x, h.y - b.y) < h.r + 4) {
          b.dead = true;
          burst(b.x, b.y, '#9fbcff', 4, 140);
          if (!damageHazard(h, 1)) sfx.bladeHit();
          break;
        }
      }
    }
    bolts = bolts.filter((b) => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  }

  // ---- Tesla coil ----
  function lightningPoints(x1, y1, x2, y2) {
    const pts = [[x1, y1]];
    const segs = 6;
    const len = Math.hypot(x2 - x1, y2 - y1) || 1;
    const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
    for (let i = 1; i < segs; i++) {
      const t = i / segs, off = rand(-1, 1) * Math.min(14, len * 0.15);
      pts.push([x1 + (x2 - x1) * t + nx * off, y1 + (y2 - y1) * t + ny * off]);
    }
    pts.push([x2, y2]);
    return pts;
  }

  function updateTesla(dt) {
    for (const z of zaps) z.life -= dt * 6;
    zaps = zaps.filter((z) => z.life > 0);
    if (tesla <= 0) return;
    tesla -= dt;
    if (tesla <= 0) {
      tesla = 0;
      el.tesla.classList.remove('on');
      sfx.powerEnd();
      return;
    }
    updatePowerPill('tesla', tesla, TESLA_TIME);
    zapT -= dt;
    if (zapT > 0) return;

    // Chain: orb -> nearest dot -> its nearest unhit neighbour -> ...
    let fromX = player.x, fromY = player.y, range = ZAP_RANGE;
    const hit = new Set();
    for (let n = 0; n < CHAIN_MAX; n++) {
      let next = null, bestD = range;
      for (const h of hazards) {
        if (h.dead || hit.has(h)) continue;
        const d = Math.hypot(h.x - fromX, h.y - fromY) - h.r;
        if (d < bestD) { bestD = d; next = h; }
      }
      if (!next) break;
      hit.add(next);
      zaps.push({ pts: lightningPoints(fromX, fromY, next.x, next.y), life: 1 });
      burst(next.x, next.y, '#e9ff9a', 5, 150);
      fromX = next.x; fromY = next.y;
      range = CHAIN_RANGE;
      damageHazard(next, 1);
    }
    if (hit.size) { sfx.zap(); zapT = ZAP_EVERY; }
    else zapT = 0.1; // nothing in range: check again soon
  }

  // ---- Nova shield ----
  function novaBlast() {
    nova = false;
    el.nova.classList.remove('on');
    player.inv = 1.2;
    shake = 18;
    rings.push({ x: player.x, y: player.y, r: 12, life: 1 });
    burst(player.x, player.y, '#ffae00', 50, 420);
    burst(player.x, player.y, '#fff1c2', 24, 260);
    floatText(player.x, player.y - 34, 'NOVA!', '#ffae00');
    sfx.nova();
    for (const h of hazards) {
      if (h.dead) continue;
      const d = Math.hypot(h.x - player.x, h.y - player.y);
      if (d > NOVA_R + h.r) continue;
      // Close dots take heavy damage, ones near the edge get their HP stripped.
      damageHazard(h, d < NOVA_R * 0.5 ? 6 : 3);
      if (!h.dead) {
        const len = d || 1, push = 50;
        if (h.kind === 'wave') h.baseX += ((h.x - player.x) / len) * push;
        else h.x += ((h.x - player.x) / len) * push;
        h.y += ((h.y - player.y) / len) * push;
      }
    }
  }

  function shatter(h) {
    if (h.dead) return;
    h.dead = true;
    kills++;
    const points = h.maxHp * 5;
    bonus += points;
    // Glassy shards
    const n = 8 + h.maxHp * 3;
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(120, 360);
      particles.push({
        x: h.x, y: h.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1, decay: rand(0.7, 1.3), size: rand(3, 4 + h.r * 0.25), color: h.color,
        shape: 'shard', rot: rand(0, TAU), vr: rand(-12, 12),
      });
    }
    burst(h.x, h.y, '#ffffff', 8, 220);
    floatText(h.x, h.y - h.r - 8, '+' + points, h.color);
    shake = Math.min(14, shake + 2 + h.maxHp * 0.6);
    sfx.shatter(h.maxHp);
  }

  function updatePlay(dt) {
    time += dt;
    const newLevel = 1 + Math.floor(time / 15);
    if (newLevel > level) {
      level = newLevel;
      showBanner('LEVEL ' + level);
      sfx.levelUp();
    }

    updatePlayer(dt);

    // Spawning (scaled to screen width so phones aren't flooded)
    const widthFactor = clamp(800 / W, 0.5, 1.4);
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnHazard();
      spawnT = Math.max(0.1, 0.55 - (level - 1) * 0.05) * widthFactor;
    }
    starT -= dt;
    if (starT <= 0) { spawnPickup('star'); starT = rand(2.5, 5); }
    shieldT -= dt;
    if (shieldT <= 0) { if (!shield) spawnPickup('shield'); shieldT = rand(12, 20); }

    // Weapon drops: pick one you don't already have running.
    bladeT -= dt;
    if (bladeT <= 0) {
      const options = [];
      if (blades <= 0) options.push('blade');
      if (blaster <= 0) options.push('blaster');
      if (tesla <= 0) options.push('tesla');
      if (options.length) spawnPickup(options[Math.floor(Math.random() * options.length)]);
      bladeT = rand(11, 17);
    }
    novaT -= dt;
    if (novaT <= 0) { if (!nova) spawnPickup('nova'); novaT = rand(18, 26); }

    moveHazards(dt);
    updateBlades(dt);
    updateBlaster(dt);
    updateTesla(dt);

    // Collisions
    for (const h of hazards) {
      if (h.dead) continue;
      const d = Math.hypot(h.x - player.x, h.y - player.y);
      if (d < h.r * 0.9 + PLAYER_R * 0.85) {
        if (player.inv > 0) continue;
        if (nova) { novaBlast(); continue; }
        if (shield) {
          shield = false;
          player.inv = 1.2;
          h.dead = true;
          shake = 8;
          burst(h.x, h.y, h.color, 22);
          burst(player.x, player.y, '#5dffb0', 18);
          floatText(player.x, player.y - 30, 'SHIELD!', '#5dffb0');
          el.shield.classList.remove('on');
          sfx.shieldBreak();
          continue;
        }
        die(h);
        return;
      } else if (d < h.r + PLAYER_R + 22) {
        h.close = true;
      }
      if (!h.passed && h.y - h.r > player.y + PLAYER_R) {
        h.passed = true;
        if (h.close) {
          bonus += 5;
          closeCalls++;
          floatText(player.x, player.y - 28, '+5 CLOSE!', '#4fd1ff');
          sfx.close();
        }
      }
    }

    for (const p of pickups) {
      if (Math.hypot(p.x - player.x, p.y - player.y) < 20 + PLAYER_R) {
        p.dead = true;
        if (p.type === 'star') {
          bonus += 25;
          starsCollected++;
          burst(p.x, p.y, '#ffd23f', 20, 220);
          floatText(p.x, p.y - 20, '+25', '#ffd23f');
          sfx.star();
        } else if (p.type === 'shield') {
          shield = true;
          burst(p.x, p.y, '#5dffb0', 20, 220);
          floatText(p.x, p.y - 20, 'SHIELD', '#5dffb0');
          el.shield.classList.add('on');
          sfx.shieldUp();
        } else if (p.type === 'blade') {
          blades = BLADE_TIME;
          burst(p.x, p.y, '#ff6b6b', 22, 240);
          floatText(p.x, p.y - 20, 'BLADES!', '#ff6b6b');
          el.blades.classList.add('on');
          sfx.bladeUp();
        } else if (p.type === 'blaster') {
          blaster = BLASTER_TIME; fireT = 0;
          burst(p.x, p.y, '#5b8cff', 22, 240);
          floatText(p.x, p.y - 20, 'BLASTER!', '#7fa6ff');
          el.blaster.classList.add('on');
          sfx.blasterUp();
        } else if (p.type === 'tesla') {
          tesla = TESLA_TIME; zapT = 0.1;
          burst(p.x, p.y, '#c6ff3d', 22, 240);
          floatText(p.x, p.y - 20, 'TESLA!', '#c6ff3d');
          el.tesla.classList.add('on');
          sfx.teslaUp();
        } else if (p.type === 'nova') {
          nova = true;
          burst(p.x, p.y, '#ffae00', 22, 240);
          floatText(p.x, p.y - 20, 'NOVA SHIELD', '#ffae00');
          el.nova.classList.add('on');
          sfx.novaUp();
        }
      }
    }
  }

  function update(dt) {
    const speedF = state === 'play' ? 1 + (level - 1) * 0.25 : 0.6;
    for (const s of stars) {
      s.y += (30 + 70 * speedF) * s.z * dt;
      s.tw += dt * 2;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }

    if (state === 'play') {
      updatePlay(dt);
    } else {
      // Menu / game over: calm dots drift by in the background.
      const worldDt = state === 'dying' ? dt * 0.25 : dt; // slow-motion on death
      if (state !== 'dying') {
        ambientT -= dt;
        if (ambientT <= 0 && hazards.length < 12) { spawnHazard('orb'); ambientT = 0.7; }
      }
      moveHazards(worldDt);
      if (state === 'menu') updatePlayer(dt);
      if (state === 'dying') {
        deathT += dt;
        if (deathT > 1) {
          state = 'over';
          overReadyAt = performance.now() + 500;
          el.over.classList.remove('hidden');
        }
      }
    }

    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 1 - dt * 2.2;
      p.vy *= 1 - dt * 2.2;
      if (p.vr) p.rot += p.vr * dt;
      p.life -= p.decay * dt;
    }
    particles = particles.filter((p) => p.life > 0);
    for (const r of rings) { r.r += (NOVA_R + 30 - r.r) * Math.min(1, dt * 9); r.life -= dt * 2.2; }
    rings = rings.filter((r) => r.life > 0);
    for (const t of texts) { t.y -= 40 * dt; t.life -= dt * 1.1; }
    texts = texts.filter((t) => t.life > 0);
    shake *= Math.exp(-dt * 8);

    if (state === 'play') {
      const sc = currentScore();
      if (sc !== lastShownScore) { el.score.textContent = sc; lastShownScore = sc; }
    }
  }

  // ---------- Drawing ----------
  function starPath(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot - Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 === 0 ? r : r * 0.45;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // A curved blade, pointing along `angle`, roughly `len` px long.
  function drawBlade(x, y, angle, alpha, len) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha *= alpha;
    ctx.beginPath();
    ctx.moveTo(-len, 0);
    ctx.quadraticCurveTo(0, -len * 0.55, len, 0);
    ctx.quadraticCurveTo(0, -len * 0.15, -len, 0);
    ctx.closePath();
    ctx.fillStyle = '#ffe3e3';
    ctx.fill();
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(0, -len * 0.08, 2.2, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(nebula, 0, 0, W, H);

    // Starfield with a little parallax from the player position
    const px = (player.x - W / 2) * -0.03;
    for (const s of stars) {
      ctx.globalAlpha = (0.3 + 0.5 * s.z) * (0.75 + 0.25 * Math.sin(s.tw));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(s.x + px * s.z, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    ctx.save();
    if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    ctx.globalCompositeOperation = 'lighter';

    // Pickups
    for (const p of pickups) {
      if (p.type === 'star') {
        drawSprite(glowSprite('#ffd23f', 14), p.x, p.y, 1.2);
        ctx.fillStyle = '#fff3b0';
        starPath(p.x, p.y, 11, p.rot);
        ctx.fill();
      } else if (p.type === 'blaster') {
        drawSprite(glowSprite('#5b8cff', 14), p.x, p.y, 1.2);
        // three stacked chevrons pointing up
        ctx.strokeStyle = '#dfe8ff';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        for (let i = 0; i < 3; i++) {
          const yy = p.y + 5 - i * 5;
          ctx.beginPath(); ctx.moveTo(p.x - 6, yy + 3); ctx.lineTo(p.x, yy - 3); ctx.lineTo(p.x + 6, yy + 3); ctx.stroke();
        }
      } else if (p.type === 'tesla') {
        drawSprite(glowSprite('#c6ff3d', 14), p.x, p.y, 1.2);
        ctx.fillStyle = '#f4ffd6';
        ctx.beginPath();
        ctx.moveTo(p.x + 2, p.y - 11); ctx.lineTo(p.x - 6, p.y + 1); ctx.lineTo(p.x - 1, p.y + 1);
        ctx.lineTo(p.x - 3, p.y + 11); ctx.lineTo(p.x + 6, p.y - 2); ctx.lineTo(p.x + 1, p.y - 2);
        ctx.closePath(); ctx.fill();
      } else if (p.type === 'nova') {
        drawSprite(glowSprite('#ffae00', 14), p.x, p.y, 1.3);
        ctx.strokeStyle = '#ffe0a0';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, TAU); ctx.stroke();
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const a = p.rot + (i * TAU) / 8;
          ctx.beginPath();
          ctx.moveTo(p.x + Math.cos(a) * 11, p.y + Math.sin(a) * 11);
          ctx.lineTo(p.x + Math.cos(a) * 16, p.y + Math.sin(a) * 16);
          ctx.stroke();
        }
      } else if (p.type === 'blade') {
        drawSprite(glowSprite('#ff6b6b', 14), p.x, p.y, 1.2);
        for (let i = 0; i < 3; i++) drawBlade(p.x, p.y, p.rot * 2 + (i * TAU) / 3, 0.6, 9);
      } else {
        drawSprite(glowSprite('#5dffb0', 14), p.x, p.y, 1.1);
        ctx.strokeStyle = '#5dffb0';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, TAU); ctx.stroke();
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x - 5, p.y); ctx.lineTo(p.x + 5, p.y);
        ctx.moveTo(p.x, p.y - 5); ctx.lineTo(p.x, p.y + 5);
        ctx.stroke();
      }
    }

    // Hazards
    for (const h of hazards) {
      if (h.kind === 'zip') {
        const grad = ctx.createLinearGradient(h.x, h.y, h.x, h.y - h.r * 9);
        grad.addColorStop(0, h.color + 'cc');
        grad.addColorStop(1, h.color + '00');
        ctx.strokeStyle = grad;
        ctx.lineWidth = h.r * 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(h.x, h.y - h.r * 9); ctx.stroke();
      }
      const scale = h.kind === 'giant' ? 1 + Math.sin(h.pulse) * 0.06 : 1;
      drawSprite(glowSprite(h.color, h.r), h.x, h.y, scale);
      // White flash when a blade hits it
      if (h.flash > 0) {
        ctx.globalAlpha = h.flash / 0.12;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r * scale, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // Health ring for dots that take more than one hit
      if (h.maxHp > 1) {
        const R = h.r * 1.35 * scale + 2;
        ctx.lineWidth = 2;
        ctx.strokeStyle = h.color + '40';
        ctx.beginPath(); ctx.arc(h.x, h.y, R, 0, TAU); ctx.stroke();
        ctx.strokeStyle = h.color + 'ee';
        ctx.beginPath();
        ctx.arc(h.x, h.y, R, -Math.PI / 2, -Math.PI / 2 + (TAU * h.hp) / h.maxHp);
        ctx.stroke();
      }
    }

    // Player
    if (state === 'play' || state === 'menu') {
      const blink = player.inv > 0 && Math.floor(player.inv * 16) % 2 === 0;
      if (!blink) {
        const sk = skin(), tNow = performance.now() / 1000;
        drawDotTrail(ctx, sk, player.trail, PLAYER_R, tNow);
        drawSprite(glowSprite(skinColor(sk, tNow), PLAYER_R + 2), player.x, player.y, (sk.shape === 'orb' ? 1 : 0.85) + Math.sin(performance.now() / 200) * 0.05);
        if (sk.shape !== 'orb') drawDotCore(ctx, sk, player.x, player.y, PLAYER_R, tNow);
        if (shield) {
          ctx.strokeStyle = '#5dffb0';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 5]);
          ctx.lineDashOffset = -performance.now() / 40;
          ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_R + 11, 0, TAU); ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // Spinning blades (blink during the last 2 seconds)
      if (state === 'play' && blades > 0) {
        const fading = blades < 2 && Math.floor(blades * 8) % 2 === 0;
        ctx.globalAlpha = fading ? 0.35 : 1;
        // Faint orbit ring + motion-blur arcs behind each blade
        ctx.strokeStyle = 'rgba(255,107,107,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(player.x, player.y, BLADE_ORBIT, 0, TAU); ctx.stroke();
        for (let i = 0; i < BLADE_COUNT; i++) {
          const b = bladePos(i);
          ctx.strokeStyle = 'rgba(255,107,107,0.25)';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(player.x, player.y, BLADE_ORBIT, b.a - 0.7, b.a); ctx.stroke();
          drawSprite(glowSprite('#ff6b6b', 10), b.x, b.y, 0.9);
          drawBlade(b.x, b.y, b.a + Math.PI / 2, 1, 13);
        }
        ctx.globalAlpha = 1;
      }

      if (state === 'play') {
        // Tesla: little sparks crackling around the orb
        if (tesla > 0) {
          ctx.strokeStyle = 'rgba(198,255,61,0.7)';
          ctx.lineWidth = 1.5;
          for (let i = 0; i < 3; i++) {
            const a = rand(0, TAU);
            const pts = lightningPoints(
              player.x + Math.cos(a) * (PLAYER_R + 2), player.y + Math.sin(a) * (PLAYER_R + 2),
              player.x + Math.cos(a + 0.6) * (PLAYER_R + 16), player.y + Math.sin(a + 0.6) * (PLAYER_R + 16));
            ctx.beginPath();
            pts.forEach((pt, j) => (j ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])));
            ctx.stroke();
          }
        }
        // Blaster: a small blue barrel ring
        if (blaster > 0) {
          ctx.strokeStyle = 'rgba(91,140,255,0.55)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_R + 5, 0, TAU); ctx.stroke();
        }
        // Nova shield: pulsing amber ring with spikes
        if (nova) {
          const pulse = 1 + Math.sin(performance.now() / 120) * 0.08;
          const R = (PLAYER_R + 17) * pulse;
          ctx.strokeStyle = '#ffae00';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(player.x, player.y, R, 0, TAU); ctx.stroke();
          ctx.lineWidth = 2;
          const spin = performance.now() / 500;
          for (let i = 0; i < 8; i++) {
            const a = spin + (i * TAU) / 8;
            ctx.beginPath();
            ctx.moveTo(player.x + Math.cos(a) * R, player.y + Math.sin(a) * R);
            ctx.lineTo(player.x + Math.cos(a) * (R + 6), player.y + Math.sin(a) * (R + 6));
            ctx.stroke();
          }
        }
      }
    }

    // Blaster bolts
    ctx.lineCap = 'round';
    for (const b of bolts) {
      const tx = b.x - Math.cos(b.a) * 16, ty = b.y - Math.sin(b.a) * 16;
      ctx.strokeStyle = 'rgba(91,140,255,0.6)';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = '#eef3ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    // Tesla lightning
    for (const z of zaps) {
      for (const [w, col] of [[6, `rgba(198,255,61,${0.35 * z.life})`], [2, `rgba(245,255,220,${z.life})`]]) {
        ctx.strokeStyle = col;
        ctx.lineWidth = w;
        ctx.beginPath();
        z.pts.forEach((pt, j) => (j ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])));
        ctx.stroke();
      }
    }

    // Nova shockwaves
    for (const r of rings) {
      ctx.globalAlpha = Math.max(0, r.life);
      const fill = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, r.r);
      fill.addColorStop(0, 'rgba(255,174,0,0)');
      fill.addColorStop(0.8, 'rgba(255,174,0,0.12)');
      fill.addColorStop(1, 'rgba(255,220,150,0.35)');
      ctx.fillStyle = fill;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffd27a';
      ctx.lineWidth = 2 + 8 * r.life;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      if (p.shape === 'shard') {
        // Little spinning triangles of broken "glass"
        const s = p.size;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, s * 0.6); ctx.lineTo(-s * 0.5, s * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + p.life * 0.5), 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // Floating text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 16px system-ui, sans-serif';
    for (const t of texts) {
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = t.color;
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 10;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- Input ----------
  function setTarget(x, y) {
    player.tx = clamp(x, PLAYER_R, W - PLAYER_R);
    player.ty = clamp(y - FINGER_OFFSET, PLAYER_R, H - PLAYER_R);
  }
  function tryStart() {
    initAudio(); // browsers only allow sound after a tap / click / key press
    if (state === 'menu') start();
    else if (state === 'over' && performance.now() > overReadyAt) start();
  }
  // ---------- Skin picker (menu) ----------
  const skCv = document.getElementById('skCv'), skCtx = skCv.getContext('2d');
  const skTrail = [];
  function drawSkinPreview() {
    const d2 = Math.min(window.devicePixelRatio || 1, 2);
    const w = skCv.clientWidth || 52, h = skCv.clientHeight || 52;
    if (skCv.width !== Math.round(w * d2)) { skCv.width = Math.round(w * d2); skCv.height = Math.round(h * d2); }
    const g = skCtx, t = performance.now() / 1000, sk = skin();
    g.setTransform(d2, 0, 0, d2, 0, 0);
    g.clearRect(0, 0, w, h);
    // the dot circles around so you can see its trail
    const x = w / 2 + Math.cos(t * 3) * w * 0.22, y = h / 2 + Math.sin(t * 3) * h * 0.22;
    skTrail.push({ x, y }); if (skTrail.length > 12) skTrail.shift();
    drawDotTrail(g, sk, skTrail, 7, t);
    const c = skinColor(sk, t);
    const gr = g.createRadialGradient(x, y, 0, x, y, 16);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, c); gr.addColorStop(0.5, c + '88'); gr.addColorStop(1, c + '00');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, 16, 0, TAU); g.fill();
    if (sk.shape !== 'orb') drawDotCore(g, sk, x, y, 7, t);
  }
  function setSkin(i) {
    skinIndex = (i + SKINS.length) % SKINS.length;
    try { localStorage.setItem('dodgeSkin', skinIndex); } catch (e) {}
    document.getElementById('skName').textContent = skin().name;
    document.getElementById('skNum').textContent = (skinIndex + 1) + ' / ' + SKINS.length;
    skTrail.length = 0;
  }
  for (const [id, stepBy] of [['skPrev', -1], ['skNext', 1]]) {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('click', (e) => { e.stopPropagation(); b.blur(); setSkin(skinIndex + stepBy); });
  }
  setSkin(skinIndex);
  (function skLoop() { if (state === 'menu') drawSkinPreview(); requestAnimationFrame(skLoop); })();

  window.addEventListener('pointermove', (e) => setTarget(e.clientX, e.clientY));
  window.addEventListener('pointerdown', (e) => {
    setTarget(e.clientX, e.clientY);
    tryStart();
  });
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
    if ((e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') && !e.repeat) tryStart();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  const soundBtn = document.getElementById('sound');
  function refreshSoundBtn() { soundBtn.textContent = muted ? '🔇' : '🔊'; }
  // Don't let a tap on the button start the game or move the orb.
  soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('dodgeMuted', muted ? '1' : '0'); } catch (err) {}
    refreshSoundBtn();
    soundBtn.blur(); // so Enter/Space go to the game, not the button
    if (!muted) { initAudio(); sfx.star(); }
  });
  refreshSoundBtn();
  window.focus();

  // ---------- Pause ----------
  // A pause button (shown only while a round is going), a "Paused" card, P / Esc to
  // toggle, and an automatic pause when you switch away from the game. While paused,
  // taps and keys don't reach the game, so the tap that resumes doesn't also play.
  const Pause = (() => {
    const cfg = {
      theme: 'neon',                      // 'neon' or 'paper'
      top: 'calc(max(12px, env(safe-area-inset-top)) + 58px)', right: '62px',      // where the button sits (next to sound)
      isPlaying: () => (state === 'play'),
      restart: () => { start(); },
      menu: () => { state = 'menu'; hazards = []; pickups = []; texts = []; bolts = []; zaps = []; rings = []; for (const k of ['blades', 'blaster', 'tesla', 'nova']) el[k].classList.remove('on'); el.shield.classList.remove('on'); el.over.classList.add('hidden'); el.menu.classList.remove('hidden'); },
      onChange: (p) => { for (const k in keys) keys[k] = false; },
    };
    const coarse = window.matchMedia('(pointer: coarse)').matches;
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>';
    const ICON_PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
    const css = document.createElement('style');
    const neon = cfg.theme === 'neon';
    css.textContent = `
      #pauseBtn { position: fixed; top: ${cfg.top}; right: ${cfg.right}; z-index: 8; display: none; place-items: center; cursor: pointer; padding: 0;
        ${neon
          ? 'width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(10,8,30,.5); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);'
          : 'width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid #23243a; background: #fffaf0; color: #23243a; box-shadow: 3px 3px 0 rgba(35,36,58,.28);'} }
      #pauseBtn.show { display: grid; }
      #pauseBtn:active { transform: ${neon ? 'scale(.92)' : 'translate(2px,2px)'}; }
      #pausedCard { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; text-align: center;
        background: ${neon ? 'radial-gradient(ellipse at center, rgba(5,3,15,.35), rgba(5,3,15,.8))' : 'rgba(35,36,58,.32)'}; }
      #pausedCard.on { display: flex; }
      #pausedCard .pc-in { ${neon
        ? 'color: #fff;'
        : 'background: #fffaf0; color: #23243a; border: 3px solid #23243a; border-radius: 20px; box-shadow: 8px 8px 0 rgba(35,36,58,.28); padding: 22px 34px 24px; transform: rotate(-1.5deg);'} }
      #pausedCard .pc-t { font-family: ${neon ? 'inherit' : "ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif"}; font-weight: 900;
        font-size: clamp(38px, 11vw, 64px); letter-spacing: .12em; line-height: 1;
        ${neon ? 'text-shadow: 0 0 22px rgba(79,209,255,.7), 0 0 44px rgba(167,139,250,.5);' : ''} }
      #pausedCard .pc-s { margin-top: 14px; font-weight: 800; letter-spacing: .14em; font-size: 13px; opacity: .85; }
      #pausedCard .pc-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 18px auto 0; width: min(92vw, 470px); }
      @media (max-width: 440px) { #pausedCard .pc-b { font-size: 12px; letter-spacing: .04em; padding: 10px 10px; } #pausedCard .pc-btns { gap: 6px; width: 96vw; } }
      #pausedCard .pc-b { cursor: pointer; font: inherit; font-weight: 900; letter-spacing: .1em; font-size: 14px; padding: 11px 16px; white-space: nowrap;
        ${neon
          ? 'border-radius: 999px; border: 1px solid rgba(255,255,255,.25); color: #fff; background: rgba(255,255,255,.08);'
          : 'border-radius: 14px; border: 2.5px solid #23243a; color: #23243a; background: #f6eedc; box-shadow: 3px 3px 0 rgba(35,36,58,.28);'} }
      #pausedCard .pc-b[data-act="resume"] { ${neon ? 'background: linear-gradient(90deg, #4fd1ff, #a78bfa); border-color: transparent; box-shadow: 0 0 22px rgba(79,209,255,.45);' : 'background: #ff7a59; color: #fff;'} }
      #pausedCard .pc-b:active { transform: scale(.95); }
      #pausedCard .pc-k { margin-top: 6px; font-size: 11px; letter-spacing: .1em; opacity: .55; font-weight: 700; }
    `;
    document.head.appendChild(css);
    const host = document.getElementById('app') || document.body;
    const btn = document.createElement('button');
    btn.id = 'pauseBtn'; btn.type = 'button'; btn.title = 'Pause (P)'; btn.setAttribute('aria-label', 'Pause');
    btn.innerHTML = ICON_PAUSE;
    const card = document.createElement('div');
    card.id = 'pausedCard';
    card.innerHTML = `<div class="pc-in"><div class="pc-t">PAUSED</div>`
      + `<div class="pc-btns"><button type="button" class="pc-b" data-act="resume">▶ RESUME</button><button type="button" class="pc-b pc-r" data-act="retry">↻ RETRY</button><button type="button" class="pc-b pc-r" data-act="menu">☰ MENU</button></div>`
      + `<div class="pc-k">${coarse ? 'or tap anywhere to resume' : 'P / Esc to resume · R to retry · M for menu'}</div></div>`;
    host.appendChild(btn);
    host.appendChild(card);
    card.querySelectorAll('.pc-b').forEach((b) => {
      b.addEventListener('pointerdown', (e) => e.stopPropagation());
      b.addEventListener('click', (e) => {
        e.stopPropagation(); b.blur();
        set(false);
        if (b.dataset.act === 'retry') cfg.restart();
        else if (b.dataset.act === 'menu') cfg.menu();
      });
    });

    let paused = false;
    function set(p) {
      if (p && !cfg.isPlaying()) return;
      if (p === paused) return;
      paused = p;
      card.classList.toggle('on', p);
      btn.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
      btn.setAttribute('aria-label', p ? 'Resume' : 'Pause');
      btn.title = p ? 'Resume (P)' : 'Pause (P)';
      cfg.onChange(p);
    }
    btn.addEventListener('pointerdown', (e) => e.stopPropagation());
    btn.addEventListener('click', (e) => { e.stopPropagation(); btn.blur(); set(!paused); });
    // While paused, swallow taps (other buttons like sound still work) and use them to resume
    window.addEventListener('pointerdown', (e) => {
      if (!paused) return;
      const b = e.target.closest && e.target.closest('button');
      if (b) return;
      e.stopImmediatePropagation();
      set(false);
    }, true);
    window.addEventListener('pointermove', (e) => { if (paused) e.stopImmediatePropagation(); }, true);
    window.addEventListener('keydown', (e) => {
      const k = e.code;
      const toggleKey = k === 'KeyP' || k === 'Escape';
      if (paused) {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (!e.repeat && (toggleKey || k === 'Space' || k === 'Enter' || k === 'NumpadEnter')) set(false);
        else if (!e.repeat && k === 'KeyR') { set(false); cfg.restart(); }
        else if (!e.repeat && k === 'KeyM') { set(false); cfg.menu(); }
        return;
      }
      if (toggleKey && !e.repeat && cfg.isPlaying()) { e.preventDefault(); e.stopImmediatePropagation(); set(true); }
    }, true);
    // Pause automatically when you leave the tab / app
    document.addEventListener('visibilitychange', () => { if (document.hidden) set(true); });
    window.addEventListener('blur', () => set(true));
    return {
      get paused() { return paused; },
      set,
      // call once per frame: shows the button only during a round
      sync() {
        const show = cfg.isPlaying() || paused;
        if (btn.classList.contains('show') !== show) btn.classList.toggle('show', show);
        if (paused && !cfg.isPlaying()) set(false);
      },
    };
  })();

  // ---------- Start ----------
  resize();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    Pause.sync();
    if (Pause.paused) { requestAnimationFrame(loop); return; } // frozen on the last frame
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
