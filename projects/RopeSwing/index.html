<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Rope Swing</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0620; color: #eef;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 18px 0;
    pointer-events: none;
  }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #b9a8e6; }
  .value { font-size: 28px; font-weight: 800; text-shadow: 0 0 12px rgba(255, 159, 67, 0.6); font-variant-numeric: tabular-nums; }
  .meters { font-size: 12px; font-weight: 700; color: #ffcf8a; letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
  .right { text-align: right; }
  /* Everything lives in #app so landscape mode can rotate the whole game at once. */
  #app { position: fixed; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; }
  #rotate {
    position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 106px); right: 14px;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(20, 10, 40, 0.5);
    color: #fff; font-size: 19px; line-height: 1; z-index: 5;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #rotate.on { border-color: rgba(255, 159, 67, 0.7); background: rgba(255, 159, 67, 0.22); }
  #sound {
    position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 58px); right: 14px;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(20, 10, 40, 0.5);
    color: #fff; font-size: 17px; z-index: 5;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }

  #banner {
    position: fixed; left: 0; right: 0; top: 34%;
    text-align: center; font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 0.12em;
    color: #fff; text-shadow: 0 0 20px #ff9f43, 0 0 42px #ff4fa3;
    opacity: 0; pointer-events: none;
  }
  #banner.show { animation: banner 1.5s ease-out; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(0.6); }
    15% { opacity: 1; transform: scale(1.06); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.12); }
  }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(11, 6, 32, 0.25), rgba(11, 6, 32, 0.78));
    transition: opacity 0.35s;
  }
  .overlay.hidden { opacity: 0; }
  h1 { margin: 0; font-size: clamp(44px, 13vw, 90px); line-height: 0.9; font-weight: 900; letter-spacing: -0.02em; }
  h1 .a { color: #fff; text-shadow: 0 0 18px rgba(255, 159, 67, 0.75); }
  h1 .b {
    background: linear-gradient(90deg, #ffd23f, #ff9f43, #ff4fa3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(255, 159, 67, 0.5));
  }
  .sub { margin: 18px 0 0; color: #cbbcef; font-size: 15px; max-width: 340px; line-height: 1.5; }
  .kicker { letter-spacing: 0.24em; font-weight: 800; font-size: 14px; color: #ff9f43; text-shadow: 0 0 12px rgba(255, 159, 67, 0.6); }
  .big { font-size: clamp(56px, 16vw, 96px); font-weight: 900; margin: 6px 0 0; text-shadow: 0 0 22px rgba(255, 159, 67, 0.65); font-variant-numeric: tabular-nums; }
  .newbest { margin-top: 6px; color: #ffd23f; font-weight: 800; letter-spacing: 0.16em; font-size: 13px; text-shadow: 0 0 10px rgba(255, 210, 63, 0.6); }
  .cta {
    margin-top: 28px; padding: 13px 28px; border-radius: 999px;
    font-weight: 800; letter-spacing: 0.14em; font-size: 14px; color: #fff;
    background: linear-gradient(90deg, #ff9f43, #ff4fa3);
    box-shadow: 0 0 30px rgba(255, 159, 67, 0.45);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 46px rgba(255, 159, 67, 0.7); } }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 28px; font-size: 13px; color: #cbbcef; }
  .legend b { font-weight: 800; }
  #pills {
    position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 76px); left: 18px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    pointer-events: none;
  }
  .pill {
    display: none; position: relative; overflow: hidden;
    font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(20, 10, 40, 0.55); border: 1px solid currentColor;
    font-variant-numeric: tabular-nums;
  }
  .pill.on { display: inline-block; }
  .pill .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: currentColor; }
  .gone { display: none; }

  /* ----- Customize button & panel ----- */
  .customBtn {
    pointer-events: auto; margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 5px 16px 5px 6px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(20, 10, 40, 0.65); color: #fff; font: inherit; font-weight: 800; letter-spacing: 0.12em; font-size: 12px;
  }
  .customBtn img { width: 36px; height: 36px; }
  .customBtn:active { transform: scale(0.96); }
  #custom { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(6, 3, 18, 0.62); }
  #custom.gone { display: none; }
  .cpanel {
    width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; color: #fff;
    background: linear-gradient(180deg, rgba(38, 18, 72, 0.97), rgba(18, 9, 40, 0.97));
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .chead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 4px; }
  .cname { font-size: 20px; font-weight: 900; }
  #cDone {
    cursor: pointer; padding: 9px 20px; border-radius: 999px; border: 0; color: #fff; font: inherit; font-weight: 900; letter-spacing: 0.14em; font-size: 13px;
    background: linear-gradient(90deg, #ff9f43, #ff4fa3); box-shadow: 0 0 20px rgba(255, 159, 67, 0.45);
  }
  #cPreview { width: 100%; height: 140px; display: block; flex-shrink: 0; background: radial-gradient(ellipse at 50% 15%, rgba(255, 159, 67, 0.2), transparent 70%); }
  .cscroll { overflow-y: auto; padding: 0 16px 18px; flex: 1; min-height: 0; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255, 159, 67, 0.5) transparent; }
  .clab { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; color: #b9a8e6; margin: 12px 0 7px; }
  .chead .clab { margin: 0; }
  .crow { display: flex; flex-wrap: wrap; gap: 7px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 159, 67, 0.85); }
  .chip { padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.06); color: #e9e2ff; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .chip.on { background: linear-gradient(90deg, #ff9f43, #ff4fa3); border-color: transparent; color: #fff; }
  .crow.skins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .skin { padding: 3px 2px 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.05); color: #e9e2ff; font: inherit; font-size: 9.5px; font-weight: 800; cursor: pointer; line-height: 1.1; }
  .skin img { width: 100%; max-width: 56px; display: block; margin: 0 auto 1px; pointer-events: none; }
  .skin.on { background: rgba(255, 159, 67, 0.22); border-color: #ff9f43; }
  #app.short #cPreview { height: 96px; }
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<div class="hud">
  <div><div class="label">SCORE</div><div class="value" id="score">0</div><div class="meters" id="meters">0 m</div></div>
  <div class="right"><div class="label">BEST</div><div class="value" id="best">0</div></div>
</div>
<div id="pills"></div>
<button id="sound" type="button" aria-label="Toggle sound">🔊</button>
<div id="banner"></div>

<div class="overlay" id="menu">
  <h1><span class="a">ROPE</span><br /><span class="b">SWING</span></h1>
  <p class="sub" id="howto"></p>
  <div class="cta" id="startCta">TAP TO START</div>
  <button class="customBtn" type="button"><img class="lookIcon" alt="">CUSTOMIZE</button>
  <div class="legend">
    <span><b style="color:#4fd1ff">◎</b> Hook</span>
    <span><b style="color:#ff5e5e">◎</b> Crumbles</span>
    <span><b style="color:#ffd23f">●</b> +5</span>
    <span><b style="color:#5dffb0">◯</b> Boost +10</span>
  </div>
  <div class="legend" style="margin-top:12px">
    <span>🔥 Lava Proof</span>
    <span>🧲 Magnet</span>
    <span>🪢 Long Rope</span>
    <span>🚀 Rocket</span>
    <span>⏱️ Slow-mo</span>
    <span><b style="color:#ffd23f">×2</b> Double</span>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="kicker">INTO THE LAVA</div>
  <div class="big" id="finalScore">0</div>
  <div class="newbest gone" id="newBest">★ NEW BEST ★</div>
  <p class="sub" id="overStats"></p>
  <div class="cta" id="retryCta">TAP TO RETRY</div>
  <button class="customBtn" type="button"><img class="lookIcon" alt="">CUSTOMIZE</button>
</div>
<div id="custom" class="gone">
  <div class="cpanel">
    <div class="chead"><div><div class="clab">YOUR LOOK</div><div class="cname" id="cName">Sunny</div></div><button id="cDone" type="button">DONE</button></div>
    <canvas id="cPreview"></canvas>
    <div class="cscroll" id="cScroll"></div>
  </div>
</div>
<button id="rotate" class="gone" type="button" aria-label="Toggle landscape mode" title="Landscape mode">⟳</button>
</div>

<script>
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const verb = isTouch ? 'TAP' : 'CLICK';
  document.getElementById('startCta').textContent = verb + ' TO START';
  document.getElementById('retryCta').textContent = verb + ' TO RETRY';
  document.getElementById('howto').textContent = isTouch
    ? 'Hold anywhere to shoot a rope at the nearest hook ahead. Let go to fling yourself forward. Don\'t touch the lava!'
    : 'Hold the mouse or Space to shoot a rope at the nearest hook ahead. Let go to fling yourself forward. Don\'t touch the lava!';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const el = {
    score: document.getElementById('score'),
    meters: document.getElementById('meters'),
    best: document.getElementById('best'),
    banner: document.getElementById('banner'),
    menu: document.getElementById('menu'),
    over: document.getElementById('over'),
    finalScore: document.getElementById('finalScore'),
    newBest: document.getElementById('newBest'),
    overStats: document.getElementById('overStats'),
  };

  // ---------- World ----------
  // Everything is simulated in "world units"; the view scales so it feels the same on any screen.
  const G = 1500;            // gravity
  const R = 12;              // player radius
  const RANGE = 450;         // how far the rope reaches
  const PUMP = 120;          // a little push along the swing so swings don't die out
  const REEL = 110;          // how fast the rope pulls you in toward the hook (units/s)
  const REEL_ACCEL = 90;     // the pull speeds up the longer you hang on
  const MIN_LEN = 55;        // the rope never gets shorter than this
  const MAX_SPEED = 1500;
  const PX_PER_M = 40;
  const START_X = 0;

  let W = 0, H = 0, dpr = 1, scale = 1, VW = 0, VH = 0;
  let lavaY = 0, platY = 0, playH = 700;
  const bandY = (f) => lavaY + 34 - playH + f * playH;
  let starsBg = [];

  // ---------- Landscape mode (phones) ----------
  // When it's on and the phone is held upright, the whole game is drawn rotated 90°,
  // so you turn the phone sideways and get a wide view. If the phone is already
  // sideways, nothing needs rotating. Works everywhere (iPhone can't lock orientation).
  const app = document.getElementById('app');
  const rotateBtn = document.getElementById('rotate');
  let landscape = false;
  try { landscape = isTouch && localStorage.getItem('ropeLandscape') === '1'; } catch (e) {}

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = window.innerWidth, vh = window.innerHeight;
    const rotated = landscape && vh > vw;
    W = rotated ? vh : vw; H = rotated ? vw : vh;
    app.style.width = W + 'px'; app.style.height = H + 'px';
    app.style.transform = rotated ? `translateX(${vw}px) rotate(90deg)` : '';
    rotateBtn.classList.toggle('on', landscape);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    scale = clamp(Math.min(H / 700, W / 560), 0.55, 1.6);
    VW = W / scale; VH = H / scale;
    lavaY = VH - 34;
    // On very tall screens keep the playable band a sensible height above the lava.
    playH = Math.min(VH, 760);
    platY = bandY(0.62);
    starsBg = [];
    for (let i = 0; i < 90; i++) starsBg.push({ x: Math.random(), y: Math.random() * 0.7, s: rand(0.6, 1.8), tw: rand(0, TAU) });
  }
  window.addEventListener('resize', resize);

  // ---------- Sound ----------
  let actx = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('ropeMuted') === '1'; } catch (e) {}

  function initAudio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain();
        master.gain.value = 0.6;
        master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, endFreq, dur, type = 'sine', vol = 0.12, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, fromFreq, toFreq, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(fromFreq, t0);
    filter.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(g).connect(master);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }
  let lastCoinSfx = 0;
  const sfx = {
    start: () => [330, 440, 660].forEach((f, i) => tone(f, f * 1.01, 0.12, 'square', 0.05, i * 0.07)),
    grab: () => { noise(0.08, 0.18, 6000, 1500); tone(500, 1100, 0.09, 'triangle', 0.08); },
    release: () => noise(0.25, 0.12, 2500, 400),
    coin: () => {
      const now = performance.now();
      const d = now - lastCoinSfx < 250 ? 0.04 : 0;
      lastCoinSfx = now;
      tone(988, 988, 0.07, 'square', 0.045, d); tone(1319, 1319, 0.14, 'square', 0.045, d + 0.06);
    },
    ring: () => { tone(400, 1600, 0.3, 'sawtooth', 0.06); tone(800, 2400, 0.25, 'sine', 0.06, 0.05); },
    crumbleWarn: () => tone(220, 180, 0.12, 'square', 0.04),
    crumble: () => { noise(0.35, 0.3, 3000, 200); tone(300, 80, 0.3, 'triangle', 0.08); },
    milestone: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.08, i * 0.09)),
    power: () => { tone(500, 1200, 0.2, 'triangle', 0.08); tone(750, 1800, 0.25, 'sine', 0.06, 0.08); },
    powerEnd: () => tone(700, 250, 0.3, 'triangle', 0.05),
    lavaBounce: () => { noise(0.4, 0.3, 2500, 300); tone(200, 900, 0.3, 'triangle', 0.1); },
    rocket: () => { noise(0.6, 0.25, 1500, 4000); tone(120, 500, 0.6, 'sawtooth', 0.06); },
    splash: () => { noise(1.0, 0.55, 1800, 60); tone(140, 30, 0.9, 'sine', 0.35); },
    gameOver: () => [392, 330, 262].forEach((f, i) => tone(f, f * 0.98, 0.22, 'triangle', 0.08, 0.5 + i * 0.18)),
  };

  // ---------- State ----------
  let state = 'menu';
  let overReadyAt = 0;
  let holding = false;
  let score = 0, bonus = 0, maxX = START_X, coinsGot = 0, ringsGot = 0, nextMilestone = 100, zoneShown = 0;

  // ---------- Power-ups (all temporary) ----------
  const POWERS = {
    lava:   { icon: '🔥', label: 'LAVA PROOF', color: '#ff9f43', time: 6 },
    magnet: { icon: '🧲', label: 'MAGNET', color: '#f472b6', time: 8 },
    rope:   { icon: '🪢', label: 'LONG ROPE', color: '#4fd1ff', time: 8 },
    rocket: { icon: '🚀', label: 'ROCKET', color: '#ff5e5e', time: 2.5 },
    slow:   { icon: '⏱️', label: 'SLOW-MO', color: '#a5b4fc', time: 5 },
    double: { icon: '×2', label: 'DOUBLE', color: '#ffd23f', time: 10 },
  };
  const timers = {};
  const pillEls = {};
  for (const k in POWERS) {
    timers[k] = 0;
    const el2 = document.createElement('div');
    el2.className = 'pill';
    el2.style.color = POWERS[k].color;
    el2.innerHTML = `${POWERS[k].icon} ${POWERS[k].label} <span class="t"></span>s<span class="bar"></span>`;
    document.getElementById('pills').appendChild(el2);
    pillEls[k] = { root: el2, t: el2.querySelector('.t'), bar: el2.querySelector('.bar') };
  }
  let powerups = [], powersGot = 0, nextPowerX = 0;
  const range = () => RANGE * (timers.rope > 0 ? 1.6 : 1);
  const mult = () => (timers.double > 0 ? 2 : 1);
  let best = 0;
  try { best = Number(localStorage.getItem('ropeBest')) || 0; } catch (e) {}
  el.best.textContent = best;

  let player, rope, target;
  let anchors = [], coins = [], rings = [], particles = [], trail = [];
  let camX = 0, camY = 0, time = 0, shake = 0;
  let lastAnchorX = 0;

  function reset() {
    player = { x: START_X - 60, y: platY - R, vx: 0, vy: 0, alive: true };
    rope = null; target = null;
    anchors = []; coins = []; rings = []; particles = []; trail = [];
    score = 0; bonus = 0; maxX = START_X; coinsGot = 0; ringsGot = 0; nextMilestone = 100; zoneShown = 0;
    powerups = []; powersGot = 0; nextPowerX = START_X + 700;
    for (const k in timers) timers[k] = 0;
    // First hook is always an easy reach from the start ledge.
    anchors.push(makeAnchor(START_X + 140, bandY(0.24), false, 0));
    lastAnchorX = START_X + 140;
    camX = player.x - VW * 0.35; camY = 0;
    generate();
    updateHud();
  }

  function makeAnchor(x, y, crumble, bob) {
    return { x, y, baseY: y, crumble, bob, phase: rand(0, TAU), speed: rand(1.2, 2), breakT: -1, broken: false, pulse: 0 };
  }

  function generate() {
    while (lastAnchorX < camX + VW + 700) {
      const m = (lastAnchorX - START_X) / PX_PER_M;
      const gap = rand(200, 270) + Math.min(170, m * 0.55);
      const prev = anchors[anchors.length - 1];
      const x = lastAnchorX + gap;
      const y = bandY(rand(0.1, 0.4));
      const crumble = m > 50 && Math.random() < Math.min(0.32, 0.08 + m / 1500);
      const bob = m > 120 && Math.random() < Math.min(0.4, 0.15 + m / 2000) ? rand(35, 75) : 0;
      const a = makeAnchor(x, y, crumble, bob);
      anchors.push(a);

      // Coins in a gentle arc between hooks.
      if (Math.random() < 0.65) {
        const n = 3 + Math.floor(Math.random() * 3);
        const baseY = Math.max(prev.baseY, y) + rand(110, 190);
        for (let i = 0; i < n; i++) {
          const t = (i + 1) / (n + 1);
          coins.push({ x: lerp(prev.x, x, t), y: baseY - Math.sin(t * Math.PI) * 70, got: false, spin: rand(0, TAU) });
        }
      } else if (m > 15 && Math.random() < 0.5) {
        // A boost ring instead.
        rings.push({ x: lerp(prev.x, x, 0.55), y: (prev.baseY + y) / 2 + rand(90, 160), got: false, t: 0 });
      }
      // Every so often, a power-up bubble floats between two hooks.
      if (x > nextPowerX && Math.random() < 0.45) {
        powerups.push({ x: lerp(prev.x, x, 0.45), y: (prev.baseY + y) / 2 + rand(50, 130), kind: pick(Object.keys(POWERS)), t: 0, got: false });
        nextPowerX = x + rand(1300, 2100);
      }
      lastAnchorX = x;
    }
    // Drop things far behind the camera.
    const cut = camX - 500;
    anchors = anchors.filter((a) => a.x > cut || (rope && rope.a === a));
    coins = coins.filter((c) => c.x > cut && !(c.got && c.fade <= 0));
    rings = rings.filter((r) => r.x > cut);
    powerups = powerups.filter((u) => u.x > cut && !u.got);
  }

  function start() {
    reset();
    state = 'playing';
    el.menu.classList.add('hidden');
    el.over.classList.add('hidden');
    sfx.start();
  }

  function die() {
    state = 'over';
    player.alive = false;
    rope = null;
    shake = 18;
    sfx.splash(); sfx.gameOver();
    for (let i = 0; i < 60; i++) {
      const a = rand(-Math.PI, 0), s = rand(150, 650);
      particles.push({ x: player.x, y: lavaY, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.6, 1.3), max: 1.3, c: Math.random() < 0.5 ? '#ff9f43' : '#ffd23f', r: rand(2, 5), g: 1 });
    }
    const isBest = score > best;
    if (isBest) {
      best = score;
      try { localStorage.setItem('ropeBest', best); } catch (e) {}
      el.best.textContent = best;
    }
    el.finalScore.textContent = score;
    el.newBest.classList.toggle('gone', !isBest);
    el.overStats.textContent = `${meters()} m swung · ${coinsGot} coins · ${ringsGot} boosts · ${powersGot} power-ups`;
    for (const k in timers) timers[k] = 0;
    updateHud();
    overReadyAt = performance.now() + 700;
    setTimeout(() => { if (state === 'over') el.over.classList.remove('hidden'); }, 600);
  }

  function meters() { return Math.max(0, Math.floor((maxX - START_X) / PX_PER_M)); }

  function updateHud() {
    score = meters() + bonus;
    el.score.textContent = score;
    el.meters.textContent = meters() + ' m';
    for (const k in POWERS) {
      const t = timers[k], pe = pillEls[k];
      pe.root.classList.toggle('on', t > 0);
      if (t > 0) { pe.t.textContent = t.toFixed(1); pe.bar.style.width = (t / POWERS[k].time) * 100 + '%'; }
    }
  }

  function banner(text) {
    el.banner.textContent = text;
    el.banner.classList.remove('show');
    void el.banner.offsetWidth;
    el.banner.classList.add('show');
  }

  function burst(x, y, color, n, speed = 260) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(speed * 0.3, speed);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, c: color, r: rand(1.5, 3.5), g: 0.4 });
    }
  }

  // ---------- Rope ----------
  function findTarget() {
    const p = player;
    let bestA = null, bestD = Infinity;
    for (const a of anchors) {
      if (a.broken) continue;
      const d = Math.hypot(a.x - p.x, a.y - p.y);
      if (d > range()) continue;
      // Hooks ahead of you are strongly preferred over ones behind.
      const behind = a.x < p.x - 30;
      const s = d + (behind ? 600 : 0) - (a.y < p.y ? 40 : 0);
      if (s < bestD) { bestD = s; bestA = a; }
    }
    return bestA;
  }

  function attach(a) {
    const d = Math.hypot(player.x - a.x, player.y - a.y);
    rope = { a, len: clamp(d, 70, range()), shoot: 0, held: 0 };
    if (a.crumble && a.breakT < 0) { a.breakT = 0.85; sfx.crumbleWarn(); }
    sfx.grab();
    burst(a.x, a.y, a.crumble ? '#ff5e5e' : '#4fd1ff', 10, 160);
  }

  function detach() {
    if (!rope) return;
    rope = null;
    // A small reward for letting go with speed.
    const sp = Math.hypot(player.vx, player.vy);
    if (sp > 300) { player.vx *= 1.04; player.vy *= 1.04; }
    sfx.release();
  }

  // ---------- Physics ----------
  function step(h) {
    const p = player;
    p.vy += G * h;

    if (rope) {
      const a = rope.a;
      const dx = p.x - a.x, dy = p.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const tx = -dy / d, ty = dx / d;
      const vt = p.vx * tx + p.vy * ty;
      let s = Math.sign(vt);
      if (Math.abs(vt) < 30) s = Math.sign(tx) || 1; // from rest, swing forward
      p.vx += tx * s * PUMP * h;
      p.vy += ty * s * PUMP * h;
    }

    p.vx *= 1 - 0.04 * h;
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > MAX_SPEED) { p.vx *= MAX_SPEED / sp; p.vy *= MAX_SPEED / sp; }

    const prevY = p.y;
    p.x += p.vx * h;
    p.y += p.vy * h;

    if (rope) {
      const a = rope.a;
      const dx = p.x - a.x, dy = p.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > rope.len) {
        const nx = dx / d, ny = dy / d;
        p.x = a.x + nx * rope.len;
        p.y = a.y + ny * rope.len;
        const vr = p.vx * nx + p.vy * ny;
        if (vr > 0) { p.vx -= nx * vr; p.vy -= ny * vr; }
      }
    }

    // Start ledge
    if (p.x > START_X - 400 && p.x < START_X + 10 && p.vy >= 0 && prevY + R <= platY + 1 && p.y + R > platY) {
      p.y = platY - R;
      p.vy = 0;
      p.vx *= 1 - Math.min(1, 8 * h);
    }
  }

  // ---------- Update ----------
  function update(dt) {
    // Power-up timers tick in real time; Slow-mo then halves everything else.
    if (state === 'playing') {
      for (const k in timers) {
        if (timers[k] > 0) {
          timers[k] = Math.max(0, timers[k] - dt);
          if (timers[k] === 0) sfx.powerEnd();
        }
      }
    }
    if (timers.slow > 0) dt *= 0.5;
    time += dt;
    shake = Math.max(0, shake - 40 * dt);

    for (const a of anchors) {
      if (a.bob) a.y = a.baseY + Math.sin(time * a.speed + a.phase) * a.bob;
      a.pulse = Math.max(0, a.pulse - dt * 3);
      if (a.breakT > 0) {
        a.breakT -= dt;
        if (a.breakT <= 0 && !a.broken) {
          a.broken = true;
          if (rope && rope.a === a) rope = null;
          sfx.crumble();
          burst(a.x, a.y, '#ff5e5e', 26, 300);
        }
      }
    }

    if (state === 'playing') {
      const rocketing = timers.rocket > 0;
      target = rope || rocketing ? null : findTarget();
      if (holding && !rope && target) attach(target);
      if (rocketing) {
        // Rocket: let go of any rope and blast forward, steering toward a safe height.
        if (rope) rope = null;
        const p = player;
        p.vx = lerp(p.vx, 950, Math.min(1, dt * 4));
        p.vy = lerp(p.vy, (bandY(0.3) - p.y) * 3, Math.min(1, dt * 5)) - G * dt; // cancel gravity
        if (Math.random() < 0.8) particles.push({ x: p.x - 14, y: p.y + rand(-4, 4), vx: rand(-260, -120), vy: rand(-40, 40), life: rand(0.2, 0.4), max: 0.4, c: Math.random() < 0.5 ? '#ffd23f' : '#ff5e5e', r: rand(2, 4), g: 0 });
      }
      if (!holding && rope) detach();
      if (rope) {
        rope.shoot = Math.min(1, rope.shoot + dt * 12);
        // Reel in: the rope shortens the longer you hold, pulling you toward the hook.
        // A shorter rope also makes you swing faster (like a skater pulling their arms in).
        rope.held += dt;
        const prevLen = rope.len;
        rope.len = Math.max(MIN_LEN, rope.len - (REEL + REEL_ACCEL * rope.held) * dt);
        const a = rope.a, p = player;
        const dx = p.x - a.x, dy = p.y - a.y;
        const d = Math.hypot(dx, dy) || 1;
        if (rope.len < prevLen && d >= prevLen - 1) {
          // Taut rope got shorter: keep angular momentum, so the sideways speed goes up.
          const tx = -dy / d, ty = dx / d;
          const vt = p.vx * tx + p.vy * ty;
          const boost = vt * (prevLen / rope.len - 1);
          p.vx += tx * boost; p.vy += ty * boost;
          // And actually move inward along the rope, not just get snapped there.
          const nx = dx / d, ny = dy / d;
          const vr = p.vx * nx + p.vy * ny;
          const pull = REEL + REEL_ACCEL * rope.held;
          if (vr > -pull) { p.vx -= nx * (vr + pull) * 0.5; p.vy -= ny * (vr + pull) * 0.5; }
        }
      }

      const sub = 6;
      for (let i = 0; i < sub; i++) step(dt / sub);

      const p = player;
      trail.push({ x: p.x, y: p.y });
      if (trail.length > 22) trail.shift();
      if (p.x > maxX) maxX = p.x;

      for (const c of coins) {
        if (c.got) continue;
        if (timers.magnet > 0) {
          const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy) || 1;
          if (d < 260) { c.x += (dx / d) * 700 * dt; c.y += (dy / d) * 700 * dt; }
        }
        if (Math.hypot(c.x - p.x, c.y - p.y) < R + 14) {
          c.got = true; c.fade = 0.4; coinsGot++; bonus += 5 * mult();
          sfx.coin(); burst(c.x, c.y, '#ffd23f', 8, 180);
        }
      }
      for (const r of rings) {
        if (!r.got && Math.hypot(r.x - p.x, r.y - p.y) < 34) {
          r.got = true; ringsGot++; bonus += 10 * mult();
          const sp = Math.hypot(p.vx, p.vy) || 1;
          p.vx += 380; p.vy = Math.min(p.vy, -120);
          if (sp < 200) p.vy -= 200;
          sfx.ring(); burst(r.x, r.y, '#5dffb0', 22, 320);
          shake = 5;
        }
      }

      for (const u of powerups) {
        if (!u.got && Math.hypot(u.x - p.x, u.y + Math.sin(u.t * 3) * 8 - p.y) < R + 24) {
          u.got = true;
          powersGot++;
          const P = POWERS[u.kind];
          timers[u.kind] = P.time;
          banner(P.label + '!');
          burst(u.x, u.y, P.color, 24, 280);
          if (u.kind === 'rocket') { sfx.rocket(); shake = 6; } else sfx.power();
        }
      }

      updateHud();
      const zoneNow = Math.floor(meters() / ZONE_LEN);
      if (zoneNow > zoneShown) {
        zoneShown = zoneNow;
        banner(ZONES[zoneNow % ZONES.length].name);
        sfx.milestone();
        while (meters() >= nextMilestone) nextMilestone += 100;
      } else if (meters() >= nextMilestone) {
        banner(nextMilestone + ' M!');
        sfx.milestone();
        nextMilestone += 100;
      }
      if (p.y + R > lavaY) {
        if (timers.lava > 0) {
          // Lava Proof: bounce off the lava instead of burning up.
          p.y = lavaY - R;
          p.vy = -Math.max(900, Math.abs(p.vy) * 0.9);
          p.vx = Math.max(p.vx, 250);
          burst(p.x, lavaY, '#ffd23f', 20, 300);
          sfx.lavaBounce();
          shake = 6;
        } else die();
      }
    }

    // Camera
    const p = player;
    const tx = p.x - VW * 0.35;
    camX = lerp(camX, tx, Math.min(1, dt * 5));
    const ty = Math.min(0, p.y - VH * 0.22);
    camY = lerp(camY, ty, Math.min(1, dt * 4));
    generate();

    for (const c of coins) { c.spin += dt * 4; if (c.got) c.fade -= dt; }
    for (const r of rings) r.t += dt;
    for (const u of powerups) u.t += dt;
    for (const q of particles) {
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vy += 900 * q.g * dt;
      q.life -= dt;
    }
    particles = particles.filter((q) => q.life > 0);
  }

  // ---------- Draw ----------
  // ---------- Background zones ----------
  // The scenery changes the farther you swing (every 250 m), fading from one zone to the next.
  const ZONE_LEN = 250;
  const ZONES = [
    { name: 'VOLCANO DUSK', sky: ['#0b0620', '#2a0f4a', '#6b1f4f', '#c2410c'], glow: '255, 159, 67', core: '255, 210, 160', stars: 0.7,
      style: 'hills', layers: ['#3a1356', '#2a0c3f', '#1a0629'] },
    { name: 'NEON CITY', sky: ['#05031a', '#1b0b3f', '#4a1063', '#ff4fa3'], glow: '255, 79, 163', core: '255, 205, 232', stars: 0.35,
      style: 'city', layers: ['#2c1254', '#1b0a38', '#0d0620'], extra: 'windows' },
    { name: 'FROZEN PEAKS', sky: ['#020b1c', '#0b2545', '#1d4e6e', '#5fa8c8'], glow: '180, 230, 255', core: '240, 250, 255', stars: 0.95,
      style: 'peaks', layers: ['#33597a', '#1f3b57', '#10233a'], extra: 'aurora' },
    { name: 'JUNGLE SUNSET', sky: ['#1a0b05', '#5a1d0e', '#c2410c', '#ffb347'], glow: '255, 196, 90', core: '255, 240, 190', stars: 0.12,
      style: 'trees', layers: ['#5a3412', '#33200a', '#190f04'] },
    { name: 'CRYSTAL CAVES', sky: ['#07020f', '#1e0838', '#3b0f6b', '#7c3aed'], glow: '94, 234, 212', core: '215, 255, 248', stars: 0.5,
      style: 'crystals', layers: ['#3e1c74', '#28104d', '#140726'] },
    { name: 'DEEP SPACE', sky: ['#000005', '#04041a', '#0b0b30', '#221f66'], glow: '167, 139, 250', core: '232, 222, 255', stars: 1.0,
      style: 'rocks', layers: ['#221f45', '#15132e', '#09081b'], extra: 'planet' },
  ];
  const hash01 = (i) => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  const zoneAt = (m) => ZONES[Math.floor(m / ZONE_LEN) % ZONES.length];

  // One parallax silhouette layer (depth 0 = far, 2 = near), drawn in screen space.
  const LAYER = [
    { par: 0.12, amp: 60, base: 0.72, freq: 0.004, seed: 1 },
    { par: 0.25, amp: 50, base: 0.8, freq: 0.007, seed: 4 },
    { par: 0.45, amp: 36, base: 0.88, freq: 0.012, seed: 7 },
  ];
  function ridge(Z, depth) {
    const Lr = LAYER[depth];
    const amp = Lr.amp * scale, base = H * Lr.base, off = camX * Lr.par;
    const lift = camY * Lr.par * scale * 0.5;
    const color = Z.layers[depth];
    ctx.fillStyle = color;
    if (Z.style === 'city' || Z.style === 'crystals') {
      // blocks / spires placed on a scrolling grid
      const sp = (Z.style === 'crystals' ? 52 + depth * 30 : 26 + depth * 16) * scale;
      const offPx = off * scale;
      const first = Math.floor(offPx / sp) - 1;
      for (let k = first; k < first + Math.ceil(W / sp) + 3; k++) {
        const x = k * sp - offPx;
        const r = hash01(k * 3.7 + depth * 11);
        if (Z.style === 'city') {
          const h = amp * (1.1 + r * 1.9), w = sp * (0.72 + hash01(k + 5) * 0.26);
          const top = base - h - lift;
          ctx.fillRect(x, top, w, H - top);
          if (hash01(k + 9) > 0.75) ctx.fillRect(x + w * 0.45, top - amp * 0.35, w * 0.08, amp * 0.35); // antenna
          if (Z.extra === 'windows' && depth === 1) {
            for (let wy = top + 6 * scale; wy < base + amp * 0.4 - lift; wy += 9 * scale) {
              for (let wx = x + 4 * scale; wx < x + w - 6 * scale; wx += 7 * scale) {
                const hv = hash01(wx * 0.31 + wy * 0.77 + k);
                if (hv > 0.72) {
                  ctx.fillStyle = hv > 0.9 ? 'rgba(79, 209, 255, 0.85)' : 'rgba(255, 214, 120, 0.85)';
                  ctx.fillRect(wx, wy, 2.6 * scale, 3.6 * scale);
                }
              }
            }
            ctx.fillStyle = color;
          }
        } else {
          const h = amp * (1.1 + r * 2.8), w = sp * (0.55 + hash01(k + 2) * 0.35);
          const cx = x + sp / 2, top = base - h - lift;
          ctx.beginPath();
          ctx.moveTo(cx - w / 2, base + amp - lift); ctx.lineTo(cx - w * 0.12, top + h * 0.15); ctx.lineTo(cx, top);
          ctx.lineTo(cx + w * 0.16, top + h * 0.2); ctx.lineTo(cx + w / 2, base + amp - lift);
          ctx.closePath(); ctx.fill();
          // crystal edge glow
          ctx.strokeStyle = 'rgba(' + Z.glow + ', ' + (0.18 + depth * 0.1) + ')'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(cx - w * 0.12, top + h * 0.15); ctx.lineTo(cx, top); ctx.lineTo(cx + w * 0.16, top + h * 0.2); ctx.stroke();
        }
      }
      ctx.fillRect(0, base + amp * 0.6 - lift, W, H);
      return;
    }
    ctx.beginPath();
    ctx.moveTo(0, H);
    const pts = [];
    for (let sx = 0; sx <= W + 8; sx += 8) {
      const wx = (sx / scale + off) * Lr.freq;
      const wave = Math.sin(wx + Lr.seed) * 0.6 + Math.sin(wx * 2.3 + Lr.seed * 2) * 0.3 + Math.sin(wx * 5.1 + Lr.seed) * 0.1;
      let y;
      if (Z.style === 'peaks') {
        const u = wx * 1.7 + Lr.seed, tri = Math.abs(((u % 2) + 2) % 2 - 1);
        y = base - (tri * 1.4 + Math.abs(Math.sin(u * 0.37)) * 0.6) * amp * 1.1 + amp * 0.5;
      } else if (Z.style === 'trees') {
        y = base + wave * amp * 0.5 - Math.abs(Math.sin(wx * 11 + Lr.seed)) * amp * 0.45;
      } else if (Z.style === 'rocks') {
        y = base + wave * amp * 0.8 - Math.abs(Math.sin(wx * 3.3 + Lr.seed)) * amp * 0.35;
      } else {
        y = base + wave * amp;
      }
      y -= lift;
      pts.push([sx, y]);
      ctx.lineTo(sx, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    if (Z.style === 'peaks') {
      // frosty highlight along the ridge line
      ctx.strokeStyle = 'rgba(235, 248, 255, ' + (0.35 - depth * 0.1) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    }
  }

  let zoneAlpha = 1;
  function drawZone(Z) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, Z.sky[0]); g.addColorStop(0.55, Z.sky[1]); g.addColorStop(0.85, Z.sky[2]); g.addColorStop(1, Z.sky[3]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const st of starsBg) {
      const x = ((st.x * W - camX * 0.05 * scale) % W + W) % W;
      ctx.globalAlpha = (0.35 + 0.35 * Math.sin(time * 2 + st.tw)) * Z.stars * zoneAlpha;
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, st.y * H, st.s, st.s);
    }
    ctx.globalAlpha = zoneAlpha;

    if (Z.extra === 'aurora') {
      for (let k = 0; k < 2; k++) {
        ctx.beginPath();
        for (let sx = 0; sx <= W + 20; sx += 20) {
          const y = H * (0.14 + k * 0.08) + Math.sin(sx * 0.004 + time * 0.35 + k * 2) * H * 0.05 + Math.sin(sx * 0.011 - time * 0.2) * H * 0.015;
          if (sx) ctx.lineTo(sx, y); else ctx.moveTo(sx, y);
        }
        ctx.lineWidth = (46 - k * 14) * scale;
        ctx.strokeStyle = k ? 'rgba(167, 139, 250, 0.1)' : 'rgba(93, 255, 176, 0.12)';
        ctx.stroke();
        ctx.lineWidth = 4 * scale;
        ctx.strokeStyle = k ? 'rgba(196, 181, 253, 0.25)' : 'rgba(134, 255, 196, 0.3)';
        ctx.stroke();
      }
    }

    // Big low moon / sun glow in the zone's color
    const mx = W * 0.78, my = H * 0.3;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 120 * scale);
    mg.addColorStop(0, 'rgba(' + Z.core + ', 0.9)');
    mg.addColorStop(0.35, 'rgba(' + Z.glow + ', 0.35)');
    mg.addColorStop(1, 'rgba(' + Z.glow + ', 0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - 130 * scale, my - 130 * scale, 260 * scale, 260 * scale);

    if (Z.extra === 'planet') {
      const px = W * 0.24, py = H * 0.26, pr = 46 * scale;
      const pg = ctx.createRadialGradient(px - pr * 0.4, py - pr * 0.4, pr * 0.1, px, py, pr);
      pg.addColorStop(0, '#f0abfc'); pg.addColorStop(0.5, '#a855f7'); pg.addColorStop(1, '#3b0764');
      ctx.strokeStyle = 'rgba(253, 224, 171, 0.55)'; ctx.lineWidth = 5 * scale;
      ctx.beginPath(); ctx.ellipse(px, py, pr * 1.8, pr * 0.42, -0.35, Math.PI, TAU); ctx.stroke(); // back half of the ring
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(px, py, pr * 1.8, pr * 0.42, -0.35, 0, Math.PI); ctx.stroke(); // front half
    }

    for (let d = 0; d < 3; d++) ridge(Z, d);
    ctx.globalAlpha = 1;
  }

  // Draw the current zone, cross-fading into the next one over the last 30 m
  function drawBackground() {
    const m = meters();
    const into = m % ZONE_LEN;
    const FADE = 30;
    zoneAlpha = 1;
    drawZone(zoneAt(m));
    if (into > ZONE_LEN - FADE) {
      zoneAlpha = (into - (ZONE_LEN - FADE)) / FADE;
      ctx.globalAlpha = zoneAlpha;
      drawZone(zoneAt(m + FADE));
      zoneAlpha = 1;
      ctx.globalAlpha = 1;
    }
  }

  function drawLava() {
    const top = (lavaY - camY) * scale;
    const g = ctx.createLinearGradient(0, top - 40 * scale, 0, H);
    g.addColorStop(0, 'rgba(255, 120, 30, 0)');
    g.addColorStop(0.3, 'rgba(255, 120, 30, 0.35)');
    g.addColorStop(1, 'rgba(255, 80, 20, 0.6)');
    ctx.fillStyle = g;
    ctx.fillRect(0, top - 40 * scale, W, H - top + 40 * scale);

    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let sx = 0; sx <= W + 6; sx += 6) {
      const wx = sx / scale + camX;
      const y = top + Math.sin(wx * 0.03 + time * 2.2) * 4 * scale + Math.sin(wx * 0.071 - time * 1.4) * 3 * scale;
      ctx.lineTo(sx, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const lg = ctx.createLinearGradient(0, top, 0, H);
    lg.addColorStop(0, '#ffd23f');
    lg.addColorStop(0.15, '#ff9f43');
    lg.addColorStop(1, '#b91c1c');
    ctx.fillStyle = lg;
    ctx.fill();

    // Bubbles
    for (let i = 0; i < 8; i++) {
      const bx = ((i * 197 + Math.floor(time * 0.6 + i) * 89) % Math.max(1, W));
      const ph = (time * 0.6 + i) % 1;
      ctx.globalAlpha = 1 - ph;
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath();
      ctx.arc(bx, top + 6 * scale - ph * 10 * scale, (2 + ph * 4) * scale, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawWorld() {
    // Start ledge
    if (START_X + 10 > camX - 10) {
      ctx.fillStyle = '#1a0629';
      ctx.fillRect(START_X - 400, platY, 410, lavaY - platY + 40);
      ctx.fillStyle = '#ff9f43';
      ctx.fillRect(START_X - 400, platY, 410, 4);
    }

    // Rings
    for (const r of rings) {
      if (r.got && r.t > 99) continue;
      ctx.save();
      ctx.translate(r.x, r.y);
      const pulse = 1 + Math.sin(r.t * 5) * 0.06;
      ctx.scale(0.55 * pulse, pulse);
      ctx.lineWidth = 6;
      ctx.strokeStyle = r.got ? 'rgba(93, 255, 176, 0.2)' : '#5dffb0';
      ctx.shadowColor = '#5dffb0'; ctx.shadowBlur = r.got ? 0 : 16;
      ctx.beginPath(); ctx.arc(0, 0, 32, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // Coins
    for (const c of coins) {
      if (c.got && c.fade <= 0) continue;
      ctx.save();
      ctx.translate(c.x, c.got ? c.y - (0.4 - c.fade) * 60 : c.y);
      ctx.globalAlpha = c.got ? Math.max(0, c.fade / 0.4) : 1;
      ctx.scale(Math.abs(Math.cos(c.spin)) * 0.8 + 0.2, 1);
      ctx.fillStyle = '#ffd23f';
      ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff3b0';
      ctx.beginPath(); ctx.arc(-2, -2, 3, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // Power-up bubbles
    for (const u of powerups) {
      const P = POWERS[u.kind];
      const y = u.y + Math.sin(u.t * 3) * 8;
      ctx.save();
      ctx.shadowColor = P.color; ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.strokeStyle = P.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(u.x, y, 20 + Math.sin(u.t * 6) * 1.5, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(u.x - 7, y - 8, 4, 0, TAU); ctx.fill();
      ctx.font = u.kind === 'double' ? '900 15px system-ui, sans-serif' : '18px system-ui, sans-serif';
      ctx.fillStyle = P.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(P.icon, u.x, y + 1);
    }

    // Long Rope: show how far you can now reach
    if (state === 'playing' && timers.rope > 0) {
      ctx.strokeStyle = 'rgba(79, 209, 255, 0.12)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 10]);
      ctx.beginPath(); ctx.arc(player.x, player.y, range(), 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Aim line to the hook you'd grab
    if (state === 'playing' && !rope && target) {
      ctx.save();
      ctx.setLineDash([6, 8]);
      ctx.lineDashOffset = -time * 40;
      ctx.strokeStyle = target.crumble ? 'rgba(255, 94, 94, 0.45)' : 'rgba(79, 209, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(target.x, target.y); ctx.stroke();
      ctx.restore();
    }

    // Hooks
    for (const a of anchors) {
      if (a.broken) continue;
      const col = a.crumble ? '#ff5e5e' : '#4fd1ff';
      const isT = a === target || (rope && rope.a === a);
      let jx = 0;
      if (a.breakT > 0) jx = Math.sin(time * 80) * 2.5;
      ctx.save();
      ctx.translate(a.x + jx, a.y);
      if (a.bob) {
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, a.baseY - a.y - a.bob); ctx.lineTo(0, a.baseY - a.y + a.bob); ctx.stroke();
      }
      const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, isT ? 34 : 24);
      gr.addColorStop(0, col + 'aa');
      gr.addColorStop(1, col + '00');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(0, 0, isT ? 34 : 24, 0, TAU); ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
      if (a.crumble) {
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-1, 1); ctx.lineTo(-3, 6); ctx.moveTo(4, -6); ctx.lineTo(2, 0); ctx.stroke();
      }
      if (isT && !rope) {
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 16 + Math.sin(time * 8) * 3, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }

    // Rope
    if (rope && player.alive) {
      const a = rope.a, p = player;
      const ex = lerp(p.x, a.x, rope.shoot), ey = lerp(p.y, a.y, rope.shoot);
      const d = Math.hypot(p.x - a.x, p.y - a.y);
      const slack = Math.max(0, rope.len - d);
      drawRopeLine(ctx, p.x, p.y, (p.x + ex) / 2, (p.y + ey) / 2 + slack * 0.6, ex, ey, ropeLook, time);
    }

    // Trail
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      ctx.globalAlpha = (i / trail.length) * 0.35;
      ctx.fillStyle = look.trail;
      ctx.beginPath(); ctx.arc(t.x, t.y, R * (i / trail.length), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Player
    if (player.alive) {
      const p = player;
      // your character (skin), looking where it's going
      drawCharacter(ctx, p.x, p.y, R, look, p.vx, p.vy, time);

      // Power-up effects around the player
      const blinking = (t) => t < 1.5 && Math.floor(time * 8) % 2 === 0;
      if (timers.lava > 0 && !blinking(timers.lava)) {
        ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i <= 24; i++) {
          const a = (i / 24) * TAU, rr = R + 8 + Math.sin(a * 6 + time * 12) * 3;
          ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.stroke();
      }
      if (timers.magnet > 0 && !blinking(timers.magnet)) {
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.4)'; ctx.lineWidth = 2;
        ctx.setLineDash([4, 8]); ctx.lineDashOffset = time * 30;
        ctx.beginPath(); ctx.arc(p.x, p.y, 55 + Math.sin(time * 4) * 5, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (timers.rocket > 0) {
        ctx.fillStyle = '#ff5e5e';
        ctx.beginPath(); ctx.moveTo(p.x - R - 2, p.y - 6); ctx.lineTo(p.x - R - 2 - rand(14, 26), p.y); ctx.lineTo(p.x - R - 2, p.y + 6); ctx.fill();
      }
    }
    if (timers.slow > 0) {
      ctx.fillStyle = 'rgba(165, 180, 252, 0.06)';
      ctx.fillRect(camX - 50, camY - 50, VW + 100, VH + 100);
    }

    for (const q of particles) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    const sx = shake ? rand(-shake, shake) * 0.4 : 0, sy = shake ? rand(-shake, shake) * 0.4 : 0;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (-camX * scale + sx) * dpr, (-camY * scale + sy) * dpr);
    drawWorld();
    ctx.setTransform(dpr, 0, 0, dpr, sx * dpr, sy * dpr);
    drawLava();

    // Arrow when you're off the top of the screen
    if (player.alive && (player.y - camY) * scale < -10) {
      const x = (player.x - camX) * scale;
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x - 7, 20); ctx.lineTo(x + 7, 20); ctx.closePath(); ctx.fill();
    }
  }

  // ---------- Skins & rope styles ----------
  // A "look" is a recipe: body colors, a pattern, eyes, headgear and a trail color.
  // The rope has its own color, style and thickness. Pick a preset or mix your own.
  const OPTIONS = {
    pattern: [['none', 'None'], ['stripes', 'Stripes'], ['dots', 'Dots'], ['web', 'Web'], ['zigzag', 'Zigzag'], ['stars', 'Stars'], ['split', 'Half']],
    eyes: [['happy', 'Happy'], ['big', 'Big'], ['shades', 'Shades'], ['angry', 'Fierce'], ['mask', 'Hero mask'], ['sleepy', 'Sleepy']],
    hat: [['none', 'None'], ['cap', 'Cap'], ['crown', 'Crown'], ['ears', 'Cat ears'], ['antenna', 'Antenna'], ['horns', 'Horns'], ['halo', 'Halo'], ['leaf', 'Leaf'], ['bandana', 'Bandana']],
    ropeStyle: [['classic', 'Classic'], ['glow', 'Glow'], ['dashed', 'Dashed'], ['chain', 'Chain'], ['silk', 'Silk'], ['rainbow', 'Rainbow']],
    ropeWidth: [[1.6, 'Thin'], [2.6, 'Normal'], [4, 'Thick']],
  };
  const SWATCHES = ['#ffd23f', '#ff7a1a', '#ff4fa3', '#e63946', '#a78bfa', '#6d28d9', '#4fd1ff', '#2ec4b6', '#5dffb0', '#84cc16', '#f8fafc', '#94a3b8', '#3a3a52', '#14141f'];
  const SKINS = [
    { name: 'Sunny', look: { body: '#ffd23f', body2: '#ff7a1a', pattern: 'none', patColor: '#ffffff', eyes: 'happy', hat: 'none', hatColor: '#ff4fa3', trail: '#ff9f43' },
      rope: { color: '#ffe9c7', style: 'classic', width: 2.6 } },
    { name: 'Silk Spinner', look: { body: '#6d28d9', body2: '#2e1065', pattern: 'web', patColor: '#84cc16', eyes: 'mask', hat: 'none', hatColor: '#84cc16', trail: '#84cc16' },
      rope: { color: '#f8fafc', style: 'silk', width: 1.6 } },
    { name: 'Shinobi', look: { body: '#3a3a52', body2: '#14141f', pattern: 'none', patColor: '#e63946', eyes: 'angry', hat: 'bandana', hatColor: '#e63946', trail: '#e63946' },
      rope: { color: '#94a3b8', style: 'chain', width: 2.6 } },
    { name: 'Bolt Bot', look: { body: '#cbd5e1', body2: '#64748b', pattern: 'dots', patColor: '#475569', eyes: 'big', hat: 'antenna', hatColor: '#4fd1ff', trail: '#4fd1ff' },
      rope: { color: '#4fd1ff', style: 'glow', width: 2.6 } },
    { name: 'Mochi', look: { body: '#ffb3c6', body2: '#ff4fa3', pattern: 'none', patColor: '#ffffff', eyes: 'happy', hat: 'ears', hatColor: '#ffb3c6', trail: '#ff8fab' },
      rope: { color: '#ff8fab', style: 'glow', width: 2.6 } },
    { name: 'Duke', look: { body: '#a78bfa', body2: '#5b21b6', pattern: 'stars', patColor: '#ffd23f', eyes: 'happy', hat: 'crown', hatColor: '#ffd23f', trail: '#ffd23f' },
      rope: { color: '#ffd23f', style: 'chain', width: 2.6 } },
    { name: 'Skater', look: { body: '#2ec4b6', body2: '#0f766e', pattern: 'zigzag', patColor: '#ffd23f', eyes: 'shades', hat: 'cap', hatColor: '#ff4fa3', trail: '#2ec4b6' },
      rope: { color: '#ffd23f', style: 'dashed', width: 2.6 } },
    { name: 'Blaze', look: { body: '#ff7a1a', body2: '#b91c1c', pattern: 'split', patColor: '#e63946', eyes: 'angry', hat: 'horns', hatColor: '#3a3a52', trail: '#ff4d2e' },
      rope: { color: '#ff7a1a', style: 'rainbow', width: 4 } },
    { name: 'Halo', look: { body: '#f8fafc', body2: '#a5b4fc', pattern: 'none', patColor: '#ffffff', eyes: 'sleepy', hat: 'halo', hatColor: '#ffd23f', trail: '#c7d2fe' },
      rope: { color: '#f8fafc', style: 'silk', width: 1.6 } },
    { name: 'Ribbit', look: { body: '#84cc16', body2: '#3f6212', pattern: 'dots', patColor: '#bef264', eyes: 'big', hat: 'leaf', hatColor: '#5dffb0', trail: '#84cc16' },
      rope: { color: '#bef264', style: 'classic', width: 2.6 } },
  ];
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let skinIndex = 0;                 // -1 = your own custom mix
  let look = clone(SKINS[0].look), ropeLook = clone(SKINS[0].rope);
  try {
    const saved = JSON.parse(localStorage.getItem('ropeLook') || 'null');
    if (saved && saved.look && saved.rope) { look = Object.assign(look, saved.look); ropeLook = Object.assign(ropeLook, saved.rope); skinIndex = saved.skin ?? -1; }
  } catch (e) {}
  function saveLook() { try { localStorage.setItem('ropeLook', JSON.stringify({ skin: skinIndex, look, rope: ropeLook })); } catch (e) {} }

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = (v) => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f));
    return `rgb(${c((n >> 16) & 255)}, ${c((n >> 8) & 255)}, ${c(n & 255)})`;
  }
  function starPath(g, x, y, r) {
    g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath();
  }

  // Draw a character at (x, y) with radius r. (vx, vy) is the direction it's moving.
  function drawCharacter(g, x, y, r, L, vx = 1, vy = 0, t = 0) {
    // glow
    const gl = g.createRadialGradient(x, y, 0, x, y, r * 2.6);
    gl.addColorStop(0, shade(L.trail, 0.2).replace('rgb', 'rgba').replace(')', ', 0.55)'));
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gl;
    g.beginPath(); g.arc(x, y, r * 2.6, 0, TAU); g.fill();
    // headgear that sits behind the body
    if (L.hat === 'halo') {
      g.save(); g.strokeStyle = L.hatColor; g.lineWidth = r * 0.22; g.shadowColor = L.hatColor; g.shadowBlur = r * 0.8;
      g.beginPath(); g.ellipse(x, y - r * 1.35, r * 0.75, r * 0.24, 0, 0, TAU); g.stroke(); g.restore();
    }
    if (L.hat === 'ears') {
      for (const s of [-1, 1]) {
        g.fillStyle = L.hatColor;
        g.beginPath(); g.moveTo(x + s * r * 0.95, y - r * 0.2); g.lineTo(x + s * r * 0.75, y - r * 1.35); g.lineTo(x + s * r * 0.15, y - r * 0.85); g.closePath(); g.fill();
        g.fillStyle = '#ff4fa3';
        g.beginPath(); g.moveTo(x + s * r * 0.78, y - r * 0.45); g.lineTo(x + s * r * 0.7, y - r * 1.05); g.lineTo(x + s * r * 0.35, y - r * 0.8); g.closePath(); g.fill();
      }
    }
    if (L.hat === 'horns') {
      g.fillStyle = L.hatColor;
      for (const s of [-1, 1]) {
        g.beginPath(); g.moveTo(x + s * r * 0.75, y - r * 0.55); g.quadraticCurveTo(x + s * r * 1.15, y - r * 1.3, x + s * r * 0.6, y - r * 1.55);
        g.quadraticCurveTo(x + s * r * 0.75, y - r * 1.0, x + s * r * 0.3, y - r * 0.85); g.closePath(); g.fill();
      }
    }
    // body
    const bg = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    bg.addColorStop(0, shade(L.body, 0.55));
    bg.addColorStop(0.45, L.body);
    bg.addColorStop(1, L.body2);
    g.fillStyle = bg;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    // pattern (clipped to the body)
    if (L.pattern !== 'none') {
      g.save();
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.clip();
      g.fillStyle = L.patColor; g.strokeStyle = L.patColor;
      if (L.pattern === 'stripes') {
        g.translate(x, y); g.rotate(-0.6); g.globalAlpha = 0.85;
        for (let i = -3; i <= 3; i++) g.fillRect(i * r * 0.62 - r * 0.15, -r * 1.5, r * 0.3, r * 3);
      } else if (L.pattern === 'dots') {
        g.globalAlpha = 0.85;
        for (const [dx, dy, s] of [[-0.45, -0.1, 0.2], [0.35, 0.45, 0.17], [0.5, -0.45, 0.13], [-0.15, 0.6, 0.12], [0.05, -0.65, 0.1]]) { g.beginPath(); g.arc(x + dx * r, y + dy * r, s * r, 0, TAU); g.fill(); }
      } else if (L.pattern === 'web') {
        g.lineWidth = Math.max(0.8, r * 0.07); g.globalAlpha = 0.9;
        g.beginPath();
        for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 1.1, y + Math.sin(a) * r * 1.1); }
        for (const rr of [0.35, 0.65, 0.95]) {
          for (let i = 0; i <= 8; i++) {
            const a = (i / 8) * TAU, b = ((i + 0.5) / 8) * TAU;
            const px = x + Math.cos(a) * r * rr, py = y + Math.sin(a) * r * rr;
            if (i === 0) g.moveTo(px, py); else g.quadraticCurveTo(x + Math.cos(b - TAU / 16) * r * rr * 0.8, y + Math.sin(b - TAU / 16) * r * rr * 0.8, px, py);
          }
        }
        g.stroke();
      } else if (L.pattern === 'zigzag') {
        g.lineWidth = r * 0.22; g.lineJoin = 'miter'; g.globalAlpha = 0.9;
        g.beginPath();
        for (let i = 0; i <= 6; i++) g.lineTo(x - r * 1.1 + i * r * 0.37, y + (i % 2 ? -r * 0.2 : r * 0.2));
        g.stroke();
      } else if (L.pattern === 'stars') {
        for (const [dx, dy, s] of [[-0.4, -0.25, 0.28], [0.42, 0.35, 0.22], [0.1, 0.62, 0.15]]) { starPath(g, x + dx * r, y + dy * r, s * r); g.fill(); }
      } else if (L.pattern === 'split') {
        g.globalAlpha = 0.9;
        g.beginPath(); g.moveTo(x, y - r * 1.2); g.lineTo(x - r * 1.2, y - r * 1.2); g.lineTo(x - r * 1.2, y + r * 1.2); g.lineTo(x, y + r * 1.2);
        g.quadraticCurveTo(x - r * 0.3, y, x, y - r * 1.2); g.fill();
      }
      g.restore();
    }
    // shine
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath(); g.ellipse(x - r * 0.38, y - r * 0.45, r * 0.28, r * 0.17, -0.6, 0, TAU); g.fill();
    // face, looking where it's going
    const ang = Math.atan2(vy, vx || 1);
    const fx = Math.cos(ang) * r * 0.32, fy = Math.sin(ang) * r * 0.22;
    const ex = r * 0.26, ey = -r * 0.16;
    const ink = '#1c1233';
    if (L.eyes === 'happy') {
      g.fillStyle = ink;
      g.beginPath(); g.arc(x + fx - ex, y + fy + ey, r * 0.15, 0, TAU); g.arc(x + fx + ex, y + fy + ey, r * 0.15, 0, TAU); g.fill();
    } else if (L.eyes === 'big') {
      for (const s of [-1, 1]) {
        g.fillStyle = '#fff'; g.beginPath(); g.arc(x + fx + s * ex, y + fy + ey, r * 0.27, 0, TAU); g.fill();
        g.fillStyle = ink; g.beginPath(); g.arc(x + fx + s * ex + Math.cos(ang) * r * 0.08, y + fy + ey + Math.sin(ang) * r * 0.06, r * 0.13, 0, TAU); g.fill();
      }
    } else if (L.eyes === 'shades') {
      g.fillStyle = ink;
      g.beginPath(); g.roundRect ? g.roundRect(x + fx - r * 0.62, y + fy + ey - r * 0.17, r * 1.24, r * 0.34, r * 0.14) : g.rect(x + fx - r * 0.62, y + fy + ey - r * 0.17, r * 1.24, r * 0.34); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(x + fx - r * 0.45, y + fy + ey - r * 0.1, r * 0.22, r * 0.07);
    } else if (L.eyes === 'angry') {
      g.fillStyle = ink; g.strokeStyle = ink; g.lineWidth = r * 0.12; g.lineCap = 'round';

  // Draw a rope from (x1, y1) to (x2, y2), sagging through (cx, cy).
  function drawRopeLine(g, x1, y1, cx, cy, x2, y2, RL, t = 0) {
    const w = RL.width;
    const curve = () => { g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(cx, cy, x2, y2); };
    g.save();
    g.lineCap = 'round';
    if (RL.style === 'classic') {
      g.strokeStyle = RL.color; g.lineWidth = w; g.shadowColor = 'rgba(255,159,67,0.6)'; g.shadowBlur = 6; curve(); g.stroke();
    } else if (RL.style === 'glow') {
      g.strokeStyle = RL.color; g.lineWidth = w * 1.6; g.shadowColor = RL.color; g.shadowBlur = 14; g.globalAlpha = 0.7; curve(); g.stroke();
      g.globalAlpha = 1; g.shadowBlur = 0; g.strokeStyle = '#fff'; g.lineWidth = Math.max(1, w * 0.45); curve(); g.stroke();
    } else if (RL.style === 'dashed') {
      g.strokeStyle = RL.color; g.lineWidth = w; g.setLineDash([w * 3, w * 2.2]); g.lineDashOffset = -t * 60; curve(); g.stroke();
    } else if (RL.style === 'silk') {
      g.strokeStyle = RL.color; g.lineWidth = Math.max(1, w * 0.7); g.shadowColor = RL.color; g.shadowBlur = 5; g.globalAlpha = 0.9; curve(); g.stroke();
      g.globalAlpha = 0.35; g.lineWidth = w * 2.2; g.shadowBlur = 0; curve(); g.stroke();
    } else if (RL.style === 'chain' || RL.style === 'rainbow') {
      // walk along the curve
      const pts = [];
      let len = 0, px = x1, py = y1;
      for (let i = 0; i <= 40; i++) {
        const u = i / 40, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
        const qx = a * x1 + b * cx + c * x2, qy = a * y1 + b * cy + c * y2;
        if (i) len += Math.hypot(qx - px, qy - py);
        pts.push([qx, qy, len]); px = qx; py = qy;
      }
      if (RL.style === 'rainbow') {
        g.lineWidth = w * 1.2;
        for (let i = 1; i < pts.length; i++) {
          g.strokeStyle = `hsl(${(pts[i][2] * 2.2 - t * 220) % 360}, 95%, 62%)`;
          g.beginPath(); g.moveTo(pts[i - 1][0], pts[i - 1][1]); g.lineTo(pts[i][0], pts[i][1]); g.stroke();
        }
      } else {
        const step = Math.max(4, w * 2.4);
        g.strokeStyle = RL.color; g.lineWidth = Math.max(1, w * 0.55);
        let next = 0, k = 0;
        for (let i = 1; i < pts.length; i++) {
          while (pts[i][2] >= next) {
            const f = (next - pts[i - 1][2]) / Math.max(0.001, pts[i][2] - pts[i - 1][2]);
            const lx = lerp(pts[i - 1][0], pts[i][0], f), ly = lerp(pts[i - 1][1], pts[i][1], f);
            const ang = Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]);
            g.beginPath(); g.ellipse(lx, ly, step * 0.62, k % 2 ? w * 0.4 : w * 0.9, ang, 0, TAU); g.stroke();
            next += step; k++;
          }
        }
      }
    }
    g.restore();
  }

    window.addEventListener('pointerdown', (e) => {
      if (!paused) return;
      const b = e.target.closest && e.target.closest('button');
      if (b) return;
      e.stopImmediatePropagation();
      set(false);
    }, true);
    window.addEventListener('pointermove', (e) => { if (paused) e.stopImmediatePropagation(); }, true);
    window.addEventListener('keydown', (e) => {
      const k = e.code;
      const toggleKey = k === 'KeyP' || k === 'Escape';
      if (paused) {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (!e.repeat && (toggleKey || k === 'Space' || k === 'Enter' || k === 'NumpadEnter')) set(false);
        return;
      }
      if (toggleKey && !e.repeat && cfg.isPlaying()) { e.preventDefault(); e.stopImmediatePropagation(); set(true); }
    }, true);
    // Pause automatically when you leave the tab / app
    document.addEventListener('visibilitychange', () => { if (document.hidden) set(true); });
    window.addEventListener('blur', () => set(true));
    return {
      get paused() { return paused; },
      set,
      // call once per frame: shows the button only during a round
      sync() {
        const show = cfg.isPlaying() || paused;
        if (btn.classList.contains('show') !== show) btn.classList.toggle('show', show);
        if (paused && !cfg.isPlaying()) set(false);
      },
    };
  })();

  // ---------- Start ----------
  resize();
  reset();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    Pause.sync();
    if (Pause.paused) { requestAnimationFrame(loop); return; } // frozen on the last frame
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
