<!doctype html>
<html lang="en">

<title>Chess</title>
<style>

</style>
</head>
<body>
<div id="app">
  <div class="bar" id="barT"></div>
  <div id="board"></div>
  <div class="bar" id="barB"></div>
  <div id="status"></div>
  <div id="moves"></div>
  <div id="ctl">

</div>
<div id="setup" class="ov"></div>
<div id="promo" class="ov hide"></div>

<script>

/* ====================== ENGINE ====================== */

const RK = { 62: [63, 61], 58: [56, 59], 6: [7, 5], 2: [0, 3] };
function make(m) {

}

/* ---- evaluation & search ---- */

}
let nodes = 0, deadline = Infinity, abort = false;
const order = (ms) => { for (const m of ms) { const v = b[m.t]; m.o = (v ? 1000 + 10 * VAL[v.toUpperCase()] - VAL[m.p.toUpperCase()] / 10 : m.ep ? 1050 : 0) + (m.pr ? 800 : 0); } ms.sort((x, y) => y.o - x.o); return ms; };
function qs(alpha, beta, ply) {

  for (const m of order(gen(true))) {

/* ====================== GAME ====================== */
const G = { id: 0, mode: 'ai', me: 'w', lv: 1, flip: false, moves: [], sans: [], over: null };
let set = { mode: 'ai', side: 'w', lv: 1 }, keys = [], LM = [], sel = null, hints = new Set(), hintMv = null, busy = false, mute = 0;

}
function loadMoves(list, sans) {
  resetPos(); keys = [key()]; G.moves = []; G.sans = [];
  for (const mv of list) {
    const m = legal().find((x) => x.f === mv.f && x.t === mv.t && (x.pr || '') === mv.pr); if (!m) break;
    make(m); G.moves.push(mv); keys.push(key());
  }
  G.sans = sans.slice(0, G.moves.length); LM = legal(); evalEnd();
}
function newGame() {
  initAudio(); G.id++; G.mode = set.mode; G.lv = set.lv;
  G.me = set.side === 'r' ? (Math.random() < .5 ? 'w' : 'b') : set.side; G.flip = G.mode === 'ai' && G.me === 'b';
  resetPos(); G.moves = []; G.sans = []; keys = [key()]; LM = legal(); G.over = null; sel = null; hints = new Set(); hintMv = null; busy = false;
  $('setup').classList.add('hide'); $('end').classList.add('hide'); refresh(); save(); maybeAI();
}
function play(m) {
  const s = san(m, LM); make(m);
  G.moves.push({ f: m.f, t: m.t, pr: m.pr || '' }); keys.push(key()); LM = legal();
  const chk = inCheck(); G.sans.push(s + (chk ? (LM.length ? '+' : '#') : ''));
  sel = null; hints = new Set(); hintMv = null; evalEnd();
  if (G.over) { beep(392, .15); setTimeout(() => beep(523, .15), 150); setTimeout(() => beep(659, .3), 300); }
  else if (chk) { beep(740, .1, 'square'); setTimeout(() => beep(740, .12, 'square'), 120); }
  else beep(m.cap || b[m.t] && s.includes('x') ? 200 : 330, .08, 'triangle', .09);
  refresh(); save();
  if (G.over) setTimeout(showEnd, 500); else maybeAI();
}
function maybeAI() {
  if (G.mode !== 'ai' || G.over || turn === G.me) return;
  busy = true; refresh(); const id = G.id;
  setTimeout(() => { if (id !== G.id) return; const m = think(LEVELS[G.lv]); busy = false; if (m) play(m); else refresh(); }, 80);
}
const humanTurn = () => !busy && !G.over && (G.mode === '2p' || turn === G.me);
function tap(i) {
  if (!humanTurn()) return;
  if (sel !== null) { const mv = LM.filter((m) => m.f === sel && m.t === i); if (mv.length) { choose(mv); return; } }
  const p = b[i];
  if (p && col(p) === turn) { sel = i; hints = new Set(LM.filter((m) => m.f === i).map((m) => m.t)); } else { sel = null; hints = new Set(); }
  refresh();
}
function choose(mv) {
  if (mv.length === 1) { play(mv[0]); return; }
  const c = turn;
  $('promo').innerHTML = '<div class="sb"><h2>Promote to</h2><div class="pp">' + 'QRBN'.split('').map((q) => `<button data-pr="${q}"><span class="pc ${c}">${GL[q]}</span></button>`).join('') + '</div></div>';
  $('promo').classList.remove('hide');
  $('promo')._mv = mv;
}
function undo() {
  if (busy || G.mode === '2p') return;
  let n = G.mode === 'ai' ? (turn === G.me ? 2 : 1) : 1;
  if (G.mode === 'ai') n = Math.min(n, G.moves.length - (G.me === 'b' ? 1 : 0)); else n = Math.min(n, G.moves.length);
  if (n <= 0) return;
  const ms = G.moves.slice(0, -n), ss = G.sans.slice(0, -n);
  loadMoves(ms, ss); sel = null; hints = new Set(); hintMv = null; refresh(); save();
}
function hint() {
  if (!humanTurn()) return; $('status').textContent = 'Thinking…';
  setTimeout(() => { hintMv = think({ d: 4, t: 900, n: 0 }); refresh(); }, 30);
}

/* ====================== RENDER ====================== */
const START = { P: 8, N: 2, B: 2, R: 2, Q: 1 };
function bar(c, el) {
  const cnt = {}, mat = { w: 0, b: 0 };
  for (const p of b) if (p) { cnt[p] = (cnt[p] || 0) + 1; const t = p.toUpperCase(); if (t !== 'K') mat[col(p)] += VAL[t]; }
  const e = opp(c); let caps = '';
  for (const t of 'QRBNP') { const have = cnt[e === 'w' ? t : t.toLowerCase()] || 0; for (let k = 0; k < Math.max(0, START[t] - have); k++) caps += `<span class="pc ${e}">${GL[t]}</span>`; }
  const diff = (mat[c] - mat[e]) / 100;
  const name = G.mode === 'ai' ? (c === G.me ? 'You' : 'Computer (' + LEVELS[G.lv].name + ')') : (c === 'w' ? 'White' : 'Black');
  el.className = 'bar' + (!G.over && turn === c ? ' turn' : '');
  el.innerHTML = `<span class="dot ${c}"></span><b>${name}</b><span class="cap">${caps}</span>${diff > 0 ? `<i>+${diff}</i>` : ''}`;
}
function statusText() {
  if (busy) return 'Computer is thinking…';
  const o = G.over, w = turn === 'w' ? 'White' : 'Black';
  if (o) {
    if (o.t === 'mate') return 'Checkmate! ' + (G.mode === 'ai' ? (o.w === G.me ? 'You win 🎉' : 'Computer wins') : (o.w === 'w' ? 'White' : 'Black') + ' wins');
    return { stale: 'Draw by stalemate', 50: 'Draw: 50-move rule', rep: 'Draw by repetition', insuf: 'Draw: not enough pieces' }[o.t];
  }
  const t = G.mode === 'ai' ? 'Your move' : w + ' to move';
  return inCheck() ? 'Check! ' + t : t;
}
function refresh() {
  const last = G.moves[G.moves.length - 1], chkSq = !G.over || G.over.t === 'mate' ? (inCheck() ? ks[turn] : -1) : -1;
  let h = '';
  for (let vi = 0; vi < 64; vi++) {
    const i = G.flip ? 63 - vi : vi, r = i >> 3, c = i & 7, p = b[i];
    let cls = 'sq ' + ((r + c) & 1 ? 'd' : 'l');
    if (i === sel) cls += ' sel';
    if (last && (i === last.f || i === last.t)) cls += ' last';
    if (hintMv && (i === hintMv.f || i === hintMv.t)) cls += ' hint';
    if (i === chkSq) cls += ' chk';
    if (hints.has(i)) cls += p || (sel !== null && b[sel] && b[sel].toUpperCase() === 'P' && (sel & 7) !== c) ? ' cap2' : ' dot2';
    h += `<div class="${cls}" data-i="${i}">` + ((vi & 7) === 0 ? `<span class="co r">${8 - r}</span>` : '') + (vi >> 3 === 7 ? `<span class="co f">${FILES[c]}</span>` : '') +
      (p ? `<span class="pc ${col(p)}">${GL[p.toUpperCase()]}</span>` : '') + '</div>';
  }
  $('board').innerHTML = h;
  const bot = G.flip ? 'b' : 'w'; bar(opp(bot), $('barT')); bar(bot, $('barB'));
  $('status').textContent = statusText();
  let mh = ''; G.sans.forEach((s, i) => { if (i % 2 === 0) mh += `<span class="n">${i / 2 + 1}.</span>`; mh += `<span class="m">${s}</span>`; });
  $('moves').innerHTML = mh || '<span class="n">Moves will appear here</span>'; $('moves').scrollLeft = 1e5;
  $('bUndo').style.display = G.mode === '2p' ? 'none' : ''; $('bUndo').disabled = busy || !G.moves.length; $('bHint').disabled = !humanTurn();
  $('bSnd').textContent = mute ? '🔇' : '🔊';
}
function showEnd() {
  if (!G.over) return;
  $('end').innerHTML = `<div class="sb"><h2>${statusText()}</h2><button class="go" data-a="rematch">PLAY AGAIN</button><button class="go alt" data-a="new">NEW GAME…</button><button class="go alt" data-a="close">VIEW BOARD</button></div>`;
  $('end').classList.remove('hide');
}
function renderSetup() {
  const card = (k, v, ic, n, sm) => `<button class="card${String(set[k]) === String(v) ? ' sel' : ''}" data-k="${k}" data-v="${v}"><i>${ic}</i><b>${n}</b><small>${sm}</small></button>`;
  $('setup').innerHTML = '<div class="sb"><div class="mh"><div class="logo"><span>♞</span> CHESS</div><button class="hbtn" data-a="how">❓ How to play</button></div>' +
    '<h3>Mode</h3><div class="row c2">' + card('mode', 'ai', '🤖', 'vs Computer', 'Play the AI') + card('mode', '2p', '👥', '2 Players', 'Pass and play') + '</div>' +
    (set.mode === 'ai' ? '<h3>Play as</h3><div class="row c3">' + card('side', 'w', '⚪', 'White', 'Move first') + card('side', 'r', '🎲', 'Random', 'Surprise me') + card('side', 'b', '⚫', 'Black', 'Move second') + '</div>' +
      '<h3>Difficulty</h3><div class="row c3">' + card('lv', 0, '🌱', 'Easy', 'Relaxed') + card('lv', 1, '⚔️', 'Medium', 'A fair fight') + card('lv', 2, '🧠', 'Hard', 'Thinks deeper') + '</div>' : '') +
    '<button class="go" data-a="start">START ▶</button>' + (G.moves.length && !G.over ? '<button class="go alt" data-a="resume">RESUME GAME</button>' : '') + '</div>';
}
let howStart = false, tutSeen = 0;
function openHow(start) {
  howStart = start;
  $('how').innerHTML = '<div class="sb"><h2>♞ How to play</h2><div class="tx">' +
    '<div><i>🎯</i><span><b>Goal:</b> checkmate the enemy king. Attack it so it has no safe square left.</span></div>' +
    '<div><i>🖱️</i><span><b>PC:</b> click a piece, then click a highlighted square. You can also drag and drop.</span></div>' +
    '<div><i>📱</i><span><b>Mobile:</b> tap a piece, then tap where it should go. <b>Green dots</b> are moves, <b>red rings</b> are captures.</span></div>' +
    '<div><i>✨</i><span><b>Special moves:</b> castle by moving the king two squares toward a rook. En passant is automatic, and a pawn that reaches the end lets you pick a new piece.</span></div>' +
    '<div><i>🛟</i><span><b>Buttons:</b> <b>Undo</b> (vs computer) takes back your move, <b>Hint</b> shows a good move, <b>Flip</b> turns the board around.</span></div>' +
    '<div><i>🤝</i><span><b>Draws:</b> stalemate, repeating the same position three times, 50 moves without a capture or pawn move, or too few pieces left to mate.</span></div>' +
    '</div><button class="go" data-a="howgo">' + (start ? "LET'S PLAY ▶" : 'GOT IT') + '</button></div>';
  $('how').classList.remove('hide');
}
function closeHow() { tutSeen = 1; save(); $('how').classList.add('hide'); if (howStart) { howStart = false; newGame(); } }

/* ====================== SAVE / AUDIO / INPUT ====================== */
function save() { try { localStorage.setItem(KEY, JSON.stringify({ set, mute, tut: tutSeen, g: { mode: G.mode, me: G.me, lv: G.lv, flip: G.flip, moves: G.moves, sans: G.sans } })); } catch (e) {} }
let AC = null;
function initAudio() { if (AC) { if (AC.state === 'suspended') AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function beep(f, d = .1, type = 'sine', v = .07) {
  if (!AC || mute) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(t + d);
}
let dragFrom = null;
const sqAt = (e) => { const el = document.elementFromPoint(e.clientX, e.clientY), s = el && el.closest && el.closest('.sq'); return s ? +s.dataset.i : null; };
$('board').addEventListener('pointerdown', (e) => {
  initAudio(); const s = e.target.closest('.sq'); if (!s) return; tap(+s.dataset.i);
  dragFrom = sel !== null && sel === +s.dataset.i ? sel : null;
});
window.addEventListener('pointerup', (e) => {
  if (dragFrom === null) return; const f = dragFrom, t = sqAt(e); dragFrom = null;
  if (t !== null && t !== f && sel === f) tap(t);
});
document.addEventListener('click', (e) => {
  initAudio();
  const pr = e.target.closest('[data-pr]');
  if (pr) { const mv = $('promo')._mv.find((m) => m.pr.toUpperCase() === pr.dataset.pr); $('promo').classList.add('hide'); if (mv) play(mv); return; }
  const kb = e.target.closest('[data-k]');
  if (kb) { set[kb.dataset.k] = kb.dataset.k === 'lv' ? +kb.dataset.v : kb.dataset.v; renderSetup(); return; }
  if (e.target.closest('#bSnd')) { mute = mute ? 0 : 1; save(); refresh(); return; }
  const a = e.target.closest('[data-a]'); if (!a) return;
  switch (a.dataset.a) {
    case 'start': if (tutSeen) newGame(); else openHow(true); break;
    case 'how': openHow(false); break;
    case 'howgo': closeHow(); break;
    case 'rematch': newGame(); break;
    case 'resume': $('setup').classList.add('hide'); break;
    case 'new': $('end').classList.add('hide'); renderSetup(); $('setup').classList.remove('hide'); break;
    case 'close': $('end').classList.add('hide'); break;
    case 'undo': undo(); break;
    case 'hint': hint(); break;
    case 'flip': G.flip = !G.flip; refresh(); save(); break;
  }
});

/* ====================== INIT ====================== */
try {
  const o = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (o) { set = Object.assign(set, o.set); mute = o.mute ? 1 : 0; tutSeen = o.tut ? 1 : 0;
    if (o.g && o.g.moves && o.g.moves.length) { Object.assign(G, { mode: o.g.mode, me: o.g.me, lv: o.g.lv, flip: o.g.flip }); loadMoves(o.g.moves, o.g.sans || []); } }
} catch (e) { resetPos(); }
if (!keys.length) { resetPos(); keys = [key()]; LM = legal(); }
refresh(); renderSetup();
if (G.moves.length && !G.over) { $('setup').classList.add('hide'); maybeAI(); }
window._chess = { legal: () => legal(), get b() { return b; }, G, get turn() { return turn; }, think, play, set, newGame, perft: (d) => { const f = (n) => { if (!n) return 1; let t = 0; for (const m of legal()) { const u = make(m); t += f(n - 1); unmake(u); } return t; }; return f(d); } };
})();
</script>
