<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Bottle Flip</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0f1020; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  html, body { touch-action: none; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Game state ----------
  const FLIP_DURATION = 0.9;      // seconds the bottle is in the air
  const START_SPEED = 0.8;        // bar widths per second
  const START_ZONE = 0.24;        // yellow zone width (fraction of bar)
  const MIN_ZONE = 0.07;

  let best = 0;
  try { best = Number(localStorage.getItem('bottleFlipBest')) || 0; } catch (e) {}

  const s = {
    mode: 'aim',          // aim | flipping | landed
    p: 0, dir: 1,         // thin line position (0..1) and direction
    speed: START_SPEED,
    zoneC: 0.5, zoneW: START_ZONE,
    flipT: 0, success: false, failAngle: 0,
    resultT: 0,
    score: 0,
    msg: 'Tap to flip!', msgColor: '#e8e8f5', msgT: 0,
  };

  function newZone() {
    const half = s.zoneW / 2;
    s.zoneC = half + Math.random() * (1 - s.zoneW);
  }

  function resetGame() {
    s.score = 0;
    s.speed = START_SPEED;
    s.zoneW = START_ZONE;
    newZone();
  }

  function tap() {
    if (s.mode !== 'aim') return;
    const dist = Math.abs(s.p - s.zoneC);
    s.success = dist <= s.zoneW / 2;
    s.perfect = s.success && dist <= s.zoneW * 0.12;
    // A miss over- or under-rotates and lands on its side.
    s.failAngle = Math.random() < 0.5 ? Math.PI * 1.5 : Math.PI * 2.5;
    s.mode = 'flipping';
    s.flipT = 0;
    s.msg = '';
  }

  window.addEventListener('pointerdown', (e) => { e.preventDefault(); tap(); });
  window.addEventListener('keydown', (e) => {
    const isFlipKey = e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space';
    if (!isFlipKey) return;
    e.preventDefault();
    if (!e.repeat) tap();   // holding the key down doesn't spam flips
  });
  window.focus();

  function update(dt) {
    if (s.mode === 'aim') {
      s.p += s.dir * s.speed * dt;
      if (s.p > 1) { s.p = 1; s.dir = -1; }
      if (s.p < 0) { s.p = 0; s.dir = 1; }
    } else if (s.mode === 'flipping') {
      s.flipT += dt / FLIP_DURATION;
      if (s.flipT >= 1) {
        s.flipT = 1;
        s.mode = 'landed';
        s.resultT = 0;
        if (s.success) {
          s.score += s.perfect ? 2 : 1;
          if (s.score > best) {
            best = s.score;
            try { localStorage.setItem('bottleFlipBest', best); } catch (e) {}
          }
          s.msg = s.perfect ? 'PERFECT! +2' : 'Nice flip!';
          s.msgColor = s.perfect ? '#ffd23f' : '#4fd1ff';
        } else {
          s.msg = 'Missed!';
          s.msgColor = '#ff4fa3';
        }
        s.msgT = 0;
      }
    } else if (s.mode === 'landed') {
      s.resultT += dt;
      if (s.success && s.resultT > 0.45) {
        // Harder each round: faster line, smaller zone.
        s.speed = Math.min(s.speed * 1.08, 3);
        s.zoneW = Math.max(s.zoneW * 0.93, MIN_ZONE);
        newZone();
        s.mode = 'aim';
      } else if (!s.success && s.resultT > 1.2) {
        resetGame();
        s.msg = 'Tap to flip!';
        s.msgColor = '#e8e8f5';
        s.mode = 'aim';
      }
    }
    s.msgT += dt;
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Bottle drawn centered on (0,0), height bh, width bw.
  function drawBottle(bh, bw) {
    const top = -bh / 2, bottom = bh / 2;
    const neckW = bw * 0.4, neckH = bh * 0.16, capH = bh * 0.07;
    const shoulder = bh * 0.12;
    const bodyTop = top + capH + neckH + shoulder;

    // Bottle outline path
    ctx.beginPath();
    ctx.moveTo(-neckW / 2, top + capH);
    ctx.lineTo(-neckW / 2, top + capH + neckH);
    ctx.quadraticCurveTo(-bw / 2, top + capH + neckH, -bw / 2, bodyTop);
    ctx.lineTo(-bw / 2, bottom - 8);
    ctx.quadraticCurveTo(-bw / 2, bottom, -bw / 2 + 8, bottom);
    ctx.lineTo(bw / 2 - 8, bottom);
    ctx.quadraticCurveTo(bw / 2, bottom, bw / 2, bottom - 8);
    ctx.lineTo(bw / 2, bodyTop);
    ctx.quadraticCurveTo(bw / 2, top + capH + neckH, neckW / 2, top + capH + neckH);
    ctx.lineTo(neckW / 2, top + capH);
    ctx.closePath();

    // Glass
    ctx.fillStyle = 'rgba(180, 225, 255, 0.18)';
    ctx.fill();

    // Water (lower part of bottle)
    ctx.save();
    ctx.clip();
    const waterTop = bottom - bh * 0.42;
    const g = ctx.createLinearGradient(0, waterTop, 0, bottom);
    g.addColorStop(0, '#5fc8ff');
    g.addColorStop(1, '#2a7fd6');
    ctx.fillStyle = g;
    ctx.fillRect(-bw, waterTop, bw * 2, bh);
    // Label
    ctx.fillStyle = '#ff4fa3';
    ctx.fillRect(-bw, bodyTop + bh * 0.12, bw * 2, bh * 0.18);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = `bold ${Math.round(bw * 0.24)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FLIP', 0, bodyTop + bh * 0.21);
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-bw / 2 + bw * 0.12, bodyTop, bw * 0.1, bh * 0.6);
    ctx.restore();

    // Outline
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = 'rgba(220, 240, 255, 0.85)';
    ctx.stroke();

    // Cap
    ctx.fillStyle = '#4fd1ff';
    roundRect(-neckW / 2 - 2, top, neckW + 4, capH + 2, 3);
    ctx.fill();
  }

  const ease = (t) => 1 - Math.pow(1 - t, 2);

  function draw() {
    ctx.fillStyle = '#0f1020';
    ctx.fillRect(0, 0, W, H);

    const bh = Math.min(H * 0.26, 190);
    const bw = bh * 0.38;
    const tableY = H * 0.62;
    const cx = W / 2;

    // Table
    ctx.fillStyle = '#2a2c55';
    ctx.fillRect(0, tableY, W, 6);
    ctx.fillStyle = '#1a1b33';
    ctx.fillRect(0, tableY + 6, W, H - tableY);

    // Bottle pose
    const uprightY = tableY - bh / 2;
    const sideY = tableY - bw / 2;
    let x = cx, y = uprightY, angle = 0, sx = 1, sy = 1;

    if (s.mode === 'flipping') {
      const t = s.flipT;
      const jump = 4 * t * (1 - t) * H * 0.33;
      if (s.success) {
        angle = Math.PI * 2 * ease(t);
        y = uprightY - jump;
      } else {
        angle = s.failAngle * ease(t);
        y = uprightY + (sideY - uprightY) * t * t * t - jump;
      }
    } else if (s.mode === 'landed') {
      if (s.success) {
        // little squash on landing
        const k = Math.min(s.resultT / 0.25, 1);
        const squash = Math.sin(Math.PI * k) * 0.08;
        sy = 1 - squash; sx = 1 + squash;
        y = tableY - (bh * sy) / 2;
      } else {
        angle = s.failAngle;
        y = sideY;
        // roll a little after falling over
        const roll = Math.min(s.resultT / 0.5, 1);
        x = cx + (s.failAngle < Math.PI * 2 ? -1 : 1) * 30 * ease(roll);
      }
    }

    // Shadow
    const air = Math.max(0, (uprightY - y) / (H * 0.33));
    ctx.fillStyle = `rgba(0,0,0,${0.35 * (1 - air * 0.7)})`;
    ctx.beginPath();
    ctx.ellipse(x, tableY + 3, bw * (0.8 - air * 0.4), 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(sx, sy);
    drawBottle(bh, bw);
    ctx.restore();

    // ---------- Timing bar ----------
    const barW = Math.min(W * 0.88, 440);
    const barH = W < 400 ? 34 : 38;
    const barX = (W - barW) / 2;
    const barY = tableY + Math.min((H - tableY) * 0.42, 110);

    roundRect(barX, barY, barW, barH, 10);
    ctx.fillStyle = '#0b0c1a';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#333566';
    ctx.stroke();

    // Thick yellow zone
    const zx = barX + (s.zoneC - s.zoneW / 2) * barW;
    const zw = s.zoneW * barW;
    ctx.fillStyle = '#ffd23f';
    roundRect(zx, barY + 5, zw, barH - 10, 5);
    ctx.fill();

    // Thin moving line
    const lx = barX + s.p * barW;
    const inZone = Math.abs(s.p - s.zoneC) <= s.zoneW / 2;
    ctx.fillStyle = inZone ? '#ffffff' : '#ff4fa3';
    ctx.fillRect(lx - 1.5, barY - 8, 3, barH + 16);

    // Hint under bar
    ctx.fillStyle = '#9a9bc0';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const hint = isTouch
      ? 'Tap when the line is inside the yellow zone'
      : 'Click or press ENTER when the line is inside the yellow zone';
    // Shrink the hint text to fit narrow phone screens.
    let fontSize = 14;
    ctx.font = fontSize + 'px system-ui, sans-serif';
    const maxW = W - 32;
    const textW = ctx.measureText(hint).width;
    if (textW > maxW) {
      fontSize = Math.max(10, Math.floor(fontSize * maxW / textW));
      ctx.font = fontSize + 'px system-ui, sans-serif';
    }
    ctx.fillText(hint, W / 2, barY + barH + 16);

    // ---------- HUD ----------
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e8e8f5';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText(s.score, 20, 18);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = '#9a9bc0';
    ctx.fillText('BEST ' + best, 20, 52);

    // Feedback message
    if (s.msg) {
      const pop = Math.min(s.msgT / 0.15, 1);
      ctx.save();
      ctx.translate(W / 2, Math.max(H * 0.16, 70));
      ctx.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = s.msgColor;
      ctx.font = `bold ${W < 400 ? 28 : 34}px system-ui, sans-serif`;
      ctx.fillText(s.msg, 0, 0);
      ctx.restore();
    }
  }

  // ---------- Loop ----------
  newZone();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
