<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Bottle Flip</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1a1438;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  #sound, #theme {
    position: fixed; top: 12px; right: 12px; width: 42px; height: 42px;
    border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(10, 8, 30, 0.45); color: #fff; font-size: 18px; cursor: pointer; z-index: 5;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #theme { right: 62px; }

  /* Start menu */
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #fff;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(16, 10, 40, 0.35), rgba(16, 10, 40, 0.82));
    transition: opacity 0.35s;
  }
  .overlay.hidden { opacity: 0; }
  h1 { margin: 0; font-size: clamp(44px, 13vw, 90px); line-height: 0.9; font-weight: 900; letter-spacing: -0.02em; }
  h1 .a { color: #fff; text-shadow: 0 0 18px rgba(143, 224, 255, 0.75); }
  h1 .b {
    background: linear-gradient(90deg, #ffd400, #ff9a00, #e8321a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(255, 154, 0, 0.5));
  }
  .sub { margin: 18px 0 0; color: #d4cdf2; font-size: 15px; max-width: 340px; line-height: 1.5; }
  .cta {
    margin-top: 28px; padding: 13px 28px; border-radius: 999px;
    font-weight: 800; letter-spacing: 0.14em; font-size: 14px; color: #fff;
    background: linear-gradient(90deg, #ff9a00, #e8321a);
    box-shadow: 0 0 30px rgba(255, 154, 0, 0.45);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 46px rgba(255, 154, 0, 0.7); } }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 28px; font-size: 13px; color: #d4cdf2; }
  .legend b { font-weight: 800; }
  .overlay.hidden { visibility: hidden; transition: opacity 0.35s, visibility 0s linear 0.35s; }
  .overlay.hidden * { pointer-events: none !important; }
  /* Skin picker */
  .skinSel { pointer-events: auto; margin-top: 22px; display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 20px; background: rgba(16, 10, 40, 0.55); border: 1px solid rgba(255, 255, 255, 0.16); }
  .skArrow { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.08);
    color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 0 0 3px; font-family: inherit; }
  .skArrow:active { transform: scale(0.92); }
  .skMid { display: flex; align-items: center; gap: 8px; min-width: 150px; }
  #skCv { width: 44px; height: 64px; }
  .skText { text-align: left; }
  .skLab { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; color: #a99fd6; }
  .skName { font-size: 16px; font-weight: 900; }
  .skNum { font-size: 11px; color: #a99fd6; }
  button.cta { pointer-events: auto; cursor: pointer; border: 0; font-family: inherit; line-height: normal; }
  button.cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="theme" type="button" aria-label="Switch day / night">☀️</button>
<button id="sound" type="button" aria-label="Toggle sound">🔊</button>
<div class="overlay" id="menu">
  <h1><span class="a">BOTTLE</span><br /><span class="b">FLIP</span></h1>
  <p class="sub" id="howto"></p>
  <button type="button" class="cta" id="startCta">TAP TO START</button>
  <div class="skinSel">
    <button class="skArrow" id="skPrev" type="button" aria-label="Previous skin">‹</button>
    <div class="skMid"><canvas id="skCv"></canvas><div class="skText"><div class="skLab">BOTTLE</div><div class="skName" id="skName"></div><div class="skNum" id="skNum"></div></div></div>
    <button class="skArrow" id="skNext" type="button" aria-label="Next skin">›</button>
  </div>
  <div class="legend">
    <span><b style="color:#e8321a">Perfect</b> +3</span>
    <span><b style="color:#ff9a00">Great</b> +2</span>
    <span><b style="color:#ffd400">Good</b> +1</span>
  </div>
</div>
<script>
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const wrapAngle = (a) => (((a + Math.PI) % TAU) + TAU) % TAU - Math.PI;
  const isTouch = window.matchMedia('(pointer: coarse)').matches;

  const menu = document.getElementById('menu');
  let started = false;
  document.getElementById('startCta').textContent = (isTouch ? 'TAP' : 'CLICK') + ' TO START';
  document.getElementById('howto').textContent = (isTouch ? 'Tap' : 'Click or press Space')
    + ' when the line is inside the zone to flip the bottle. Hit the red center to land a perfect flip!';

  const canvas = document.getElementById('c');
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;
  let W = 0, H = 0, dpr = 1;
  let bgNight = null, bgDay = null;

  // Day / night: starts from your clock (6am–6pm = day) unless you've picked one.
  let isDay = (() => {
    try {
      const saved = localStorage.getItem('bottleFlipTheme');
      if (saved) return saved === 'day';
    } catch (e) {}
    const h = new Date().getHours();
    return h >= 6 && h < 18;
  })();
  let dayMix = isDay ? 1 : 0; // 0 = night, 1 = day (fades between them)
  const G = {}; // layout values that depend on screen size

  // ---------- Tuning ----------
  const FLIP_TIME = 0.95;   // seconds in the air
  const START_SPEED = 0.8;  // bar widths per second
  const START_ZONE = 0.24;  // yellow zone width (fraction of bar)
  const MIN_ZONE = 0.07;
  const FILL = 0.42;        // how full the bottle is
  // Scoring layers inside the zone, from the center outwards.
  // size = how much of the zone's width the layer reaches (1 = the whole zone).
  // wobble = how crooked the bottle lands (bigger = more wobble, still stays up).
  const TIERS = [
    { name: 'PERFECT!', size: 0.2, points: 3, color: '#e8321a', wobble: 0 },  // red
    { name: 'GREAT!', size: 0.55, points: 2, color: '#ff9a00', wobble: 0.08 }, // orange
    { name: 'GOOD', size: 1, points: 1, color: '#ffd400', wobble: 0.17 },      // yellow
  ];
  const LIQUIDS = [
    { name: 'Water', top: '#8fe0ff', bottom: '#2a7fd6' },
    { name: 'Orange soda', top: '#ffc46b', bottom: '#ff7a1a' },
    { name: 'Lime soda', top: '#c4ff8a', bottom: '#33b04a' },
    { name: 'Grape juice', top: '#d9a6ff', bottom: '#7a2fd6' },
    { name: 'Cola', top: '#d08a55', bottom: '#4f230f' },
  ];

  // ---------- Bottle skins ----------
  // Only the looks change (glass, cap, label, outline); the bottle flips exactly the same.
  const SKINS = [
    { name: 'Classic', glass: 'rgba(180, 225, 255, 0.16)', cap: '#4fd1ff', label: '#ff4fa3', text: 'FLIP', textColor: 'rgba(255,255,255,0.9)' },
    { name: 'Sunset', glass: 'rgba(255, 190, 140, 0.2)', cap: '#ffd400', label: '#ff7a1a', pattern: 'stripes', pat: '#ff4fa3', text: 'SUN', textColor: '#fff7d6' },
    { name: 'Mint', glass: 'rgba(170, 255, 220, 0.2)', cap: '#f8fafc', label: '#2ec4b6', pattern: 'dots', pat: '#ccfbf1', text: 'MINT', textColor: '#ffffff' },
    { name: 'Galaxy', glass: 'rgba(120, 90, 220, 0.24)', cap: '#a78bfa', label: '#140c33', pattern: 'stars', pat: '#ffd23f', text: 'COSMO', textColor: '#c4b5fd', outline: '#a78bfa', glow: '#a78bfa' },
    { name: 'Gold Rush', glass: 'rgba(255, 215, 110, 0.22)', cap: '#ffd23f', label: '#1c1917', pattern: 'band', pat: '#ffd23f', text: 'GOLD', textColor: '#ffd23f', outline: '#fbbf24', shine: 0.4 },
    { name: 'Candy', glass: 'rgba(255, 170, 210, 0.22)', cap: '#ff4fa3', label: '#fff1f7', pattern: 'swirl', pat: '#ff4fa3', text: 'SWEET', textColor: '#e11d74' },
    { name: 'Neon', glass: 'rgba(20, 30, 40, 0.35)', cap: '#5dffb0', label: 'none', text: 'NEON', textColor: '#5dffb0', outline: '#5dffb0', glow: '#5dffb0', textGlow: true },
    { name: 'Sport', glass: 'rgba(150, 200, 255, 0.2)', cap: '#e63946', capTall: true, label: '#f8fafc', pattern: 'band', pat: '#e63946', text: 'GO!', textColor: '#1d3557' },
    { name: 'Camo', glass: 'rgba(160, 180, 110, 0.24)', cap: '#3f6212', label: '#65a30d', pattern: 'camo', pat: '#365314', text: 'WILD', textColor: '#ecfccb' },
    { name: 'Rainbow', glass: 'rgba(255, 255, 255, 0.18)', cap: 'rainbow', label: 'rainbow', text: 'WOW', textColor: '#ffffff' },
  ];
  let skinIndex = 0;
  try { const v = Number(localStorage.getItem('bottleSkin')); if (v >= 0 && v < SKINS.length) skinIndex = v; } catch (e) {}
  const skin = () => SKINS[skinIndex];

  // ---------- Sound (tiny synth, no files needed) ----------
  let actx = null;
  let muted = false;
  try { muted = localStorage.getItem('bottleFlipMuted') === '1'; } catch (e) {}
  function initAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, endFreq, dur, type = 'sine', vol = 0.15, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    flip: () => tone(240, 640, 0.25, 'triangle', 0.07),
    land: () => tone(150, 55, 0.16, 'sine', 0.28),
    tick: () => tone(260, 140, 0.06, 'sine', 0.08),
    win: () => { tone(660, 660, 0.12, 'triangle', 0.1); tone(990, 990, 0.18, 'triangle', 0.1, 0.1); },
    good: () => tone(660, 700, 0.15, 'triangle', 0.09),
    perfect: () => [660, 830, 990, 1320].forEach((f, i) => tone(f, f, 0.15, 'triangle', 0.09, i * 0.07)),
    fail: () => tone(190, 70, 0.4, 'square', 0.05),
  };

  // ---------- State ----------
  let best = 0;
  try { best = Number(localStorage.getItem('bottleFlipBest')) || 0; } catch (e) {}

  const s = {
    mode: 'aim',            // aim | flight | settle | result
    p: 0, dir: 1,           // thin line position (0..1) and direction
    speed: START_SPEED,
    zoneC: 0.5, zoneW: START_ZONE,
    score: 0, liquid: 0,
    success: false, perfect: false,
    // bottle pose
    x: 0, y: 0, angle: 0, angVel: 0,
    flight: null,
    phi: 0, phiV: 0,        // tilt while rocking / tipping over on the table
    resultT: 0, fade: 1,
    // liquid
    wa: 0, waV: 0,          // world angle of the liquid surface (0 = level)
    waveA: 0, wavePhase: 0,
    lq: { ux: 0, uy: -1, level: 0 },
    // text
    msg: 'Tap to flip!', msgColor: '#ffffff', msgPts: '', msgFade: false, sub: '', msgT: 0,
  };
  let particles = [];
  let bubbles = [];

  // ---------- Bottle geometry ----------
  function dims(bh, bw) {
    const top = -bh / 2, bottom = bh / 2;
    const neckW = bw * 0.4, neckH = bh * 0.16, capH = bh * 0.07, shoulder = bh * 0.12;
    return { top, bottom, neckW, neckH, capH, bodyTop: top + capH + neckH + shoulder };
  }
  // Simple polygon of the inside of the bottle, used to work out the water level.
  function bottlePolygon(bh, bw) {
    const d = dims(bh, bw);
    return [
      [-d.neckW / 2, d.top + d.capH], [-d.neckW / 2, d.top + d.capH + d.neckH],
      [-bw / 2, d.bodyTop], [-bw / 2, d.bottom], [bw / 2, d.bottom], [bw / 2, d.bodyTop],
      [d.neckW / 2, d.top + d.capH + d.neckH], [d.neckW / 2, d.top + d.capH],
    ];
  }
  function polyArea(p) {
    let a = 0;
    for (let i = 0; i < p.length; i++) {
      const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length];
      a += x1 * y2 - x2 * y1;
    }
    return Math.abs(a) / 2;
  }
  // Keep the part of the polygon below the surface line (p · up <= d).
  function clipBelow(poly, ux, uy, d) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const A = poly[i], B = poly[(i + 1) % poly.length];
      const da = A[0] * ux + A[1] * uy - d;
      const db = B[0] * ux + B[1] * uy - d;
      if (da <= 0) out.push(A);
      if ((da <= 0) !== (db <= 0)) {
        const t = da / (da - db);
        out.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]);
      }
    }
    return out;
  }
  // Find where the surface sits so the liquid keeps the same volume at any tilt.
  function waterLevel(ux, uy) {
    let lo = Infinity, hi = -Infinity;
    for (const [x, y] of G.poly) {
      const v = x * ux + y * uy;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    const target = FILL * G.polyArea;
    for (let i = 0; i < 18; i++) {
      const mid = (lo + hi) / 2;
      if (polyArea(clipBelow(G.poly, ux, uy, mid)) < target) lo = mid;
      else hi = mid;
    }
    return (lo + hi) / 2;
  }

  function layout() {
    G.bh = Math.max(110, Math.min(H * 0.26, 190));
    G.bw = G.bh * 0.38;
    G.tableY = Math.round(H * 0.62);
    G.cx = W / 2;
    G.L = Math.hypot(G.bw / 2, G.bh / 2);      // corner to center distance
    G.beta = Math.atan2(G.bw / 2, G.bh / 2);   // tip-over angle
    G.jump = H * 0.33;
    G.g = (8 * G.jump) / (FLIP_TIME * FLIP_TIME); // gravity that matches the jump
    G.poly = bottlePolygon(G.bh, G.bw);
    G.polyArea = polyArea(G.poly);
  }

  // Bottle standing on one bottom corner, tilted by phi.
  function poseFromPhi(phi) {
    const side = phi >= 0 ? 1 : -1;
    const px = G.cx + side * G.bw / 2, py = G.tableY;
    const vx = -side * G.bw / 2, vy = -G.bh / 2;
    const c = Math.cos(phi), sn = Math.sin(phi);
    return { x: px + vx * c - vy * sn, y: py + vx * sn + vy * c };
  }

  function resetBottle() {
    s.x = G.cx; s.y = G.tableY - G.bh / 2;
    s.angle = 0; s.angVel = 0; s.phi = 0; s.phiV = 0;
    s.wa = 0; s.waV = 0; s.waveA = G.bw * 0.04;
    bubbles = [];
  }

  // ---------- Background (drawn once per resize) ----------
  // Builds the room for night (day = false) or daytime (day = true).
  function buildBackground(day) {
    const c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const tY = G.tableY;

    // Wall
    const wall = g.createLinearGradient(0, 0, 0, tY);
    wall.addColorStop(0, day ? '#f6e7cf' : '#15102e');
    wall.addColorStop(1, day ? '#e6caa3' : '#34265c');
    g.fillStyle = wall;
    g.fillRect(0, 0, W, tY);
    g.fillStyle = day ? 'rgba(160,110,60,0.06)' : 'rgba(255,255,255,0.025)';
    for (let x = 0; x < W; x += 44) g.fillRect(x, 0, 22, tY);

    // Window with a night city
    const narrow = W < 560;
    const ww = narrow ? Math.min(W * 0.42, 200) : Math.min(W * 0.28, 300);
    const wh = Math.min(tY * 0.48, ww * 0.85);
    const wx = W - ww - (narrow ? 16 : W * 0.07);
    const wy = Math.max(66, tY * 0.1);
    const sky = g.createLinearGradient(0, wy, 0, wy + wh);
    sky.addColorStop(0, day ? '#5fb8ff' : '#060a24');
    sky.addColorStop(1, day ? '#cdeeff' : '#2e2572');
    g.fillStyle = sky;
    g.fillRect(wx, wy, ww, wh);
    g.save();
    g.beginPath(); g.rect(wx, wy, ww, wh); g.clip();
    const mx = wx + ww * 0.72, my = wy + wh * 0.3, mr = ww * 0.09;
    if (day) {
      // Sun + fluffy clouds
      const sunGlow = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 5);
      sunGlow.addColorStop(0, 'rgba(255,245,180,0.75)');
      sunGlow.addColorStop(1, 'rgba(255,245,180,0)');
      g.fillStyle = sunGlow;
      g.fillRect(wx, wy, ww, wh);
      g.fillStyle = '#fff6b0';
      g.beginPath(); g.arc(mx, my, mr * 1.1, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.92)';
      for (let i = 0; i < 3; i++) {
        const cx = wx + ww * (0.15 + i * 0.32), cy = wy + wh * (0.18 + (i % 2) * 0.17), cr = ww * 0.06;
        g.beginPath();
        g.ellipse(cx, cy, cr * 1.6, cr * 0.8, 0, 0, TAU);
        g.ellipse(cx + cr, cy - cr * 0.4, cr * 1.1, cr * 0.8, 0, 0, TAU);
        g.ellipse(cx - cr, cy - cr * 0.2, cr, cr * 0.7, 0, 0, TAU);
        g.fill();
      }
    } else {
      // Stars + moon
      for (let i = 0; i < 40; i++) {
        g.fillStyle = `rgba(255,255,255,${rand(0.3, 0.9)})`;
        g.fillRect(wx + Math.random() * ww, wy + Math.random() * wh * 0.6, 1.3, 1.3);
      }
      const moonGlow = g.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
      moonGlow.addColorStop(0, 'rgba(255,240,200,0.35)');
      moonGlow.addColorStop(1, 'rgba(255,240,200,0)');
      g.fillStyle = moonGlow;
      g.fillRect(wx, wy, ww, wh);
      g.fillStyle = '#fff3d1';
      g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
      g.fillStyle = 'rgba(200,180,140,0.35)';
      g.beginPath(); g.arc(mx - mr * 0.3, my - mr * 0.2, mr * 0.22, 0, TAU); g.fill();
      g.beginPath(); g.arc(mx + mr * 0.35, my + mr * 0.3, mr * 0.15, 0, TAU); g.fill();
    }
    // City skyline: dark with lit windows at night, blue-grey with glinting glass by day
    let bx = wx;
    while (bx < wx + ww) {
      const bwid = rand(ww * 0.08, ww * 0.18), bht = rand(wh * 0.2, wh * 0.55);
      g.fillStyle = day ? (Math.random() < 0.5 ? '#8aa0c4' : '#9fb3d3') : '#0b0a22';
      g.fillRect(bx, wy + wh - bht, bwid, bht);
      g.fillStyle = day ? 'rgba(230,245,255,0.75)' : 'rgba(255,214,120,0.8)';
      for (let yy = wy + wh - bht + 6; yy < wy + wh - 4; yy += 8)
        for (let xx = bx + 3; xx < bx + bwid - 4; xx += 7)
          if (Math.random() < (day ? 0.5 : 0.3)) g.fillRect(xx, yy, 3, 4);
      bx += bwid + rand(1, 4);
    }
    g.restore();
    g.strokeStyle = day ? '#f4f1ea' : '#6b5690';
    g.lineWidth = 8;
    g.strokeRect(wx, wy, ww, wh);
    g.lineWidth = 4;
    g.beginPath();
    g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh);
    g.moveTo(wx, wy + wh / 2); g.lineTo(wx + ww, wy + wh / 2);
    g.stroke();
    g.fillStyle = day ? '#d9cbb3' : '#7b6599';
    g.fillRect(wx - 10, wy + wh + 2, ww + 20, 8);

    // Shelf with books and a plant (only when there's room)
    if (!narrow) {
      const sx = W * 0.07, sw = Math.min(W * 0.22, 220), sy = wy + wh * 0.75;
      g.fillStyle = day ? '#a77b52' : '#5a4378';
      g.fillRect(sx, sy, sw, 8);
      const bookColors = ['#ff4fa3', '#4fd1ff', '#ffd23f', '#a78bfa', '#5dffb0', '#ff8a5c'];
      let x = sx + 8;
      g.globalAlpha = day ? 0.9 : 0.75;
      for (let i = 0; i < 6; i++) {
        const bwid = rand(10, 16), bht = rand(30, 46);
        g.fillStyle = bookColors[i];
        g.fillRect(x, sy - bht, bwid, bht);
        x += bwid + 2;
      }
      g.globalAlpha = 1;
      const px = sx + sw - 34;
      g.fillStyle = '#3fbf6a';
      for (let i = 0; i < 6; i++) {
        g.save();
        g.translate(px, sy - 22);
        g.rotate(-1.2 + i * 0.48);
        g.beginPath(); g.ellipse(0, -16, 6, 16, 0, 0, TAU); g.fill();
        g.restore();
      }
      g.fillStyle = '#c0704a';
      g.fillRect(px - 12, sy - 22, 24, 22);
    }

    if (day) {
      // Sunbeam slanting in from the window down to the table
      const beam = g.createLinearGradient(wx + ww / 2, wy + wh, G.cx, tY);
      beam.addColorStop(0, 'rgba(255,240,190,0.38)');
      beam.addColorStop(1, 'rgba(255,240,190,0.06)');
      g.fillStyle = beam;
      g.beginPath();
      g.moveTo(wx, wy + wh);
      g.lineTo(wx + ww, wy + wh);
      g.lineTo(Math.min(wx + ww, G.cx + W * 0.2), tY);
      g.lineTo(Math.max(0, G.cx - W * 0.3), tY);
      g.closePath();
      g.fill();
    } else {
      // Warm lamp glow behind the bottle
      const lg = g.createRadialGradient(G.cx, tY - G.bh * 0.5, 10, G.cx, tY - G.bh * 0.5, Math.max(W, H) * 0.45);
      lg.addColorStop(0, 'rgba(255,180,110,0.22)');
      lg.addColorStop(1, 'rgba(255,180,110,0)');
      g.fillStyle = lg;
      g.fillRect(0, 0, W, tY);
    }

    // Wooden table: top surface + front
    const topY = tY - 10, topH = 18;
    const top = g.createLinearGradient(0, topY, 0, topY + topH);
    top.addColorStop(0, '#b97a4a');
    top.addColorStop(1, '#8a5532');
    g.fillStyle = top;
    g.fillRect(0, topY, W, topH);
    g.fillStyle = 'rgba(255,220,180,0.35)';
    g.fillRect(0, topY, W, 1.5);
    const frontY = topY + topH;
    const front = g.createLinearGradient(0, frontY, 0, H);
    front.addColorStop(0, '#6b3f24');
    front.addColorStop(1, '#2e1a10');
    g.fillStyle = front;
    g.fillRect(0, frontY, W, H - frontY);
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(0, frontY, W, 3);
    g.strokeStyle = 'rgba(0,0,0,0.13)';
    g.lineWidth = 1;
    for (let i = 0; i < 14; i++) {
      const y = frontY + 10 + Math.random() * (H - frontY - 10);
      g.beginPath();
      g.moveTo(0, y);
      for (let x = 0; x <= W + 40; x += 40) g.lineTo(x, y + Math.sin(x * 0.01 + i) * 3);
      g.stroke();
    }
    // Pool of lamp light on the table
    g.save();
    g.translate(G.cx, tY);
    g.scale(1, 0.12);
    const pool = g.createRadialGradient(0, 0, 0, 0, 0, W * 0.35);
    pool.addColorStop(0, day ? 'rgba(255,240,200,0.45)' : 'rgba(255,200,140,0.35)');
    pool.addColorStop(1, 'rgba(255,200,140,0)');
    g.fillStyle = pool;
    g.beginPath(); g.arc(0, 0, W * 0.35, 0, TAU); g.fill();
    g.restore();

    return c;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    bgNight = buildBackground(false);
    bgDay = buildBackground(true);
    if (s.mode === 'settle' || (s.mode === 'result' && !s.success)) {
      const p = poseFromPhi(s.phi); s.x = p.x; s.y = p.y;
    } else if (s.mode !== 'flight') {
      s.x = G.cx; s.y = G.tableY - G.bh / 2;
    }
  }
  window.addEventListener('resize', resize);

  // ---------- Game flow ----------
  function newZone() {
    s.zoneC = s.zoneW / 2 + Math.random() * (1 - s.zoneW);
  }
  function resetGame() {
    s.score = 0; s.liquid = 0;
    s.speed = START_SPEED; s.zoneW = START_ZONE;
    newZone();
  }

  function tap() {
    initAudio();
    if (!started) {
      // First tap only closes the start menu; the next one flips.
      started = true;
      menu.classList.add('hidden');
      s.msgT = 0;
      [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.08, i * 0.07));
      return;
    }
    if (s.mode !== 'aim') return;
    // Which layer of the zone was the line in? (-1 = missed the zone)
    const dist = Math.abs(s.p - s.zoneC);
    s.tier = TIERS.findIndex((t) => dist <= (s.zoneW * t.size) / 2);
    s.success = s.tier !== -1;
    s.perfect = s.tier === 0;

    // How far the bottle spins decides how it lands.
    let total;
    if (s.success) {
      const w = TIERS[s.tier].wobble;
      total = TAU + rand(-w, w);                                           // lands upright, some wobble
    } else {
      total = TAU + (Math.random() < 0.5 ? -1 : 1) * rand(0.65, 1.4);      // too far / not enough
    }

    const land = poseFromPhi(total - TAU);
    s.flight = { t: 0, x0: s.x, y0: s.y, x1: land.x, y1: land.y, total };
    s.mode = 'flight';
    s.msg = ''; s.sub = '';
    sfx.flip();
    spawnBubbles(4);
  }

  function land() {
    // Bring angles back near zero so the physics stays simple.
    s.angle = wrapAngle(s.angle);
    s.wa = wrapAngle(s.wa);
    s.phi = s.angle;
    s.phiV = s.angVel * 0.03;
    s.angVel = 0;
    s.waveA += G.bw * 0.1;
    s.mode = 'settle';
    sfx.land();
    spawnBubbles(8);
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: s.x + rand(-G.bw, G.bw), y: G.tableY, vx: rand(-70, 70), vy: rand(-70, -20), g: 120,
        life: 1, decay: rand(1.4, 2.2), size: rand(1.5, 3.5), color: '#e8c9a8', shape: 'circle', rot: 0, vr: 0,
      });
    }
  }

  function finishRound(success) {
    s.mode = 'result';
    s.resultT = 0;
    s.msgT = 0;
    s.success = success;
    if (success) {
      s.phi = 0; s.angle = 0;
      s.x = G.cx; s.y = G.tableY - G.bh / 2;
      const prevLiquid = s.liquid;
      const tier = TIERS[s.tier];
      s.score += tier.points;
      if (s.score > best) {
        best = s.score;
        try { localStorage.setItem('bottleFlipBest', best); } catch (e) {}
      }
      s.liquid = Math.floor(s.score / 5) % LIQUIDS.length;
      s.msg = tier.name;
      s.msgPts = '+' + tier.points;
      s.msgFade = true;
      s.msgColor = tier.color;
      if (s.perfect) { confetti(); sfx.perfect(); }
      else if (s.tier === 1) sfx.win();
      else sfx.good();
      if (s.liquid !== prevLiquid) s.sub = 'New drink: ' + LIQUIDS[s.liquid].name + '!';
    } else {
      s.msg = 'Missed!'; s.msgColor = '#ff6fb5'; s.msgPts = ''; s.msgFade = false;
      sfx.fail();
    }
  }

  function spawnBubbles(n) {
    const { ux, uy, level } = s.lq;
    for (let i = 0; i < n; i++) {
      for (let tries = 0; tries < 10; tries++) {
        const x = rand(-G.bw * 0.4, G.bw * 0.4);
        const y = rand(-G.bh * 0.3, G.bh * 0.48);
        if (x * ux + y * uy < level - 5) {
          bubbles.push({ x, y, r: rand(1.2, 3), v: rand(25, 60), life: rand(1, 2.5), wob: rand(0, TAU) });
          break;
        }
      }
    }
  }

  function confetti() {
    const colors = ['#ff4fa3', '#4fd1ff', '#ffd23f', '#a78bfa', '#5dffb0'];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: W / 2 + rand(-W * 0.35, W * 0.35), y: rand(-40, -5),
        vx: rand(-60, 60), vy: rand(60, 220), g: 260,
        life: 1, decay: rand(0.35, 0.6), size: rand(4, 8),
        color: colors[i % colors.length], shape: 'rect', rot: rand(0, TAU), vr: rand(-8, 8),
      });
    }
  }

  // ---------- Update ----------
  function updateLiquid(dt) {
    // The liquid behaves like a damped spring that wants to stay level,
    // and gets dragged along when the bottle spins.
    const inAir = s.mode === 'flight';
    const k = inAir ? 3 : 60;
    const c = inAir ? 0.2 : 2.5;
    const drag = inAir ? 2.4 : 1;
    const acc = -k * s.wa - c * s.waV + drag * (s.angVel - s.waV);
    s.waV += acc * dt;
    s.wa += s.waV * dt;

    const agitation = Math.abs(s.waV) + Math.abs(s.angVel) * 0.3;
    const targetWave = Math.min(G.bw * 0.12, G.bw * 0.012 + agitation * G.bw * 0.02);
    s.waveA += (targetWave - s.waveA) * Math.min(1, dt * 3);
    s.waveA = Math.min(s.waveA, G.bw * 0.16);
    s.wavePhase += dt * (5 + agitation * 2);

    // Work out the surface in bottle space (used for drawing + bubbles).
    const a = s.wa - s.angle;
    const ux = Math.sin(a), uy = -Math.cos(a);
    s.lq = { ux, uy, level: waterLevel(ux, uy) };

    for (const b of bubbles) {
      b.wob += dt * 8;
      b.x += ux * b.v * dt + -uy * Math.sin(b.wob) * 6 * dt;
      b.y += uy * b.v * dt + ux * Math.sin(b.wob) * 6 * dt;
      b.life -= dt;
    }
    bubbles = bubbles.filter((b) => b.life > 0 && b.x * ux + b.y * uy < s.lq.level - b.r);
    if (agitation > 2 && Math.random() < dt * 6) spawnBubbles(1);
  }

  function update(dt) {
    if (s.mode === 'aim') {
      s.p += s.dir * s.speed * dt;
      if (s.p > 1) { s.p = 1; s.dir = -1; }
      if (s.p < 0) { s.p = 0; s.dir = 1; }
      s.fade = Math.min(1, s.fade + dt * 4);
    } else if (s.mode === 'flight') {
      const f = s.flight;
      f.t += dt / FLIP_TIME;
      const t = Math.min(f.t, 1);
      s.x = f.x0 + (f.x1 - f.x0) * t;
      s.y = f.y0 + (f.y1 - f.y0) * t - 4 * G.jump * t * (1 - t);
      s.angle = f.total * t;            // constant spin while in the air
      s.angVel = f.total / FLIP_TIME;
      if (f.t >= 1) land();
    } else if (s.mode === 'settle') {
      // Rigid-body tipping around the bottom corner:
      // inside the tip angle it rocks back, past it gravity pulls it over.
      const side = s.phi >= 0 ? 1 : -1;
      const alpha = side * ((3 * G.g) / (4 * G.L)) * Math.sin(Math.abs(s.phi) - G.beta);
      s.phiV += alpha * dt;
      s.phiV *= 1 - 1.5 * dt;
      const prev = s.phi;
      s.phi += s.phiV * dt;
      if (prev !== 0 && Math.sign(prev) !== Math.sign(s.phi)) {
        s.phiV *= 0.4; // base slaps flat on the table and loses energy
        if (Math.abs(s.phiV) > 0.3) sfx.tick();
      }
      if (Math.abs(s.phi) >= Math.PI / 2) {
        s.phi = Math.sign(s.phi) * Math.PI / 2;
        if (Math.abs(s.phiV) > 0.8) {
          s.phiV *= -0.3;
          s.waveA += G.bw * 0.08;
          sfx.land();
        } else {
          s.phiV = 0;
        }
      }
      s.angle = s.phi;
      s.angVel = s.phiV;
      const p = poseFromPhi(s.phi);
      s.x = p.x; s.y = p.y;

      if (Math.abs(s.phi) < 0.004 && Math.abs(s.phiV) < 0.08) finishRound(true);
      else if (Math.abs(s.phi) >= Math.PI / 2 - 1e-6 && s.phiV === 0) finishRound(false);
    } else if (s.mode === 'result') {
      s.resultT += dt;
      if (s.success && s.resultT > 0.5) {
        // Harder each round: faster line, smaller zone.
        s.speed = Math.min(s.speed * 1.08, 3);
        s.zoneW = Math.max(s.zoneW * 0.93, MIN_ZONE);
        newZone();
        s.mode = 'aim';
      } else if (!s.success && s.resultT > 1.1) {
        s.fade = Math.max(0, s.fade - dt * 4);
        if (s.fade === 0) {
          resetGame();
          resetBottle();
          s.msg = 'Tap to flip!'; s.msgColor = '#ffffff'; s.msgPts = ''; s.msgFade = false; s.sub = ''; s.msgT = 0;
          s.mode = 'aim';
        }
      }
    }

    updateLiquid(dt);
    dayMix += ((isDay ? 1 : 0) - dayMix) * Math.min(1, dt * 4);
    if (Math.abs(dayMix - (isDay ? 1 : 0)) < 0.002) dayMix = isDay ? 1 : 0;

    for (const p of particles) {
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= p.decay * dt;
    }
    particles = particles.filter((p) => p.life > 0 && p.y < H + 20);
    s.msgT += dt;
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    roundRectPath(x, y, w, h, r);
  }
  // Adds a rounded rectangle to the current path (lets several shapes share one clip).
  function roundRectPath(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }


  function bottlePath(bh, bw) {
    const d = dims(bh, bw);
    const neckBottom = d.top + d.capH + d.neckH;
    ctx.beginPath();
    ctx.moveTo(-d.neckW / 2, d.top + d.capH);
    ctx.lineTo(-d.neckW / 2, neckBottom);
    ctx.quadraticCurveTo(-bw / 2, neckBottom, -bw / 2, d.bodyTop);
    ctx.lineTo(-bw / 2, d.bottom - 8);
    ctx.quadraticCurveTo(-bw / 2, d.bottom, -bw / 2 + 8, d.bottom);
    ctx.lineTo(bw / 2 - 8, d.bottom);
    ctx.quadraticCurveTo(bw / 2, d.bottom, bw / 2, d.bottom - 8);
    ctx.lineTo(bw / 2, d.bodyTop);
    ctx.quadraticCurveTo(bw / 2, neckBottom, d.neckW / 2, neckBottom);
    ctx.lineTo(d.neckW / 2, d.top + d.capH);
    ctx.closePath();
  }

  function drawBottle() {
    const { bh, bw } = G;
    const d = dims(bh, bw);
    const liquid = LIQUIDS[s.liquid];
    const baseAlpha = ctx.globalAlpha;

    const sk = skin(), now = performance.now() / 1000;
    bottlePath(bh, bw);
    ctx.fillStyle = sk.glass;
    ctx.fill();

    ctx.save();
    ctx.clip();

    // Liquid surface, kept level-ish with the world, with waves on top.
    const { ux, uy, level } = s.lq;
    const vx = -uy, vy = ux;
    const R = bh;
    const pts = [];
    const N = 28;
    for (let i = 0; i <= N; i++) {
      const t = -R + (2 * R * i) / N;
      const w = s.waveA * (Math.sin(t * (6 / bw) + s.wavePhase) + 0.5 * Math.sin(t * (13 / bw) - s.wavePhase * 1.3));
      pts.push([ux * (level + w) + vx * t, uy * (level + w) + vy * t]);
    }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.lineTo(ux * (level - 2 * R) + vx * R, uy * (level - 2 * R) + vy * R);
    ctx.lineTo(ux * (level - 2 * R) - vx * R, uy * (level - 2 * R) - vy * R);
    ctx.closePath();
    const grad = ctx.createLinearGradient(ux * level, uy * level, ux * (level - bh * 0.6), uy * (level - bh * 0.6));
    grad.addColorStop(0, liquid.top);
    grad.addColorStop(1, liquid.bottom);
    ctx.fillStyle = grad;
    ctx.globalAlpha = baseAlpha * 0.92;
    ctx.fill();
    ctx.globalAlpha = baseAlpha;

    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const b of bubbles) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
    }

    // Label
    const ly = d.bodyTop + bh * 0.12, lh = bh * 0.18;
    if (sk.label === 'rainbow') {
      const cols = ['#ff5e5e', '#ff9f43', '#ffd23f', '#5dffb0', '#4fd1ff', '#a78bfa'];
      cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(-bw, ly + (lh / cols.length) * i, bw * 2, lh / cols.length + 0.5); });
    } else if (sk.label !== 'none') {
      ctx.fillStyle = sk.label;
      ctx.fillRect(-bw, ly, bw * 2, lh);
      ctx.save();
      ctx.beginPath(); ctx.rect(-bw, ly, bw * 2, lh); ctx.clip();
      ctx.fillStyle = sk.pat; ctx.strokeStyle = sk.pat;
      if (sk.pattern === 'stripes') {
        for (let x = -bw * 1.5; x < bw * 1.5; x += bw * 0.22) { ctx.beginPath(); ctx.moveTo(x, ly + lh); ctx.lineTo(x + bw * 0.1, ly + lh); ctx.lineTo(x + bw * 0.3, ly); ctx.lineTo(x + bw * 0.2, ly); ctx.fill(); }
      } else if (sk.pattern === 'dots') {
        for (let i = 0; i < 10; i++) { ctx.beginPath(); ctx.arc(-bw / 2 + (i % 5) * bw * 0.25, ly + lh * (i < 5 ? 0.22 : 0.8), bw * 0.045, 0, TAU); ctx.fill(); }
      } else if (sk.pattern === 'stars') {
        for (let i = 0; i < 9; i++) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(now * 3 + i * 2); ctx.fillRect(-bw / 2 + ((i * 37) % 100) / 100 * bw, ly + ((i * 53) % 100) / 100 * lh, 2, 2); }
        ctx.globalAlpha = 1;
      } else if (sk.pattern === 'band') {
        ctx.fillRect(-bw, ly + lh * 0.06, bw * 2, lh * 0.12); ctx.fillRect(-bw, ly + lh * 0.82, bw * 2, lh * 0.12);
      } else if (sk.pattern === 'swirl') {
        ctx.lineWidth = lh * 0.16;
        for (let x = -bw; x < bw; x += bw * 0.3) { ctx.beginPath(); ctx.moveTo(x, ly + lh); ctx.quadraticCurveTo(x + bw * 0.15, ly + lh * 0.5, x + bw * 0.05, ly); ctx.stroke(); }
      } else if (sk.pattern === 'camo') {
        for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.ellipse(-bw / 2 + ((i * 29) % 100) / 100 * bw, ly + ((i * 61) % 100) / 100 * lh, bw * 0.12, lh * 0.22, i, 0, TAU); ctx.fill(); }
      }
      ctx.restore();
    }
    ctx.fillStyle = sk.textColor;
    ctx.font = `900 ${Math.round(bw * 0.24)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (sk.textGlow) { ctx.shadowColor = sk.textColor; ctx.shadowBlur = 10; }
    ctx.fillText(sk.text, 0, ly + lh / 2);
    ctx.shadowBlur = 0;

    // Glass shine
    ctx.fillStyle = 'rgba(255,255,255,' + (sk.shine || 0.22) + ')';
    ctx.fillRect(-bw / 2 + bw * 0.12, d.bodyTop, bw * 0.1, bh * 0.6);
    ctx.restore();

    bottlePath(bh, bw);
    ctx.lineWidth = 2.5;
    // Light outline at night, darker by day so the glass shows against the bright wall
    ctx.strokeStyle = sk.outline || (dayMix > 0.5 ? 'rgba(70, 100, 130, 0.8)' : 'rgba(220, 240, 255, 0.85)');
    if (sk.glow) { ctx.shadowColor = sk.glow; ctx.shadowBlur = 14; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = sk.cap === 'rainbow' ? 'hsl(' + ((now * 120) % 360) + ', 95%, 62%)' : sk.cap;
    const capExtra = sk.capTall ? d.capH * 0.9 : 0;
    roundRect(-d.neckW / 2 - 2, d.top - capExtra, d.neckW + 4, d.capH + 2 + capExtra, 3);
    ctx.fill();
    if (sk.capTall) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(-d.neckW / 2 - 2, d.top - capExtra + 2, d.neckW + 4, 2); }
  }

  // Text with a soft dark shadow (no hard outline) so it reads on both the night and day walls.
  function drawText(text, x, y, size, color, align = 'center', weight = 'bold') {
    ctx.save();
    ctx.font = `${weight} ${size}px system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.shadowColor = 'rgba(15, 8, 30, 0.7)';
    ctx.shadowBlur = Math.max(4, size * 0.25);
    ctx.shadowOffsetY = 1.5;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  const easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);

  // A smooth rounded badge: soft dark capsule with a colored glow, the word in its color,
  // and the points in a little rounded chip, e.g.  ( GOOD  [+1] )
  function drawBadge(cx, cy, title, pts, color, size) {
    ctx.save();
    ctx.textBaseline = 'middle';
    const titleFont = `800 ${size}px system-ui, sans-serif`;
    const chipSize = Math.round(size * 0.62);
    const chipFont = `800 ${chipSize}px system-ui, sans-serif`;
    ctx.font = titleFont;
    const tw = ctx.measureText(title).width;
    ctx.font = chipFont;
    const pw = pts ? ctx.measureText(pts).width : 0;

    const h = size * 1.6;
    const padX = size * 0.6;
    const chipH = size * 1.0, chipW = pts ? pw + chipSize * 1.1 : 0;
    const gap = pts ? size * 0.4 : 0;
    const totalW = padX * 2 + tw + gap + chipW;
    const x0 = cx - totalW / 2;

    // Capsule with a soft colored glow
    ctx.shadowColor = color + '66';
    ctx.shadowBlur = size * 0.9;
    const bg = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
    bg.addColorStop(0, 'rgba(40, 28, 70, 0.82)');
    bg.addColorStop(1, 'rgba(16, 10, 32, 0.82)');
    ctx.fillStyle = bg;
    roundRect(x0, cy - h / 2, totalW, h, h / 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = color + '80';
    ctx.stroke();
    // Gentle top highlight for a glassy feel
    ctx.save();
    ctx.clip();
    const hl = ctx.createLinearGradient(0, cy - h / 2, 0, cy);
    hl.addColorStop(0, 'rgba(255,255,255,0.14)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(x0, cy - h / 2, totalW, h / 2);
    ctx.restore();

    // Title with a soft glow in its own color
    ctx.font = titleFont;
    ctx.textAlign = 'left';
    ctx.shadowColor = color + '99';
    ctx.shadowBlur = size * 0.45;
    ctx.fillStyle = color;
    ctx.fillText(title, x0 + padX, cy + size * 0.04);

    // Points chip
    if (pts) {
      const chipX = x0 + padX + tw + gap;
      ctx.shadowBlur = size * 0.35;
      ctx.fillStyle = color;
      roundRect(chipX, cy - chipH / 2, chipW, chipH, chipH / 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = chipFont;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(30, 14, 4, 0.9)';
      ctx.fillText(pts, chipX + chipW / 2, cy + chipSize * 0.05);
    }
    ctx.restore();
  }

  function draw() {
    // Cross-fade between the night and day rooms
    if (dayMix < 1) ctx.drawImage(bgNight, 0, 0, W, H);
    if (dayMix > 0) {
      ctx.globalAlpha = dayMix;
      ctx.drawImage(bgDay, 0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // Shadow under the bottle
    const restY = G.tableY - G.bh / 2;
    const air = s.mode === 'flight' ? Math.max(0, (restY - s.y) / G.jump) : 0;
    const shadowW = (G.bw * 0.75 + Math.abs(Math.sin(s.angle)) * G.bh * 0.45) * (1 - air * 0.4);
    ctx.fillStyle = `rgba(0,0,0,${0.38 * (1 - air * 0.7) * s.fade})`;
    ctx.beginPath();
    ctx.ellipse(s.x, G.tableY, shadowW, 6, 0, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.globalAlpha = s.fade;
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    drawBottle();
    ctx.restore();

    // Particles (dust + confetti)
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // ---------- Timing bar ----------
    const barW = Math.min(W * 0.88, 440);
    const barH = W < 400 ? 34 : 38;
    const barX = (W - barW) / 2;
    const barY = G.tableY + Math.min((H - G.tableY) * 0.42, 110);

    roundRect(barX, barY, barW, barH, 10);
    ctx.fillStyle = 'rgba(12, 8, 24, 0.85)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.stroke();

    // Zone layers: draw the outer (GOOD) layer first, then GREAT, then PERFECT on top.
    const zoneMid = barX + s.zoneC * barW;
    const zw = s.zoneW * barW;
    const layerW = (i) => Math.max(i === 0 ? 6 : 0, zw * TIERS[i].size); // keep PERFECT visible
    // One flat band, mirrored on both sides, with three colors spread out differently:
    // wide yellow edges (GOOD) -> orange (GREAT) -> a thin red streak in the center (PERFECT).
    const outerW = layerW(TIERS.length - 1);
    const zoneLeft = zoneMid - outerW / 2;
    const blend = ctx.createLinearGradient(zoneLeft, 0, zoneLeft + outerW, 0);
    const edge = (i) => 0.5 - layerW(i) / outerW / 2; // where layer i starts (0..0.5)
    const e1 = edge(1), e0 = edge(0);
    const stops = [
      [0, TIERS[2].color],                  // yellow
      [e1 * 0.8, TIERS[2].color],           // yellow holds across most of the outer layer
      [(e1 + e0) / 2, TIERS[1].color],      // orange
      [e0 + (0.5 - e0) * 0.3, '#ff6a10'],   // deep orange easing into red
      [0.5, TIERS[0].color],                // red at the very center
    ];
    for (const [pos, col] of stops) {
      blend.addColorStop(pos, col);
      blend.addColorStop(1 - pos, col);
    }
    ctx.fillStyle = blend;
    roundRect(zoneLeft, barY + 5, outerW, barH - 10, Math.min(5, outerW / 2));
    ctx.fill();
    // Point labels inside each layer, when there's room
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(90, 20, 0, 0.9)';
    ctx.shadowBlur = 3;
    const labelY = barY + barH / 2;
    if (layerW(0) >= 18) ctx.fillText('+' + TIERS[0].points, zoneMid, labelY);
    for (let i = 1; i < TIERS.length; i++) {
      const side = (layerW(i) - layerW(i - 1)) / 2;
      if (side < 18) continue;
      const offset = (layerW(i - 1) + side) / 2;
      ctx.fillText('+' + TIERS[i].points, zoneMid - offset, labelY);
      ctx.fillText('+' + TIERS[i].points, zoneMid + offset, labelY);
    }
    ctx.shadowBlur = 0;

    const lx = barX + s.p * barW;
    const inZone = Math.abs(s.p - s.zoneC) <= s.zoneW / 2;
    ctx.fillStyle = inZone ? '#ffffff' : '#ff4fa3';
    ctx.fillRect(lx - 1.5, barY - 8, 3, barH + 16);

    ctx.fillStyle = 'rgba(255,235,215,0.7)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const hint = isTouch
      ? 'Tap when the line is in the zone · hit the red center for PERFECT'
      : 'Click or press ENTER when the line is in the zone · red center = PERFECT';
    let fontSize = 14;
    ctx.font = fontSize + 'px system-ui, sans-serif';
    const textW = ctx.measureText(hint).width;
    if (textW > W - 32) {
      fontSize = Math.max(10, Math.floor((fontSize * (W - 32)) / textW));
      ctx.font = fontSize + 'px system-ui, sans-serif';
    }
    ctx.fillText(hint, W / 2, barY + barH + 16);

    // ---------- HUD ----------
    ctx.save();
    ctx.textBaseline = 'top';
    drawText(String(s.score), 20, 14, 32, '#ffffff', 'left');
    drawText('BEST ' + best, 20, 52, 13, 'rgba(255,255,255,0.85)', 'left', '600');
    drawText(LIQUIDS[s.liquid].name.toUpperCase(), 20, 70, 13, LIQUIDS[s.liquid].top, 'left', '600');
    ctx.restore();

    if (s.msg && started) {
      // Springy pop-in, then (for results) drift up a little and fade away.
      const pop = easeOutBack(Math.min(s.msgT / 0.35, 1));
      let alpha = Math.min(s.msgT / 0.12, 1);
      let rise = 0;
      if (s.msgFade && s.msgT > 1.1) {
        const k = Math.min((s.msgT - 1.1) / 0.45, 1);
        alpha *= 1 - k;
        rise = k * 14;
      }
      const size = W < 400 ? 22 : 28;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(W / 2, Math.max(H * 0.16, 80) - rise);
      ctx.scale(0.6 + 0.4 * pop, 0.6 + 0.4 * pop);
      drawBadge(0, 0, s.msg, s.msgPts, s.msgColor, size);
      if (s.sub) drawBadge(0, size * 1.95, s.sub, '', LIQUIDS[s.liquid].top, Math.round(size * 0.55));
      ctx.restore();
    }
  }

  // ---------- Input ----------
  // Skin picker on the menu (the preview reuses the real bottle drawing)
  const skCv = document.getElementById('skCv'), skCtx = skCv.getContext('2d');
  function drawSkinPreview() {
    if (!G.bh || !s.lq) return;   // the screen hasn't been measured yet
    const d2 = Math.min(window.devicePixelRatio || 1, 2);
    const w = skCv.clientWidth || 44, h = skCv.clientHeight || 64;
    if (skCv.width !== Math.round(w * d2)) { skCv.width = Math.round(w * d2); skCv.height = Math.round(h * d2); }
    skCtx.setTransform(1, 0, 0, 1, 0, 0);
    skCtx.clearRect(0, 0, skCv.width, skCv.height);
    const k = (h * 0.92) / (G.bh * 1.1);
    skCtx.setTransform(d2 * k, 0, 0, d2 * k, (w / 2) * d2, (h / 2 + 2) * d2);
    const keepLq = s.lq, keepA = s.waveA;
    s.lq = { ux: 0, uy: -1, level: keepLq ? keepLq.level : 0 }; s.waveA = 1.5;
    ctx = skCtx;
    try { drawBottle(); } finally { ctx = mainCtx; s.lq = keepLq; s.waveA = keepA; }
  }
  function setSkin(i) {
    skinIndex = (i + SKINS.length) % SKINS.length;
    try { localStorage.setItem('bottleSkin', skinIndex); } catch (e) {}
    document.getElementById('skName').textContent = skin().name;
    document.getElementById('skNum').textContent = (skinIndex + 1) + ' / ' + SKINS.length;
    drawSkinPreview();
  }
  for (const [id, step] of [['skPrev', -1], ['skNext', 1]]) {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('click', (e) => { e.stopPropagation(); b.blur(); setSkin(skinIndex + step); initAudio(); });
  }
  // keep the preview's waves moving while the menu is up
  setSkin(skinIndex);
  (function skLoop() { if (!started) drawSkinPreview(); requestAnimationFrame(skLoop); })();

  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); if (started) tap(); else initAudio(); });
  window.addEventListener('keydown', (e) => {
    const isFlipKey = e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space';
    if (!isFlipKey) return;
    e.preventDefault();
    if (!e.repeat) tap(); // holding the key down doesn't spam flips
  });

  const soundBtn = document.getElementById('sound');
  function refreshSoundBtn() { soundBtn.textContent = muted ? '🔇' : '🔊'; }
  soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('bottleFlipMuted', muted ? '1' : '0'); } catch (err) {}
    refreshSoundBtn();
    soundBtn.blur();
    if (!muted) { initAudio(); sfx.tick(); }
  });
  refreshSoundBtn();

  const themeBtn = document.getElementById('theme');
  // Shows what you'll switch TO: moon while it's day, sun while it's night.
  function refreshThemeBtn() { themeBtn.textContent = isDay ? '🌙' : '☀️'; }
  themeBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  themeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    isDay = !isDay;
    try { localStorage.setItem('bottleFlipTheme', isDay ? 'day' : 'night'); } catch (err) {}
    refreshThemeBtn();
    themeBtn.blur();
  });
  refreshThemeBtn();
  window.focus();

  // ---------- Pause ----------
  // A pause button (shown only while a round is going), a "Paused" card, P / Esc to
  // toggle, and an automatic pause when you switch away from the game. While paused,
  // taps and keys don't reach the game, so the tap that resumes doesn't also play.
  const Pause = (() => {
    const cfg = {
      theme: 'neon',                      // 'neon' or 'paper'
      top: '12px', right: '112px',      // where the button sits (next to sound)
      isPlaying: () => (started),
      restart: () => { resetGame(); resetBottle(); particles = []; s.msg = 'Tap to flip!'; s.msgColor = '#ffffff'; s.msgPts = ''; s.msgFade = false; s.sub = ''; s.msgT = 0; s.fade = 1; s.mode = 'aim'; },
      menu: () => { started = false; resetGame(); resetBottle(); particles = []; s.msg = 'Tap to flip!'; s.msgColor = '#ffffff'; s.msgPts = ''; s.msgFade = false; s.sub = ''; s.msgT = 0; s.fade = 1; s.mode = 'aim'; menu.classList.remove('hidden'); },
      onChange: (p) => {  },
    };
    const coarse = window.matchMedia('(pointer: coarse)').matches;
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>';
    const ICON_PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
    const css = document.createElement('style');
    const neon = cfg.theme === 'neon';
    css.textContent = `
      #pauseBtn { position: fixed; top: ${cfg.top}; right: ${cfg.right}; z-index: 8; display: none; place-items: center; cursor: pointer; padding: 0;
        ${neon
          ? 'width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(10,8,30,.5); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);'
          : 'width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid #23243a; background: #fffaf0; color: #23243a; box-shadow: 3px 3px 0 rgba(35,36,58,.28);'} }
      #pauseBtn.show { display: grid; }
      #pauseBtn:active { transform: ${neon ? 'scale(.92)' : 'translate(2px,2px)'}; }
      #pausedCard { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; text-align: center;
        background: ${neon ? 'radial-gradient(ellipse at center, rgba(5,3,15,.35), rgba(5,3,15,.8))' : 'rgba(35,36,58,.32)'}; }
      #pausedCard.on { display: flex; }
      #pausedCard .pc-in { ${neon
        ? 'color: #fff;'
        : 'background: #fffaf0; color: #23243a; border: 3px solid #23243a; border-radius: 20px; box-shadow: 8px 8px 0 rgba(35,36,58,.28); padding: 22px 34px 24px; transform: rotate(-1.5deg);'} }
      #pausedCard .pc-t { font-family: ${neon ? 'inherit' : "ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif"}; font-weight: 900;
        font-size: clamp(38px, 11vw, 64px); letter-spacing: .12em; line-height: 1;
        ${neon ? 'text-shadow: 0 0 22px rgba(79,209,255,.7), 0 0 44px rgba(167,139,250,.5);' : ''} }
      #pausedCard .pc-s { margin-top: 14px; font-weight: 800; letter-spacing: .14em; font-size: 13px; opacity: .85; }
      #pausedCard .pc-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 18px auto 0; width: min(92vw, 470px); }
      @media (max-width: 440px) { #pausedCard .pc-b { font-size: 12px; letter-spacing: .04em; padding: 10px 10px; } #pausedCard .pc-btns { gap: 6px; width: 96vw; } }
      #pausedCard .pc-b { cursor: pointer; font: inherit; font-weight: 900; letter-spacing: .1em; font-size: 14px; padding: 11px 16px; white-space: nowrap;
        ${neon
          ? 'border-radius: 999px; border: 1px solid rgba(255,255,255,.25); color: #fff; background: rgba(255,255,255,.08);'
          : 'border-radius: 14px; border: 2.5px solid #23243a; color: #23243a; background: #f6eedc; box-shadow: 3px 3px 0 rgba(35,36,58,.28);'} }
      #pausedCard .pc-b[data-act="resume"] { ${neon ? 'background: linear-gradient(90deg, #4fd1ff, #a78bfa); border-color: transparent; box-shadow: 0 0 22px rgba(79,209,255,.45);' : 'background: #ff7a59; color: #fff;'} }
      #pausedCard .pc-b:active { transform: scale(.95); }
      #pausedCard .pc-k { margin-top: 6px; font-size: 11px; letter-spacing: .1em; opacity: .55; font-weight: 700; }
    `;
    document.head.appendChild(css);
    const host = document.getElementById('app') || document.body;
    const btn = document.createElement('button');
    btn.id = 'pauseBtn'; btn.type = 'button'; btn.title = 'Pause (P)'; btn.setAttribute('aria-label', 'Pause');
    btn.innerHTML = ICON_PAUSE;
    const card = document.createElement('div');
    card.id = 'pausedCard';
    card.innerHTML = `<div class="pc-in"><div class="pc-t">PAUSED</div>`
      + `<div class="pc-btns"><button type="button" class="pc-b" data-act="resume">▶ RESUME</button><button type="button" class="pc-b pc-r" data-act="retry">↻ RETRY</button><button type="button" class="pc-b pc-r" data-act="menu">☰ MENU</button></div>`
      + `<div class="pc-k">${coarse ? 'or tap anywhere to resume' : 'P / Esc to resume · R to retry · M for menu'}</div></div>`;
    host.appendChild(btn);
    host.appendChild(card);
    card.querySelectorAll('.pc-b').forEach((b) => {
      b.addEventListener('pointerdown', (e) => e.stopPropagation());
      b.addEventListener('click', (e) => {
        e.stopPropagation(); b.blur();
        set(false);
        if (b.dataset.act === 'retry') cfg.restart();
        else if (b.dataset.act === 'menu') cfg.menu();
      });
    });

    let paused = false;
    function set(p) {
      if (p && !cfg.isPlaying()) return;
      if (p === paused) return;
      paused = p;
      card.classList.toggle('on', p);
      btn.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
      btn.setAttribute('aria-label', p ? 'Resume' : 'Pause');
      btn.title = p ? 'Resume (P)' : 'Pause (P)';
      cfg.onChange(p);
    }
    btn.addEventListener('pointerdown', (e) => e.stopPropagation());
    btn.addEventListener('click', (e) => { e.stopPropagation(); btn.blur(); set(!paused); });
    // While paused, swallow taps (other buttons like sound still work) and use them to resume
    window.addEventListener('pointerdown', (e) => {
      if (!paused) return;
      const b = e.target.closest && e.target.closest('button');
      if (b) return;
      e.stopImmediatePropagation();
      set(false);
    }, true);
    window.addEventListener('pointermove', (e) => { if (paused) e.stopImmediatePropagation(); }, true);
    window.addEventListener('keydown', (e) => {
      const k = e.code;
      const toggleKey = k === 'KeyP' || k === 'Escape';
      if (paused) {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (!e.repeat && (toggleKey || k === 'Space' || k === 'Enter' || k === 'NumpadEnter')) set(false);
        else if (!e.repeat && k === 'KeyR') { set(false); cfg.restart(); }
        else if (!e.repeat && k === 'KeyM') { set(false); cfg.menu(); }
        return;
      }
      if (toggleKey && !e.repeat && cfg.isPlaying()) { e.preventDefault(); e.stopImmediatePropagation(); set(true); }
    }, true);
    // Pause automatically when you leave the tab / app
    document.addEventListener('visibilitychange', () => { if (document.hidden) set(true); });
    window.addEventListener('blur', () => set(true));
    return {
      get paused() { return paused; },
      set,
      // call once per frame: shows the button only during a round
      sync() {
        const show = cfg.isPlaying() || paused;
        if (btn.classList.contains('show') !== show) btn.classList.toggle('show', show);
        if (paused && !cfg.isPlaying()) set(false);
      },
    };
  })();

  // ---------- Start ----------
  resize();
  resetBottle();
  newZone();
  updateLiquid(0);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    Pause.sync();
    if (Pause.paused) { requestAnimationFrame(loop); return; } // frozen on the last frame
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- Start / Retry buttons ----------
  // Only these buttons (or Space / Enter) start a game; tapping anywhere else doesn't.
  for (const id of ['startCta', 'retryCta']) {
    const b = document.getElementById(id);
    if (!b) continue;
    b.textContent = id === 'startCta' ? '▶ START' : '↻ PLAY AGAIN';
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('click', (e) => { e.stopPropagation(); b.blur(); if (!started) tap(); });
  }
</script>
</body>
</html>
