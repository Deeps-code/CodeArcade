<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Deep Cast</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #e6f6ff; --dim: #7fa3c4; --line: rgba(120, 200, 255, 0.18);
    --cyan: #4fd1ff; --gold: #ffd23f; --panel: rgba(8, 22, 44, 0.92);
    --px: 'Press Start 2P', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #050d1a; color: var(--ink);
    font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0; display: grid;
    grid-template-rows: auto auto 1fr auto; grid-template-columns: 1fr;
    grid-template-areas: "top" "stats" "stage" "panel";
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* ----- top bar ----- */
  .top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .t { font-family: var(--px); font-size: 15px; color: #fff; text-shadow: 0 0 10px rgba(79, 209, 255, 0.7); letter-spacing: 0.04em; }
  .logo .s { font-family: var(--px); font-size: 7px; color: var(--cyan); letter-spacing: 0.2em; margin-top: 4px; }
  .top .sp { flex: 1; }
  .ibtn { height: 30px; min-width: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(10, 30, 60, 0.7);
    color: var(--ink); font-family: var(--px); font-size: 8px; cursor: pointer; letter-spacing: 0.08em; }
  .ibtn:active { transform: scale(0.95); }
  /* ----- stats ----- */
  .stats { grid-area: stats; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 0 12px 8px; }
  .st { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .st .l { font-family: var(--px); font-size: 6.5px; color: var(--dim); letter-spacing: 0.12em; white-space: nowrap; }
  .st .v { font-family: var(--px); font-size: 14px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .v small { font-size: 6.5px; color: var(--dim); margin-left: 4px; }
  .st.combo { border-color: rgba(192, 132, 252, 0.55); }
  .st.combo .v { color: #d8b4fe; }
  .st.time .v { color: var(--gold); }
  .st.time.low .v { color: #ff6b6b; animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  /* ----- the ocean ----- */
  #stage { grid-area: stage; position: relative; overflow: hidden; min-height: 0; margin: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #0b3a5c; }
  #hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 86%; text-align: center; pointer-events: none;
    font-family: var(--px); font-size: 8px; line-height: 1.6; letter-spacing: 0.06em; color: var(--gold); background: rgba(3, 10, 25, 0.72);
    border: 1px solid rgba(255, 210, 63, 0.35); border-radius: 6px; padding: 6px 9px; opacity: 0; transition: opacity 0.3s; }
  #hint.on { opacity: 1; }
  #coll, #log { touch-action: pan-x pan-y; }
  #c { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  /* ----- bottom panel ----- */
  #panel { grid-area: panel; display: grid; grid-template-columns: 230px 1fr 1fr; gap: 8px; padding: 8px 12px 10px; height: 178px; box-sizing: border-box; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .box h3 { margin: 0 0 7px; font-family: var(--px); font-size: 7px; letter-spacing: 0.14em; color: var(--gold); font-weight: normal; }
  #lineBtn { flex: 1; min-height: 54px; border-radius: 10px; border: 2px solid #7ee8ff; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, #1aa3d6, #0b6c9e); box-shadow: 0 4px 0 #064a6d, 0 0 22px rgba(79, 209, 255, 0.35);
    font-family: var(--px); font-size: 13px; letter-spacing: 0.08em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; touch-action: none; }
  #lineBtn small { font-size: 6.5px; letter-spacing: 0.1em; opacity: 0.8; }
  #lineBtn.reel { background: linear-gradient(180deg, #22c55e, #15803d); border-color: #86efac; box-shadow: 0 4px 0 #0f5a2b, 0 0 22px rgba(34, 197, 94, 0.35); }
  #lineBtn.fight { background: linear-gradient(180deg, #f59e0b, #b45309); border-color: #fde68a; box-shadow: 0 4px 0 #7c3a06, 0 0 22px rgba(245, 158, 11, 0.4); }
  #lineBtn.danger { background: linear-gradient(180deg, #ef4444, #991b1b); border-color: #fecaca; box-shadow: 0 4px 0 #5c1010, 0 0 26px rgba(239, 68, 68, 0.55); }
  #lineBtn.wait { filter: saturate(0.4) brightness(0.8); }
  #lineBtn.down { transform: translateY(3px); box-shadow: 0 1px 0 #064a6d; }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 7px; text-align: center; }
  .mini div { font-family: var(--px); font-size: 6px; color: var(--dim); letter-spacing: 0.08em; }
  .mini b { display: block; font-size: 10px; color: var(--ink); margin-top: 4px; font-weight: normal; }
  #coll { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; overflow: auto; scrollbar-width: thin; }
  .sp-slot { position: relative; display: flex; align-items: center; gap: 5px; padding: 3px 5px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.07); background: rgba(255, 255, 255, 0.03); min-width: 0; }
  .sp-slot img { width: 30px; height: 18px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
  .sp-slot span { font-size: 9px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-slot.got { border-color: rgba(79, 209, 255, 0.5); background: rgba(79, 209, 255, 0.08); }
  .sp-slot.got span { color: var(--ink); }
  .sp-slot i { position: absolute; top: 1px; right: 3px; font-style: normal; font-family: var(--px); font-size: 6px; color: var(--gold); }
  .sp-slot.flash { animation: flash 0.9s; }
  @keyframes flash { 0%, 60% { background: rgba(255, 210, 63, 0.35); } }
  #log { overflow: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; }
  .lg { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.04); border-left: 3px solid var(--rc, #9ca3af); }
  .lg img { width: 30px; height: 18px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
  .lg .n { flex: 1; min-width: 0; font-size: 10px; }
  .lg .n div:last-child { font-size: 8.5px; color: var(--dim); margin-top: 2px; }
  .lg .p { font-family: var(--px); font-size: 8px; color: var(--gold); white-space: nowrap; }
  .lg.bad { --rc: #ef4444; opacity: 0.75; }
  .lg.bad .p { color: #fca5a5; }
  .empty { font-size: 10px; color: var(--dim); padding: 6px 2px; line-height: 1.5; }

  /* phones (portrait): stats in 2 rows, the catch grid becomes a strip, no log */
  @media (max-width: 720px) {
    .logo .t { font-size: 12px; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 0 10px 6px; }
    .st { padding: 5px 7px; }
    .st .v { font-size: 11px; margin-top: 4px; }
    #stage { margin: 0 10px; }
    #panel { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; padding: 6px 10px 8px; gap: 6px; }
    #panel .logbox { display: none; }
    .btnbox { flex-direction: row; gap: 8px; align-items: stretch; padding: 6px; }
    #lineBtn { min-height: 58px; font-size: 12px; }
    .btnbox .mini { grid-template-columns: 1fr; margin: 0; gap: 2px; align-content: center; min-width: 62px; }
    .btnbox .mini b { display: inline; margin-left: 4px; font-size: 8px; }
    .collbox { padding: 6px; }
    .collbox h3 { margin-bottom: 5px; }
    #coll { display: flex; overflow-x: auto; overflow-y: hidden; gap: 4px; padding-bottom: 2px; }
    .sp-slot { flex-direction: column; gap: 1px; padding: 3px 4px; min-width: 50px; }
    .sp-slot span { font-size: 7.5px; max-width: 56px; }
  }
  /* phones held sideways: the panel moves to a column on the right */
  @media (max-height: 520px) and (orientation: landscape) {
    #app { grid-template-columns: 1fr 210px; grid-template-rows: auto auto 1fr; grid-template-areas: "top panel" "stats panel" "stage panel"; }
    .top { padding: 5px 10px 4px; }
    .stats { grid-template-columns: repeat(6, 1fr); padding: 0 10px 5px; }
    .st { padding: 4px 6px; } .st .v { font-size: 10px; margin-top: 3px; }
    #stage { margin: 0 0 8px 10px; }
    #panel { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; padding: 8px 10px 8px 8px; }
    #panel .logbox { display: none; }
    .btnbox { flex-direction: column; }
    #coll { grid-template-columns: repeat(2, 1fr); }
  }

  /* ----- menus ----- */
  .overlay { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: radial-gradient(ellipse at center, rgba(5, 15, 35, 0.55), rgba(3, 8, 20, 0.92)); transition: opacity 0.3s; }
  .overlay.hidden { opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0s linear 0.3s; }
  .overlay.hidden * { pointer-events: none !important; }
  .overlay h1 { margin: 0; font-family: var(--px); font-weight: normal; font-size: clamp(28px, 8vw, 54px); line-height: 1.25; color: #fff;
    text-shadow: 0 0 18px rgba(79, 209, 255, 0.7), 0 5px 0 #0b6c9e; }
  .overlay h1 span { color: var(--gold); text-shadow: 0 0 18px rgba(255, 210, 63, 0.6), 0 5px 0 #a16207; }
  .overlay .kick { font-family: var(--px); font-size: 9px; letter-spacing: 0.24em; color: var(--cyan); margin-bottom: 14px; }
  .overlay p { max-width: 380px; color: #b9d4ea; font-size: 13px; line-height: 1.6; margin: 18px 0 0; }
  .overlay p b { color: #fff; }
  .cta { margin-top: 24px; padding: 15px 30px; border-radius: 10px; border: 2px solid #fde68a; cursor: pointer; color: #3b2304;
    background: linear-gradient(180deg, #ffd23f, #f59e0b); box-shadow: 0 5px 0 #a16207, 0 0 30px rgba(255, 210, 63, 0.35);
    font-family: var(--px); font-size: 13px; letter-spacing: 0.1em; animation: pulse 1.6s ease-in-out infinite; }
  .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #a16207; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  .zones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .zones div { font-family: var(--px); font-size: 7px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); }
  .big { font-family: var(--px); font-size: clamp(34px, 10vw, 60px); color: var(--gold); margin-top: 6px; text-shadow: 0 5px 0 #a16207; }
  .nb { font-family: var(--px); font-size: 9px; color: #5dffb0; margin-top: 12px; letter-spacing: 0.12em; }
  .gone { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo">
      <svg width="30" height="22" viewBox="0 0 15 11" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="#4fd1ff" d="M0 3h2v5H0zM2 4h1v3H2zM4 2h7v1H4zM3 3h10v5H3zM4 8h7v1H4zM13 4h2v3h-2z" /><path fill="#0b0b14" d="M11 4h1v1h-1z" /><path fill="#e6f6ff" d="M5 6h7v1H5z" />
      </svg>
      <div><div class="t">DEEP CAST</div><div class="s">PIXEL OCEAN ARCADE</div></div>
    </div>
    <div class="sp"></div>
    <button class="ibtn" id="sound" type="button">SOUND ON</button>
  </div>
  <div class="stats">
    <div class="st"><div class="l">SCORE</div><div class="v" id="sScore">0</div></div>
    <div class="st"><div class="l">BEST</div><div class="v" id="sBest">0</div></div>
    <div class="st combo"><div class="l">COMBO</div><div class="v" id="sCombo">x1</div></div>
    <div class="st"><div class="l">FISH CAUGHT</div><div class="v" id="sFish">0</div></div>
    <div class="st"><div class="l">DEPTH</div><div class="v"><span id="sDepth">0m</span><small id="sZone">SHALLOWS</small></div></div>
    <div class="st time" id="timeBox"><div class="l">DAYLIGHT</div><div class="v" id="sTime">2:00</div></div>
  </div>
  <div id="stage"><canvas id="c"></canvas><div id="hint"></div></div>
  <div id="panel">
    <div class="box btnbox">
      <button id="lineBtn" type="button"><span id="lbMain">CAST ▼</span><small id="lbSub">DROP THE LINE</small></button>
      <div class="mini">
        <div>CASTS<b id="mCasts">0</b></div><div>HOOKED<b id="mHooked">0</b></div><div>DEEPEST<b id="mDeep">0m</b></div>
      </div>
    </div>
    <div class="box collbox"><h3>TODAY'S CATCH</h3><div id="coll"></div></div>
    <div class="box logbox"><h3>CATCH LOG</h3><div id="log"><div class="empty">Nothing yet. Cast your line!</div></div></div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="kick">PIXEL OCEAN ARCADE</div>
  <h1>DEEP<br /><span>CAST</span></h1>
  <p id="howto"></p>
  <button type="button" class="cta" id="startCta">▶ START</button>
  <div class="zones"><div style="color:#7fe3ff">SHALLOWS</div><div style="color:#5dffb0">CORAL REEF</div><div style="color:#a5b4fc">TWILIGHT</div><div style="color:#c084fc">THE ABYSS</div></div>
</div>
<div class="overlay hidden" id="over">
  <div class="kick">THE SUN HAS SET</div>
  <div class="big" id="oScore">0</div>
  <div class="nb gone" id="oBest">★ NEW BEST ★</div>
  <p id="oStats"></p>
  <button type="button" class="cta" id="retryCta">↻ FISH AGAIN</button>
</div>

<script>
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const $ = (id) => document.getElementById(id);
  const isTouch = window.matchMedia('(pointer: coarse)').matches;

  $('howto').innerHTML = isTouch
    ? 'Tap <b>CAST</b> to drop your hook, and drag on the water to steer it. <b>Hold REEL</b> to pull a fish up, but <b>let go when it thrashes</b> or the line snaps! Catch all you can before sunset.'
    : 'Press <b>CAST</b> (or Space) to drop your hook. Steer with the mouse or arrow keys. <b>Hold REEL</b> to pull a fish up, but <b>let go when it thrashes</b> or the line snaps! Catch all you can before sunset.';

  // ---------- World ----------
  // The ocean is drawn at a low "pixel" resolution and scaled up, so everything looks pixel-art.
  const M = 4;                     // pixels per meter of depth
  const MAX_DEPTH = 125;           // meters to the sea floor
  const FLOOR = MAX_DEPTH * M;
  const DAY = 120;                 // seconds of daylight per game
  const ZONES = [
    { name: 'SHALLOWS', from: 0, to: 20, color: '#7fe3ff' },
    { name: 'CORAL REEF', from: 20, to: 50, color: '#5dffb0' },
    { name: 'TWILIGHT', from: 50, to: 85, color: '#a5b4fc' },
    { name: 'THE ABYSS', from: 85, to: MAX_DEPTH, color: '#c084fc' },
  ];
  const zoneAt = (m) => ZONES.find((z) => m < z.to) || ZONES[ZONES.length - 1];
  const WATER = [[0, [42, 167, 201]], [20, [22, 127, 168]], [50, [11, 76, 122]], [85, [6, 42, 77]], [MAX_DEPTH + 10, [2, 13, 30]]];
  function waterAt(m) {
    for (let i = 1; i < WATER.length; i++) {
      if (m <= WATER[i][0]) {
        const a = WATER[i - 1], b = WATER[i], t = clamp((m - a[0]) / (b[0] - a[0]), 0, 1);
        return a[1].map((v, k) => Math.round(lerp(v, b[1][k], t)));
      }
    }
    return WATER[WATER.length - 1][1];
  }

  // ---------- Fish (pixel maps: F tail/fin, D top, B body, L belly, E eye, W white, S stripe/spike, T tentacle/teeth, G glow, A antenna) ----------
  const RARITY = {
    common: { color: '#9ca3af', w: 60, label: 'Common' },
    uncommon: { color: '#5dffb0', w: 26, label: 'Uncommon' },
    rare: { color: '#4fd1ff', w: 10, label: 'Rare' },
    epic: { color: '#c084fc', w: 3.5, label: 'Epic' },
    legendary: { color: '#ffd23f', w: 1.2, label: 'Legendary' },
  };
  const SPECIES = [
    { id: 'sardine', name: 'Sardine', zone: 0, rarity: 'common', pts: 10, str: 0.5, speed: [22, 30],
      map: ['.....DDD...', 'F..DBBBBBD.', 'FFBBBBBBEBB', 'F..LLLLLLL.', '.....LL....'],
      pal: { F: '#8fb8d6', D: '#3d6e9e', B: '#9fd0f0', L: '#e8f6ff', E: '#0b0b14' } },
    { id: 'mackerel', name: 'Mackerel', zone: 0, rarity: 'common', pts: 15, str: 0.7, speed: [26, 34],
      map: ['......DD.....', 'F..DSBSBSBD..', 'FFBBBBBBBBEBB', 'F..LLLLLLLLL.', '.......L.....'],
      pal: { F: '#4a7fa8', D: '#1e3a5f', B: '#6fa8cf', S: '#1e3a5f', L: '#e2eef7', E: '#0b0b14' } },
    { id: 'clown', name: 'Clownfish', zone: 0, rarity: 'uncommon', pts: 25, str: 0.6, speed: [14, 20],
      map: ['....DD....', 'F..BWBBWB.', 'FFBBWBBWEB', 'FFBBWBBWBB', 'F..BWBBWB.', '....DD....'],
      pal: { F: '#ff7a1a', D: '#c2410c', B: '#ff8c2a', W: '#ffffff', E: '#0b0b14' } },
    { id: 'squid', name: 'Squid', zone: 1, rarity: 'common', pts: 30, str: 0.9, speed: [16, 24],
      map: ['....BBBBB...', 'TTTBBBBBBBB.', 'TTTBBBBBEBBB', 'TTTBBBBBBBB.', '....BBBBB...'],
      pal: { B: '#f4a7b9', T: '#e07a95', E: '#0b0b14' } },
    { id: 'puffer', name: 'Pufferfish', zone: 1, rarity: 'uncommon', pts: 35, str: 0.8, speed: [8, 12],
      map: ['..S.S.S..', '.SBBBBBS.', 'FBBBBBEBS', 'FBBBBBBBB', 'FBLLLLLBS', '.SLLLLLS.', '..S.S.S..'],
      pal: { F: '#d9b45a', S: '#8a6a1e', B: '#f2d27a', L: '#fff6d6', E: '#0b0b14' } },
    { id: 'tuna', name: 'Bluefin Tuna', zone: 1, rarity: 'rare', pts: 70, str: 1.4, speed: [30, 40],
      map: ['.......DD......', '....DDBBBBD....', 'F.DBBBBBBBBBD..', 'FFBBBBBBBBBBEBB', 'F.LLLLLLLLLLLL.', '....LLLLLLL....', '.......L.......'],
      pal: { F: '#2b4f7a', D: '#1b2f4f', B: '#3f6f9f', L: '#d7e3ee', E: '#0b0b14' } },
    { id: 'lantern', name: 'Lanternfish', zone: 2, rarity: 'common', pts: 50, str: 0.8, speed: [14, 20], glow: '#7dffea',
      map: ['....DD...', 'F.BBBBBG.', 'FFBBBBEBB', 'F.LGLGLL.'],
      pal: { F: '#3a4a6b', B: '#4f6488', L: '#8fa3c4', E: '#0b0b14', G: '#7dffea', D: '#2a3550' } },
    { id: 'opah', name: 'Moonfish', zone: 2, rarity: 'uncommon', pts: 90, str: 1.2, speed: [12, 18],
      map: ['....DDD....', '..DBBWBBD..', '.BBWBBBBBB.', 'FBBBBBWBEBB', 'FFBBWBBBBBB', 'FBBBBBBWBB.', '.LLLLLLLLL.', '..LLLLLL...', '....FF.....'],
      pal: { F: '#ff5e5e', D: '#a12a3a', B: '#e8455a', W: '#ffe3e8', L: '#f7a1ad', E: '#0b0b14' } },
    { id: 'sword', name: 'Swordfish', zone: 2, rarity: 'rare', pts: 130, str: 1.7, speed: [34, 46],
      map: ['.....DDD..........', 'F...DBBBBBD.......', 'FFBBBBBBBBBBEBSSSS', 'FFLLLLLLLLLLLLL...', 'F...LLLLLL........', '......L...........'],
      pal: { F: '#2c3e70', D: '#1d2a4f', B: '#4a63a8', L: '#c9d6f0', E: '#0b0b14', S: '#9aa8c8' } },
    { id: 'angler', name: 'Anglerfish', zone: 3, rarity: 'rare', pts: 160, str: 1.3, speed: [8, 12], glow: '#fff3a0',
      map: ['........AAG.', '.......A....', '...DDDDDD...', '.DBBBBBBBBD.', 'FBBBBBBBEBBT', 'FBBBBBBBBTTT', '.LLLLLLLLBT.', '...LLLLL....'],

  function releaseLine() { holding = false; castLock = false; }
  const btn = $('lineBtn');
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); try { btn.setPointerCapture(e.pointerId); } catch (err) {} pressLine(); });
  btn.addEventListener('pointerup', releaseLine);
  btn.addEventListener('pointercancel', releaseLine);
  btn.addEventListener('lostpointercapture', releaseLine);
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  // steer: move the mouse over the water, or drag on it
  const toWorldX = (e) => { const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / PX; };
  let dragId = null;
  stage.addEventListener('pointerdown', (e) => { initAudio(); dragId = e.pointerId; hook.tx = clamp(toWorldX(e), 4, W - 4); });
  stage.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.pointerId === dragId) hook.tx = clamp(toWorldX(e), 4, W - 4); });
  window.addEventListener('pointerup', (e) => { if (e.pointerId === dragId) dragId = null; });
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['Space', 'ArrowDown', 'ArrowUp', 'KeyS', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) { if (state === 'playing') pressLine(); else if (e.code === 'Space') startFromKey(); }
    }
    if (e.code === 'Enter' && !e.repeat && state !== 'playing') startFromKey();
    if (e.code.startsWith('Arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (['Space', 'ArrowDown', 'ArrowUp', 'KeyS', 'KeyW'].includes(e.code)) releaseLine();
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; releaseLine(); });
  let overReadyAt = 0;
  function startFromKey() { if (state === 'menu' || (state === 'over' && performance.now() > overReadyAt)) start(); }

  // Start / Fish again: only these buttons (or Space / Enter) start a game
  for (const id of ['startCta', 'retryCta']) {
    const b = $(id);
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('click', (e) => { e.stopPropagation(); b.blur(); startFromKey(); });
  }
  const soundBtn = $('sound');
  function refreshSound() { soundBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; }
  soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation(); muted = !muted; soundBtn.blur();
    try { localStorage.setItem('deepcastMuted', muted ? '1' : '0'); } catch (err) {}
    refreshSound(); if (!muted) { initAudio(); sfx.bite(); }
  });
  refreshSound();

  // ---------- Pause ----------
  // A pause button (shown only while a round is going), a "Paused" card, P / Esc to
  // toggle, and an automatic pause when you switch away from the game. While paused,
  // taps and keys don't reach the game, so the tap that resumes doesn't also play.
  const Pause = (() => {
    const cfg = {
      theme: 'neon',
      top: 'calc(env(safe-area-inset-top) + 8px)', right: 'calc(env(safe-area-inset-right) + 104px)',
      isPlaying: () => (state === 'playing'),
      restart: () => { start(); },
      menu: () => { toMenu(); },
      onChange: () => { for (const k in keys) keys[k] = false; releaseLine(); },
    };
    const coarse = window.matchMedia('(pointer: coarse)').matches;
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>';
    const ICON_PLAY = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
    const css = document.createElement('style');
    css.textContent = `
      #pauseBtn { position: fixed; top: ${cfg.top}; right: ${cfg.right}; z-index: 8; display: none; place-items: center; cursor: pointer; padding: 0;
        width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(120,200,255,.18); background: rgba(10,30,60,.7); color: #e6f6ff; }
      #pauseBtn.show { display: grid; }
      #pauseBtn:active { transform: scale(.92); }
      #pausedCard { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; text-align: center;
        background: radial-gradient(ellipse at center, rgba(3,10,25,.5), rgba(3,8,20,.88)); }
      #pausedCard.on { display: flex; }
      #pausedCard .pc-in { color: #fff; }
      #pausedCard .pc-t { font-family: 'Press Start 2P', monospace; font-size: clamp(26px, 8vw, 44px); letter-spacing: .08em; line-height: 1;
        text-shadow: 0 0 18px rgba(79,209,255,.7), 0 5px 0 #0b6c9e; }
      #pausedCard .pc-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 22px auto 0; width: min(92vw, 470px); }
      #pausedCard .pc-b { cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: .06em; padding: 12px 14px; white-space: nowrap;
        border-radius: 10px; border: 2px solid rgba(126,232,255,.5); color: #fff; background: rgba(10,40,80,.85); box-shadow: 0 4px 0 #031a33; }
      #pausedCard .pc-b[data-act="resume"] { background: linear-gradient(180deg, #ffd23f, #f59e0b); color: #3b2304; border-color: #fde68a; box-shadow: 0 4px 0 #a16207; }
      #pausedCard .pc-b:active { transform: translateY(3px); }
      #pausedCard .pc-k { margin-top: 12px; font-size: 11px; opacity: .55; }
      @media (max-width: 440px) { #pausedCard .pc-b { font-size: 8.5px; padding: 11px 10px; } #pausedCard .pc-btns { gap: 6px; width: 96vw; } }
    `;
    document.head.appendChild(css);
    const btnP = document.createElement('button');
    btnP.id = 'pauseBtn'; btnP.type = 'button'; btnP.title = 'Pause (P)'; btnP.setAttribute('aria-label', 'Pause');
    btnP.innerHTML = ICON_PAUSE;
    const card = document.createElement('div');
    card.id = 'pausedCard';
    card.innerHTML = `<div class="pc-in"><div class="pc-t">PAUSED</div>`
      + `<div class="pc-btns"><button type="button" class="pc-b" data-act="resume">▶ RESUME</button><button type="button" class="pc-b pc-r" data-act="retry">↻ RETRY</button><button type="button" class="pc-b pc-r" data-act="menu">☰ MENU</button></div>`
      + `<div class="pc-k">${coarse ? 'or tap anywhere to resume' : 'P / Esc to resume · R to retry · M for menu'}</div></div>`;
    document.body.appendChild(btnP);
    document.body.appendChild(card);
    card.querySelectorAll('.pc-b').forEach((b) => {
      b.addEventListener('pointerdown', (e) => e.stopPropagation());
      b.addEventListener('click', (e) => {
        e.stopPropagation(); b.blur();
        set(false);
        if (b.dataset.act === 'retry') cfg.restart();
        else if (b.dataset.act === 'menu') cfg.menu();
      });
    });
    let paused = false;
    function set(p) {
      if (p && !cfg.isPlaying()) return;
      if (p === paused) return;
      paused = p;
      card.classList.toggle('on', p);
      btnP.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
      btnP.setAttribute('aria-label', p ? 'Resume' : 'Pause');
      btnP.title = p ? 'Resume (P)' : 'Pause (P)';
      cfg.onChange(p);
    }
    btnP.addEventListener('pointerdown', (e) => e.stopPropagation());
    btnP.addEventListener('click', (e) => { e.stopPropagation(); btnP.blur(); set(!paused); });
    window.addEventListener('pointerdown', (e) => {
      if (!paused) return;
      const b = e.target.closest && e.target.closest('button');
      if (b) return;
      e.stopImmediatePropagation();
      set(false);
    }, true);
    window.addEventListener('pointermove', (e) => { if (paused) e.stopImmediatePropagation(); }, true);
    window.addEventListener('keydown', (e) => {
      const k = e.code;
      const toggleKey = k === 'KeyP' || k === 'Escape';
      if (paused) {
        e.stopImmediatePropagation(); e.preventDefault();
        if (!e.repeat && (toggleKey || k === 'Space' || k === 'Enter' || k === 'NumpadEnter')) set(false);
        else if (!e.repeat && k === 'KeyR') { set(false); cfg.restart(); }
        else if (!e.repeat && k === 'KeyM') { set(false); cfg.menu(); }
        return;
      }
      if (toggleKey && !e.repeat && cfg.isPlaying()) { e.preventDefault(); e.stopImmediatePropagation(); set(true); }
    }, true);
    document.addEventListener('visibilitychange', () => { if (document.hidden) set(true); });
    window.addEventListener('blur', () => set(true));
    return {
      get paused() { return paused; },
      set,
      sync() {
        const show = cfg.isPlaying() || paused;
        if (btnP.classList.contains('show') !== show) btnP.classList.toggle('show', show);
        if (paused && !cfg.isPlaying()) set(false);
      },
    };
  })();

  // ---------- Start ----------
  resize();
  reset();
  const _endDay = endDay;
  endDay = function () { overReadyAt = performance.now() + 900; _endDay(); };
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    Pause.sync();
    if (!Pause.paused) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  // redraw once the pixel font has loaded so canvas text uses it
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
</script>
</body>
</html>
