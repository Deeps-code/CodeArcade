  <rect x="58" y="86" width="9" height="6" fill="#4b3a66"/><rect x="66" y="88" width="1" height="1" fill="#ffe066"/><rect x="67" y="82" width="1" height="4" fill="#6b5a86"/><rect x="68" y="81" width="2" height="2" fill="#fff3a0"/>
  <rect y="96" width="160" height="4" fill="#141a2b"/>
  <rect x="18" y="94" width="6" height="2" fill="#28314d"/><rect x="104" y="94" width="8" height="2" fill="#28314d"/>
