  <g transform="translate(100 69)"><rect x="9" y="1" width="2" height="3" fill="#ff5e5e"/><rect x="1" y="0" width="8" height="5" fill="#e8455a"/><rect x="3" y="1" width="1" height="1" fill="#ffe3e8"/><rect x="2" y="2" width="1" height="1" fill="#0b0b14"/></g>
