  <g fill="#f0abfc" opacity="0.85"><rect x="140" y="74" width="6" height="2"/><rect x="141" y="72" width="4" height="2"/><rect x="140" y="76" width="1" height="4"/><rect x="142" y="76" width="1" height="5"/><rect x="144" y="76" width="1" height="4"/></g>
